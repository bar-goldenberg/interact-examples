<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow — Wix Interact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Geometry tokens — kept in sync with the keyframe constants in the module below.
       --hp is half of the element's own size at the start/end scale (percentages in
       `translate()` resolve against the element box), so a title can be corner-aligned
       with pure transforms and no measuring JS. */
    :root {
      --s: .56;
      --hp: 28%;
      --pad: 48px;
      --topy: 150px;
      --boty: 170px;
    }
    @media (max-width: 767px) {
      :root { --s: .64; --hp: 32%; --pad: 24px; --topy: 96px; --boty: 120px; }
    }

    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #000; overscroll-behavior: none; }
    ::selection { background: white; color: black; }

    /* ── Root (fixed overlay) ── */
    .slideshow {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: clip;
      background: #000;
      color: #fff;
      z-index: 1;
      pointer-events: none;
    }

    /* ── Scroll track (creates page height, drives viewProgress) ── */
    .scroll-track { position: relative; z-index: 0; }
    .scroll-track interact-element { display: block; }
    .scroll-section { height: 100vh; }

    /* ── Background panels ──
       Wipe is a transform on an inner layer inside an `overflow: clip` panel
       (no animated clip-path / filter — those were the main cost per frame).
       Later panels sit above earlier ones by DOM order, so no z-index churn. */
    .bg-layer { position: absolute; inset: 0; z-index: 0; }
    .bg-layer interact-element { display: block; }

    .bg-panel { position: absolute; inset: 0; overflow: clip; }
    .panel-media {
      position: absolute; inset: 0;
      transform: translateY(100%);
      will-change: transform;
    }
    .bg-panel-0 .panel-media { transform: translateY(0); }
    .panel-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dim { position: absolute; inset: 0; background: #000; opacity: .55; }
    .bg-panel-0 .dim { opacity: .4; }

    /* One shared grain/scanline layer instead of one per panel */
    .grain {
      position: absolute; inset: 0; z-index: 5; pointer-events: none;
    }
    .grain::before {
      content: ''; position: absolute; inset: 0; opacity: .18;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .grain::after {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%),
        linear-gradient(90deg, rgba(255,0,0,.06), rgba(0,255,0,.02), rgba(0,0,255,.06));
      background-size: 100% 4px, 3px 100%;
    }

    /* ── UI layer ── */
    .ui-layer {
      position: relative; z-index: 30;
      width: 100%; height: 100%;
      padding: 1.5rem;
      display: flex; flex-direction: column; justify-content: space-between;
      pointer-events: none;
    }
    @media (min-width: 768px) { .ui-layer { padding: 3rem; } }

    .top-row, .bottom-row {
      display: flex; justify-content: space-between; align-items: flex-start; width: 100%;
    }
    .bottom-row { align-items: flex-end; }

    /* stacked slide texts share one grid cell so all four can coexist */
    .clip-box { overflow: clip; position: relative; display: grid; }
    .clip-box > * { grid-area: 1 / 1; }
    .top-left   .clip-box { height: 1.6em; }
    .top-center .clip-box { text-align: center; height: 1.8em; }
    .top-right  .clip-box { text-align: right; }
    .bottom-right .clip-box { text-align: right; }

    .top-center {
      position: absolute; left: 50%; top: 1.5rem;
      transform: translateX(-50%);
    }
    @media (min-width: 768px) { .top-center { top: 3rem; } }

    .slide-text { will-change: transform, opacity; }
    .slide-text:not(.is-first) { opacity: 0; transform: translateY(20px); }

    .category, .subtitle-text {
      display: block;
      font-family: 'Roboto Flex', sans-serif;
      font-size: .875rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 700;
    }
    .category { opacity: .8; }
    .subtitle-text { opacity: .8; }
    @media (min-width: 768px) { .category, .subtitle-text { font-size: 1rem; } }

    .number { display: block; font-size: 1.5rem; font-family: ui-monospace, monospace; letter-spacing: -.05em; }
    .idx-label { font-size: 10px; letter-spacing: .2em; opacity: .6; font-family: ui-monospace, monospace; display: block; text-align: center; margin-top: .5em; }

    .description {
      font-size: .75rem; max-width: 250px; text-align: right; opacity: .7;
      line-height: 1.6; font-family: ui-monospace, monospace;
    }

    .bottom-right { display: block; }
    @media (max-width: 767px) {
      .bottom-row { flex-direction: column; align-items: flex-start; gap: 45px; }
      .bottom-right { order: -1; }
      .bottom-right .clip-box { text-align: left; }
      .description { text-align: left; }
    }

    /* ── Indicators (anchor links — native smooth scroll, no JS) ── */
    .indicators { display: flex; gap: .5rem; align-items: flex-end; padding-bottom: .25rem; pointer-events: auto; }
    .dot {
      display: block;
      width: 64px; height: 3px; border-radius: 9999px;
      background: rgba(255,255,255,.3);
      transform: scaleX(.375); transform-origin: left center;
      will-change: transform;
    }
    .dot.is-first { transform: scaleX(1); background: #fff; }
    .dot:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }

    /* ── Title layer ── */
    .title-layer {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; overflow: clip;
    }
    .title-layer interact-element {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }

    .title-el {
      position: relative;
      font-family: 'Instrument Serif', serif;
      font-size: clamp(3rem, 10vw, 10rem);
      font-weight: 400; letter-spacing: -.02em;
      color: #fff; mix-blend-mode: overlay;
      white-space: nowrap; line-height: 1;
      text-shadow: 0 0 30px rgba(0,0,0,.5);
      will-change: transform;
      pointer-events: auto;
      user-select: text;
      cursor: text;
      /* default: parked fully off-screen top-left */
      transform: translate(calc(-50vw - var(--hp) - 80px), calc(-50vh - var(--hp) - 80px)) scale(var(--s));
    }
    .title-el.is-first {
      /* genesis anchor: top-left, aligned under the category label */
      transform: translate(calc(-50vw + var(--pad) + var(--hp)), calc(-50vh + var(--topy) + var(--hp))) scale(var(--s));
    }
    .title-underline {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 2px;
      background: #fff;
      transform: scaleX(0);
      transform-origin: left;
      will-change: transform;
    }

    .category, .subtitle-text, .number, .idx-label, .description {
      pointer-events: auto;
      user-select: text;
      cursor: text;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }

    /* ── Chevron ── */
    .chevron {
      position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      z-index: 30; opacity: .5;
      animation: pulse 2s ease-in-out infinite;
      cursor: pointer;
      pointer-events: auto;
      color: inherit;
      display: block;
    }
    .chevron:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 2px; }
    @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:.8 } }
    .chevron svg { width: 24px; height: 24px; display: block; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .chevron { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Fixed slideshow visual layer -->
  <div class="slideshow" role="region" aria-roledescription="slideshow" aria-label="Image slideshow">

    <!-- BG panels -->
    <div class="bg-layer">
      <interact-element data-interact-key="bg-0">
        <div class="bg-panel bg-panel-0">
          <div class="panel-media">
            <img src="https://images.unsplash.com/photo-1555255707-c07966088b7b?q=75&w=1920&auto=format&fit=crop" alt="Soul Matters" fetchpriority="high" decoding="async">
            <div class="dim"></div>
          </div>
        </div>
      </interact-element>
      <interact-element data-interact-key="bg-1">
        <div class="bg-panel">
          <div class="panel-media">
            <img src="https://images.unsplash.com/photo-1506452819137-0422416856b8?q=75&w=1920&auto=format&fit=crop" alt="Void Walker" loading="lazy" decoding="async">
            <div class="dim"></div>
          </div>
        </div>
      </interact-element>
      <interact-element data-interact-key="bg-2">
        <div class="bg-panel">
          <div class="panel-media">
            <img src="https://images.unsplash.com/photo-1535868463750-c78d9543614f?q=75&w=1920&auto=format&fit=crop" alt="Neon Dust" loading="lazy" decoding="async">
            <div class="dim"></div>
          </div>
        </div>
      </interact-element>
      <interact-element data-interact-key="bg-3">
        <div class="bg-panel">
          <div class="panel-media">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=75&w=1920&auto=format&fit=crop" alt="Cyber Zen" loading="lazy" decoding="async">
            <div class="dim"></div>
          </div>
        </div>
      </interact-element>
    </div>

    <!-- Shared grain + scanlines -->
    <div class="grain" aria-hidden="true"></div>

    <!-- UI -->
    <interact-element data-interact-key="ui">
      <div class="ui-layer">
        <!-- Top -->
        <div class="top-row">
          <div class="top-left">
            <div class="clip-box">
              <span class="slide-text is-first s0 category">Genesis</span>
              <span class="slide-text s1 category">Process</span>
              <span class="slide-text s2 category">Entropy</span>
              <span class="slide-text s3 category">Synthesis</span>
            </div>
          </div>
          <div class="top-center">
            <div class="clip-box">
              <span class="slide-text is-first s0 number">001</span>
              <span class="slide-text s1 number">002</span>
              <span class="slide-text s2 number">003</span>
              <span class="slide-text s3 number">004</span>
            </div>
            <span class="idx-label" aria-hidden="true">INDEX</span>
          </div>
          <div class="top-right">
            <div class="clip-box">
              <span class="slide-text is-first s0 subtitle-text">Matter</span>
              <span class="slide-text s1 subtitle-text">Form</span>
              <span class="slide-text s2 subtitle-text">Void</span>
              <span class="slide-text s3 subtitle-text">Light</span>
            </div>
          </div>
        </div>
        <!-- Bottom -->
        <div class="bottom-row">
          <div class="indicators" role="list" aria-label="Slide navigation">
            <a class="dot is-first dot-0" href="#s0" role="listitem" aria-label="Slide 1: Soul Matters"></a>
            <a class="dot dot-1" href="#s1" role="listitem" aria-label="Slide 2: Void Walker"></a>
            <a class="dot dot-2" href="#s2" role="listitem" aria-label="Slide 3: Neon Dust"></a>
            <a class="dot dot-3" href="#s3" role="listitem" aria-label="Slide 4: Cyber Zen"></a>
          </div>
          <div class="bottom-right">
            <div class="clip-box">
              <p class="slide-text is-first s0 description">The internal architecture of silence.</p>
              <p class="slide-text s1 description">Echoes from the deep static.</p>
              <p class="slide-text s2 description">Fragments of a digital memory.</p>
              <p class="slide-text s3 description">Harmonic resonance in the machine.</p>
            </div>
          </div>
        </div>
      </div>
    </interact-element>

    <!-- Titles -->
    <div class="title-layer">
      <interact-element data-interact-key="title-0">
        <div class="title-el is-first">Soul Matters<div class="title-underline"></div></div>
      </interact-element>
      <interact-element data-interact-key="title-1">
        <div class="title-el">Void Walker<div class="title-underline"></div></div>
      </interact-element>
      <interact-element data-interact-key="title-2">
        <div class="title-el">Neon Dust<div class="title-underline"></div></div>
      </interact-element>
      <interact-element data-interact-key="title-3">
        <div class="title-el">Cyber Zen<div class="title-underline"></div></div>
      </interact-element>
    </div>

    <!-- Chevron -->
    <a class="chevron" href="#s1" aria-label="Scroll to next slide">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </a>
  </div>

  <!-- Scroll track: one section per slide + spacers so the last slide's exit range completes -->
  <div class="scroll-track">
    <interact-element data-interact-key="section-0"><div class="scroll-section" id="s0"></div></interact-element>
    <interact-element data-interact-key="section-1"><div class="scroll-section" id="s1"></div></interact-element>
    <interact-element data-interact-key="section-2"><div class="scroll-section" id="s2"></div></interact-element>
    <interact-element data-interact-key="section-3"><div class="scroll-section" id="s3"></div></interact-element>
    <div class="scroll-section" aria-hidden="true"></div>
    <div class="scroll-section" aria-hidden="true"></div>
  </div>

  <script type="module">
    import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

    /* Everything below builds a single declarative config — no scroll listeners,
       no requestAnimationFrame loop, no Element.animate() calls, no per-frame
       style writes. Each 100vh section owns a ViewTimeline ('exit' 0% → 100%),
       which is exactly the old scrollY/vh - i progress, and every property that
       animates is transform / opacity only. */

    const COUNT = 4;
    const isMobile = window.matchMedia('(max-width: 767px)').matches;

    // Mirrors the CSS custom properties at the top of the stylesheet.
    const S     = isMobile ? 0.64 : 0.56;          // start/end scale
    const HP    = `${(S * 50).toFixed(2)}%`;       // half the scaled element size
    const PAD   = isMobile ? 24 : 48;
    const TOPY  = isMobile ? 96 : 150;
    const BOTY  = isMobile ? 120 : 170;

    const GENESIS = `translate(calc(-50vw + ${PAD}px + ${HP}), calc(-50vh + ${TOPY}px + ${HP})) scale(${S})`;
    const ENDPOS  = `translate(calc(50vw - ${PAD}px - ${HP}), calc(50vh - ${BOTY}px - ${HP})) scale(${S})`;
    const OFF_IN  = `translate(calc(-50vw - ${HP} - 80px), calc(-50vh - ${HP} - 80px)) scale(${S})`;
    const OFF_OUT = `translate(calc(50vw + ${HP} + 80px), calc(50vh + ${HP} + 80px)) scale(${S})`;
    const CENTER  = 'translate(0px, 0px) scale(1.2)';

    // Full section scrub range, with fill on both sides to avoid boundary flicker.
    const scrub = {
      rangeStart: { name: 'exit', offset: { value: 0, unit: 'percentage' } },
      rangeEnd:   { name: 'exit', offset: { value: 100, unit: 'percentage' } },
      fill: 'both',
    };

    // Title path: (off-screen →) genesis → hold → center hold → exit corner.
    const titleKeyframes = (i) => i === 0
      ? [
          { transform: GENESIS, offset: 0 },
          { transform: GENESIS, offset: 0.15 },
          { transform: CENTER,  offset: 0.35 },
          { transform: CENTER,  offset: 0.80 },
          { transform: OFF_OUT, offset: 1 },
        ]
      : [
          { transform: OFF_IN,  offset: 0 },
          { transform: GENESIS, offset: 0.07 },
          { transform: GENESIS, offset: 0.15 },
          { transform: CENTER,  offset: 0.35 },
          { transform: CENTER,  offset: 0.80 },
          { transform: i === COUNT - 1 ? ENDPOS : OFF_OUT, offset: 1 },
        ];

    const underlineKeyframes = [
      { transform: 'scaleX(0)', offset: 0 },
      { transform: 'scaleX(0)', offset: 0.35 },
      { transform: 'scaleX(1)', offset: 0.80 },
      { transform: 'scaleX(1)', offset: 1 },
    ];

    // UI text: rises in at the section boundary, holds, lifts out at the next one.
    const textKeyframes = (first) => [
      { opacity: first ? 1 : 0, transform: first ? 'translateY(0px)' : 'translateY(20px)', offset: 0 },
      { opacity: 1, transform: 'translateY(0px)',   offset: 0.06 },
      { opacity: 1, transform: 'translateY(0px)',   offset: 0.86 },
      { opacity: 0, transform: 'translateY(-20px)', offset: 0.96 },
      { opacity: 0, transform: 'translateY(-20px)', offset: 1 },
    ];

    const dotKeyframes = (first) => [
      { transform: first ? 'scaleX(1)' : 'scaleX(0.375)', backgroundColor: first ? 'rgb(255,255,255)' : 'rgba(255,255,255,0.3)', offset: 0 },
      { transform: 'scaleX(1)',     backgroundColor: 'rgb(255,255,255)',       offset: 0.06 },
      { transform: 'scaleX(1)',     backgroundColor: 'rgb(255,255,255)',       offset: 0.90 },
      { transform: 'scaleX(0.375)', backgroundColor: 'rgba(255,255,255,0.3)',  offset: 1 },
    ];

    // Background wipe: an inner layer slides up inside an `overflow: clip` panel.
    const wipeKeyframes = [
      { transform: 'translateY(100%)', offset: 0 },
      { transform: 'translateY(100%)', offset: 0.35 },
      { transform: 'translateY(0%)',   offset: 1 },
    ];

    const dimKeyframes = [
      { opacity: 0.55, offset: 0 },
      { opacity: 0.55, offset: 0.35 },
      { opacity: 0.4,  offset: 1 },
    ];

    const interactions = Array.from({ length: COUNT }, (_, i) => {
      const effects = [
        {
          key: `title-${i}`,
          ...scrub,
          keyframeEffect: { name: `titleDiag${i}`, keyframes: titleKeyframes(i) },
        },
        {
          key: `title-${i}`,
          selector: '.title-underline',
          ...scrub,
          keyframeEffect: { name: `titleRule${i}`, keyframes: underlineKeyframes },
        },
        {
          key: 'ui',
          selector: `.s${i}`,
          ...scrub,
          keyframeEffect: { name: `uiText${i}`, keyframes: textKeyframes(i === 0) },
        },
        {
          key: 'ui',
          selector: `.dot-${i}`,
          ...scrub,
          keyframeEffect: { name: `uiDot${i}`, keyframes: dotKeyframes(i === 0) },
        },
      ];

      if (i < COUNT - 1) {
        effects.push(
          {
            key: `bg-${i + 1}`,
            selector: '.panel-media',
            ...scrub,
            keyframeEffect: { name: `bgWipe${i + 1}`, keyframes: wipeKeyframes },
          },
          {
            key: `bg-${i + 1}`,
            selector: '.dim',
            ...scrub,
            keyframeEffect: { name: `bgDim${i + 1}`, keyframes: dimKeyframes },
          },
        );
      }

      return { key: `section-${i}`, trigger: 'viewProgress', effects };
    });

    Interact.create({ interactions });
  </script>
</body>
</html>
