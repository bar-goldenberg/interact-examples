<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    interact-element { display: block; }
    html, body { height: 100%; overflow: clip; }

    body {
      background: #0c0c0c;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-wrap {
      position: fixed;
      inset: 0;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }

    .bg-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 12, 0.55);
    }

    .bg-1 { background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80&w=1800'); }
    .bg-2 { background-image: url('https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&q=80&w=1800'); }
    .bg-3 { background-image: url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&q=80&w=1800'); }
    .bg-4 { background-image: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&q=80&w=1800'); }
    .bg-5 { background-image: url('https://images.unsplash.com/photo-1631679706909-1844bbd07221?auto=format&fit=crop&q=80&w=1800'); }

    .bg-wrap interact-element:not(:first-child) > div,
    .center-container interact-element:not(:first-child) > div { opacity: 0; }

    .center-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .shape-wrap { position: absolute; inset: -5%; }
    .shape-wrap > div { width: 100%; height: 100%; }
    .shape-wrap svg { width: 100%; height: 100%; }

    .text-overlay { position: relative; pointer-events: none; }

    .text-inner {
      text-align: center;
      pointer-events: auto;
      padding: clamp(3rem, 6vw, 6rem) clamp(3rem, 7vw, 8rem);
    }

    .label {
      font-size: clamp(0.55rem, 0.7vw, 0.75rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.4);
      margin-bottom: clamp(0.8rem, 1.5vw, 1.5rem);
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 4.2vw, 5rem);
      line-height: 1;
      font-weight: 400;
      margin-bottom: clamp(0.6rem, 1.2vw, 1.2rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #0c0c0c;
    }

    .description {
      font-size: clamp(0.7rem, 0.95vw, 0.95rem);
      line-height: 1.8;
      font-weight: 300;
      color: rgba(0, 0, 0, 0.55);
      max-width: clamp(200px, 28vw, 400px);
      margin: 0 auto;
    }

    .description a {
      color: rgba(0, 0, 0, 0.85);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(0, 0, 0, 0.3);
    }

    .description a:hover {
      text-decoration-color: rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>

  <div class="bg-wrap">
    <interact-element data-interact-key="bg-1" class="bg-layer"><div class="bg-img bg-1"></div></interact-element>
    <interact-element data-interact-key="bg-2" class="bg-layer"><div class="bg-img bg-2"></div></interact-element>
    <interact-element data-interact-key="bg-3" class="bg-layer"><div class="bg-img bg-3"></div></interact-element>
    <interact-element data-interact-key="bg-4" class="bg-layer"><div class="bg-img bg-4"></div></interact-element>
    <interact-element data-interact-key="bg-5" class="bg-layer"><div class="bg-img bg-5"></div></interact-element>
  </div>

  <div class="stage">
    <div class="center-container">

      <interact-element data-interact-key="mask-1" class="shape-wrap">
        <div><svg viewBox="0 0 519 479" preserveAspectRatio="none" fill="none"><path d="M0 0H518.5V479H0V0Z" fill="#fff"/></svg></div>
      </interact-element>

      <interact-element data-interact-key="mask-2" class="shape-wrap">
        <div><svg viewBox="0 0 525 495" preserveAspectRatio="none" fill="none"><path d="M0 200C0 89.5431 89.5431 0 200 0H525V295C525 405.457 435.457 495 325 495H0V200Z" fill="#fff"/></svg></div>
      </interact-element>

      <interact-element data-interact-key="mask-3" class="shape-wrap">
        <div><svg viewBox="0 0 501 495" preserveAspectRatio="none" fill="none"><rect width="501" height="495" rx="247.5" fill="#fff"/></svg></div>
      </interact-element>

      <interact-element data-interact-key="mask-4" class="shape-wrap">
        <div><svg viewBox="0 0 501 495" preserveAspectRatio="none" fill="none"><path d="M365 0C376.046 0 385.001 8.95431 385.001 20V110H481C492.046 110 501.001 118.954 501.001 130V475C501.001 486.046 492.046 495 481.001 495H136.001C124.955 495 116.001 486.046 116.001 475V385H20.001C8.95528 385 0 376.046 0 365V20C3.86565e-06 8.95447 8.95453 0.000263872 20 0H365Z" fill="#fff"/></svg></div>
      </interact-element>

      <interact-element data-interact-key="mask-5" class="shape-wrap">
        <div><svg viewBox="0 0 501 495" preserveAspectRatio="none" fill="none"><path d="M249.568 43.6777L286.817 0H481C492.046 2.9185e-06 501 8.95431 501 20V180.287L428.079 247.5L501 314.713V475C501 486.046 492.046 495 481 495H288.681L251.432 451.322L214.183 495H20C8.95432 495 1.89637e-05 486.046 0 475V314.713L72.9199 247.5L0 180.287V20C0 8.95431 8.95431 1.49578e-07 20 0H212.319L249.568 43.6777Z" fill="#fff"/></svg></div>
      </interact-element>

      <div class="text-overlay">
        <div class="text-inner">
          <p class="label">Architecture Studio</p>
          <h2 class="title">Shaping<br>Space &amp; Light</h2>
          <p class="description">We design buildings that move people. Every project begins with listening — to the site, the purpose, and the people who will inhabit it. <a href="#">Start a project</a></p>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

    const CYCLE = 7500;
    const STEPS = 5;
    const SHAPE_FADE = 0.035;
    const BG_FADE = 0.06;

    // Layers are stacked in DOM order and crossfade by opacity. A naive
    // symmetric crossfade leaves BOTH layers translucent at the midpoint, so the
    // photo behind bleeds through the white shape (the washed-out "tinted blob"
    // artifact) and the text loses its solid backing. Instead the incoming layer
    // fades in *on top of* the still-opaque outgoing one, and the outgoing layer
    // only fades out once the incoming one is fully opaque — so the union of the
    // two is opaque for the whole transition.
    function layerKeyframes(index, fade) {
      const start = index / STEPS;
      const next = (index + 1) / STEPS;

      if (index === STEPS - 1) {
        // Top-most layer: its fade-out wraps around the loop boundary, above the
        // first layer which has already faded back in underneath it.
        return [
          { opacity: 1, offset: 0 },
          { opacity: 1, offset: fade },
          { opacity: 0, offset: fade * 2 },
          { opacity: 0, offset: start },
          { opacity: 1, offset: start + fade },
          { opacity: 1, offset: 1 },
        ];
      }

      const kf = [{ opacity: 0, offset: 0 }];
      if (start > 0) kf.push({ opacity: 0, offset: start });
      kf.push({ opacity: 1, offset: start + fade });
      kf.push({ opacity: 1, offset: next + fade });
      kf.push({ opacity: 0, offset: next + fade * 2 });
      kf.push({ opacity: 0, offset: 1 });
      return kf;
    }

    function cycleInteraction(fade) {
      return (key, index) => ({
        key,
        trigger: 'viewEnter',
        params: { threshold: 0 },
        effects: [
          {
            keyframeEffect: {
              name: `cycle-${key}`,
              keyframes: layerKeyframes(index, fade),
            },
            duration: CYCLE,
            iterations: Infinity,
            easing: 'linear',
            fill: 'both',
            triggerType: 'once',
          },
        ],
      });
    }

    Interact.create({
      interactions: [
        ...['mask-1', 'mask-2', 'mask-3', 'mask-4', 'mask-5'].map(cycleInteraction(SHAPE_FADE)),
        ...['bg-1', 'bg-2', 'bg-3', 'bg-4', 'bg-5'].map(cycleInteraction(BG_FADE)),
      ],
    });
  </script>

</body>
</html>
