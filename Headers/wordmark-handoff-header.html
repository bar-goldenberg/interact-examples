<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo handoff header — My Logo</title>
    <style>
      /* Reproduction of the header move in Aug-16-2026 13-58-17.gif, with generic
         text. The clip is a 1738x490 crop of a browser window, 26 frames at 70ms,
         so only the top band of the page is visible; the numbers below are read off
         that crop and scaled to proportions rather than copied as pixels.

         What this file does:

           - a first screen of grey that holds nothing but a scroll cue;
           - a second screen of black that rises over it as you scroll;
           - a small centred nav pill that stays put the whole time, frosts as the
             black arrives under it, and swaps its centre slot from the name set out
             in full to the mark on its own.

         The clip fills its first screen with an oversized wordmark and its second
         with a photograph. Both are stripped here by request, down to two plain
         planes — so the piece is now only the bar's response to the second one
         arriving, and the whole of the choreography sits in the last third of the
         scroll where that is actually happening.

         The mark, the type stack, the shadow, the page grey and the pill metrics are
         taken from collapsing-logo-header.html in this folder, so the two read as one
         design system. The mark appears exactly once, in the bar, as the state the
         name resolves into.

         Two things the clip does badly are fixed here. Its pill goes half-opaque over
         a dark backdrop and turns muddy grey; here the plate is opaque enough to carry
         black text over black. And its label swap happens in a single frame, so here
         the two halves are pulled apart into an out-then-in with a gap between them.

         One rule governs the whole config: ONE EFFECT PER ELEMENT. Two effects that
         resolve to the same selector are emitted into the same custom property and
         the second silently erases the first. Anything that happens to one element in
         stages is written as one effect with staged keyframes. See the note at the
         head of the config.

         Measured off the clip: the panel's top edge runs 490 -> 446 -> 306 -> 116 ->
         4 across four frames, i.e. it tracks the scroll one-to-one and the "easing"
         in the recording is only the shape of someone's scroll wheel. So nothing
         here eases the panel itself: it is the page, and the scroll drives it.

         Built with @wix/interact v2.5.5 (https://wix.github.io/interact/llms.txt).
         Everything is inline — styles, the Interact config, the pre-generated CSS
         and the library runtime. No build step, no server: open the file directly. */

      :root {
        /* Three neutrals, no colour. --paper is collapsing-logo-header's own page
           grey, which is what makes white usable as a third value rather than as the
           background itself: the bar's plate can now be a white capsule sitting on
           the page, the way that file's surface does, instead of white on white.
           The piece hands off from this grey to black. */
        --paper: #eeeeee;
        --white: #ffffff;
        --ink: #000000;

        /* Type, shadow and pill geometry lifted from collapsing-logo-header.html, so
           the two files read as the same design system. Its stack is local-only —
           no webfont request, which also means this file no longer needs the network
           for anything. */
        --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
        /* The one shadow in that design. Its two layers are carried over at the
           same offsets, blurs and opacities, but neutralised: the source tints them
           rgb(16, 18, 27), a very slightly blue black. At 5% and 7% that tint is
           near-invisible, and it was the last non-neutral value left in the file. */
        --shadow:
          0 1px 1px rgba(0, 0, 0, 0.05),
          0 4px 12px rgba(0, 0, 0, 0.07);
        /* Its lockup metrics. --chip-gap is gone with the mark that used to sit
           beside the label: the two states of the centre slot never appear together,
           so there is nothing left to space apart. */
        --chip-h: 40px;
        --mark: 22px;

        /* One spacing scale for the bar, all multiples of 2 and mostly of 8, taken
           off collapsing-logo-header's own numbers: it spaces its header children by
           16 and pads its pill by 8. The bar's side padding is that file's
           --edge-pad, 18, which is also the diameter of the count circle. Before
           this the bar used 14, 5 and 18 — three unrelated numbers, which is what
           made the right-hand group sit off the rhythm of everything else. */
        --gap: 16px;
        --gap-inner: 8px;
        --edge-pad: 18px;

        /* The nav pill measured ~38% of the window's width in the clip, centred,
           with its top edge about 3% of the window height down. 660px is that
           proportion on a desktop window, capped so it never touches the edges. */
        --bar-w: min(660px, calc(100% - 32px));
        --bar-h: 46px;
        --bar-top: 16px;

      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* Every anchor, not just the ones that happen to have a class rule. .bar__centre
         wraps the whole centre lockup and had neither colour nor decoration of its
         own, so the label and — through `fill: currentColor` — the mark itself were
         being drawn in the user agent's default link blue, underlined. That was the
         only real colour left in the piece. Anchors are also the only elements here
         that carry a UA colour at all, so one rule closes the whole class of bug. */
      a {
        color: inherit;
        text-decoration: none;
      }

      /* The other two places a browser supplies its own colour. Selection is blue by
         default on every platform, and the focus ring follows the OS accent — which
         is very often blue too. Both are stated in the page's own two colours. */
      ::selection {
        background: var(--ink);
        color: var(--white);
      }

      :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }

      html {
        /* The whole piece is scroll-scrubbed, so a smooth scroll would only add lag
           between the wheel and the animation. */
        scroll-behavior: auto;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* An unknown element is inline by default, which would wrap the block-level
         track in an inline box and force anonymous block boxes around it. */
      interact-element {
        display: block;
      }

      /* ---------------------------------------------------------------------
         The scroll track.

         This is the ViewTimeline source. It is exactly two screens tall — grey then
         black — so the `contain` range (the span during which the track fully covers
         the viewport) is precisely the one screen of scroll that carries the grey
         away. That makes `contain 0%` the top of the page and `contain 100%` the
         moment the black lands, and every range in the config below reads as a
         percentage of the handoff itself.

         The track is now the whole document: the section of ordinary page that used
         to follow it is gone. That leaves the last scroll position of the page and
         `contain 100%` as the same point, which is what you want here — the animation
         ends exactly when the page does, with no dead scroll after it. Anything added
         later should go inside .track, and its fixed height dropped; putting it after
         .track instead would work too, but only the descendants of .track can see the
         timeline name declared on it, so the bar could not follow.

         Note `overflow: clip` rather than `hidden` on the sections inside: `hidden`
         would create a scroll container and break the view timeline outright.
         --------------------------------------------------------------------- */
      .track {
        position: relative;
      }

      /* ---------------------------------------------------------------------
         The bar.
         --------------------------------------------------------------------- */
      /* A sticky header, and it can be one now — it could not always.
         `position: sticky` is constrained by the nearest block ancestor, which is
         .track; while there was a section of ordinary page after .track, a sticky bar
         came unstuck at the track's end and scrolled away with it, so it had to be
         `fixed` instead. .track is the whole document now, so sticky holds for the
         entire scroll and is the better tool: it stays in the flow and in the DOM,
         which matters because the timeline name declared on .track is only visible to
         .track's descendants.

         `margin-bottom: -(bar height)` cancels the room it takes in that flow, so the
         first screen still starts at the very top of the page and is a full screen
         tall rather than a screen minus a header — which is also what keeps .track
         exactly two screens and the contain range exactly one screen of scroll.

         Centred with `margin-inline: auto` rather than the left/translate pair a
         fixed element needs. That also leaves `translate` unused and therefore free,
         which is worth having: the plate's hover effect owns `transform`, so nothing
         here can collide with it. */
      .bar {
        position: sticky;
        top: var(--bar-top);
        z-index: 3;

        width: var(--bar-w);
        height: var(--bar-h);
        margin: 0 auto calc(-1 * var(--bar-h));

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--gap);
        padding: 0 var(--edge-pad);
      }

      /* The plate. A separate element from .bar so the blur can be animated without
         the text inheriting it, and so it can sit at zero opacity at the very top of
         the page, where the black links have nothing behind them but white.

         White at 0.94 rather than a light tint, because what it has to carry black
         text over is a black screen — a half-opaque plate over that is the grey smear
         the clip suffers from. Now that the page is grey rather than white the plate
         also reads as a real capsule for the whole of its life, which is how
         collapsing-logo-header's surface behaves. The blur stays for the black half,
         where it is the only thing the plate does beyond being white. */
      .bar__frost {
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        /* Starting keyframe restated in plain CSS so the plate is invisible from
           first paint, before any animation is attached. */
        opacity: 0;
        /* Decorative, and it covers the whole bar — without this it would swallow
           pointer events in the gaps between the links. */
        pointer-events: none;
        will-change: opacity, backdrop-filter, transform;
      }

      /* All three slots are given the same height and centre their own contents in
         it, so the links, the label and the mark sit on one line the bar defines
         rather than on three lines their own content happens to produce. Flex
         `align-items: center` on .bar would centre three boxes of three different
         heights; this centres three boxes of one height. */
      .bar__side {
        display: flex;
        align-items: center;
        gap: var(--gap);
        flex: 1 1 0;
        height: var(--chip-h);
      }

      .bar__side--end {
        justify-content: flex-end;
      }

      /* inline-flex, not inline: the count is a 18px circle sitting next to 13px
         text, and as an inline box it was aligned on the text's baseline — which put
         its centre well below the text's. A flex line centres the two against each
         other instead, which is the actual intent. line-height: 1 so the anchor's box
         is the type's own height and nothing depends on the font's default leading. */
      .bar__link {
        display: inline-flex;
        align-items: center;
        gap: var(--gap-inner);
        color: inherit;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.01em;
        white-space: nowrap;
        opacity: 0.82;
      }

      .bar__link:hover,
      .bar__link:focus-visible {
        opacity: 1;
      }

      /* The rule that wipes in under a link. A real element, not a ::after, because
         Interact resolves targets with querySelector and cannot address a pseudo-
         element — and this has to be an Interact effect like everything else that
         moves in this file. It is driven per link by a `listContainer` interaction,
         which attaches the trigger to each link and pairs it with the rule inside
         that same link; a plain selector would have matched all four and wiped them
         in together.

         Absolutely positioned, so it takes no part in the link's flex layout and
         picks up none of its gap. */
      .bar__link {
        position: relative;
      }

      .bar__rule {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -5px;
        height: 1px;
        background: currentColor;
        transform-origin: left center;
        /* Starting keyframe restated for first paint, as the docs require for any
           effect that is not viewEnter + once. */
        scale: 0 1;
        will-change: scale;
      }

      /* 18px, even, so its centre lands on a whole pixel against the bar's own even
         height — and the same 18 as the bar's side padding, so the circle reads as
         one unit of the bar's rhythm rather than as a size of its own. The gap to the
         word is the shared --gap-inner; it used to be a one-off 5px margin. */
      .bar__count {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 10px;
        line-height: 1;
        opacity: 0.75;
      }

      /* The centre slot. Both labels are stacked in the same grid cell so the swap
         is a cross-fade in place and neither one can shift the other's position —
         the pill's geometry never depends on which label is showing. */
      .bar__centre {
        position: relative;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        height: var(--chip-h);
      }

      /* Both states share one grid cell, so the swap is a cross-fade in place and
         neither can shift the other's position — the slot's geometry never depends on
         which state is showing. They also share the row height and the centring, so
         that the two of them and the side links are all resolving against the same
         40px band rather than against their own content. */
      .bar__wordtext,
      .bar__mark {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        height: var(--chip-h);
        white-space: nowrap;
        will-change: opacity, transform, filter;
      }

      /* The name, set out in full. Only the second state carries the mark, so the
         swap is a real change of sign rather than a lockup shedding a word — which is
         what the clip does, and what makes the second state worth arriving at.
         collapsing-logo-header gets there by collapsing its pill's width until the
         label is clipped away; here the bar's width is not what is animating, so the
         two states cross-fade in place instead. */
      .bar__label {
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        /* The source sets its label at -0.01em, which is right for mixed case and
           wrong for caps: capitals have no descenders or x-height variation to
           separate them, so they close up at negative tracking. Size and weight are
           the design system's; only the tracking is re-cut for the case. */
        letter-spacing: 0.07em;
        /* Tracking adds a trailing space after the last O that the box measures and
           the eye does not; pulling it back is what actually centres the words. */
        margin-right: -0.07em;
      }

      .bar__mark {
        /* Same reasoning as .bar__frost: hidden from first paint. */
        opacity: 0;
      }

      /* One square box for the glyph wherever it appears, so it is always centred on
         its own axis and can be scaled by changing one number. */
      .mark {
        display: block;
        width: var(--mark);
        height: var(--mark);
        fill: currentColor;
      }

      /* ---------------------------------------------------------------------
         Screen one — the masthead.

         Deliberately empty: a full screen of grey with nothing on it but the scroll
         cue. It is kept as a real section rather than collapsed into a spacer, so
         whatever goes here later inherits a centred grid and the right height, and
         the timeline arithmetic below does not have to be redone to take it. Note
         `overflow: clip` and not `hidden`: `hidden` would make this a scroll container
         and break the view timeline outright, so it is worth keeping even while there
         is nothing here to clip.
         --------------------------------------------------------------------- */
      .masthead {
        position: relative;
        height: 100vh;
        height: 100svh;
        display: grid;
        place-items: center;
        background: var(--paper);
        /* clip, never hidden — see the note on .track. */
        overflow: clip;
      }

      .masthead__cue {
        position: absolute;
        left: 50%;
        bottom: 26px;
        translate: -50% 0;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.45;
        will-change: opacity, transform;
      }

      /* ---------------------------------------------------------------------
         Screen two — black.

         Flat #000000, nothing on it. .hero__media survives as an empty layer on
         purpose: it is the one place a real image would go, it already forces
         `filter: grayscale(1)` so an image cannot bring colour in with it, and it is
         what the settle effect in the config animates. On a flat fill that settle is
         invisible — see the note on it there.
         --------------------------------------------------------------------- */
      .hero {
        position: relative;
        height: 100vh;
        height: 100svh;
        overflow: clip;
        background: var(--ink);
      }

      .hero__media {
        position: absolute;
        inset: 0;
        background: var(--ink);
        /* Belt and braces for the monochrome: anything dropped in here as a real
           photograph is desaturated on the way in, so the design cannot acquire a
           colour cast by having its placeholder swapped out. */
        filter: grayscale(1);
        will-change: transform;
      }


      /* ---------------------------------------------------------------------
         Responsive.

         Only the bar needs it. The two screens are `100svh` planes of one colour and
         are already right at any size; the scroll track is two of them, so the whole
         timeline scales with the viewport and no range below has to change.

         The bar is the part with a fixed content width. Measured across the stack at
         its resting sizes, the row comes to roughly 300px of content: about 96 for
         Shop + Stockists, 88 for MY LOGO, 96 for Info + Cart, and two 16px gaps. Add
         2 x 18 of padding and it needs ~340px, so it survives down to about a 375px
         window and fails below that. The two steps below are set from those numbers
         rather than from round breakpoints.
         --------------------------------------------------------------------- */

      /* Tighten everything one notch. The bar loses 8px of padding and 4 of gap, the
         type drops a point, and that buys back about 30px of row. */
      @media (max-width: 640px) {
        :root {
          --gap: 12px;
          --edge-pad: 14px;
          --bar-h: 44px;
          --bar-top: 12px;
          --chip-h: 38px;
        }

        .bar__link {
          font-size: 12px;
        }

        .bar__label {
          font-size: 15px;
        }
      }

      /* Below this the side links cannot fit at any type size worth reading, so they
         go and the bar shrinks to a capsule around the logo alone. `fit-content`
         rather than a fixed width, so the capsule is exactly the size of what is left
         in it — which is also what the collapsed state of this design should look
         like. A real site would put a menu button in the space this frees. */
      @media (max-width: 400px) {
        .bar {
          width: fit-content;
        }

        .bar__side {
          display: none;
        }
      }

      /* No touch-specific rule for the hover effects, deliberately. The obvious one
         would be `animation-play-state: paused` under `(hover: none)`, and it would
         be a bug: the scroll and the hover share one `animation` shorthand on
         .bar__frost and .bar__mark, so pausing would stop the scroll-driven half as
         well and the header would stop working on every phone. The hover trigger is
         `alternate`, so a tap plays it in and a tap elsewhere reverses it, which is
         acceptable behaviour on touch and needs nothing.
      */
    </style>

@keyframes hero-settle {
0% {
transform: translate3d(0, -5vh, 0) scale(1.12);
}
100% {
transform: translate3d(0, 0, 0) scale(1);
}
}
@keyframes bar-frost {
0% {
opacity: 0;
backdrop-filter: blur(0px);
-webkit-backdrop-filter: blur(0px);
}
100% {
opacity: 1;
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
}
}
@keyframes label-out {
0% {
opacity: 1;
transform: translate3d(0, 0, 0);
filter: blur(0px);
}
100% {
opacity: 0;
transform: translate3d(0, -6px, 0);
filter: blur(2px);
}
}
@keyframes mark-in {
0% {
opacity: 0;
transform: translate3d(0, 8px, 0);
filter: blur(4px);
}
100% {
opacity: 1;
transform: translate3d(0, 0, 0);
filter: blur(0px);
}
}
@keyframes cue-out {
0% {
opacity: 1;
transform: translate3d(0, 0, 0);
}
100% {
opacity: 0;
transform: translate3d(0, 10px, 0);
}
}
@keyframes plate-breathe {
0% {
transform: scale(1);
}
100% {
transform: scale(1.025);
}
}
@keyframes mark-quarter-turn {
0% {
rotate: 0deg;
}
100% {

}
}

}
100% {

}

         all, and only the opt-out is conditional.
