<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MY LOGO — scroll invert header</title>

    <style>
      :root {
        --header-height: 58px;
        /* Everything in the header rendered 10% larger. Applied as one zoom on the
           header rather than by editing each size: the collapse's keyframes carry px
           values of their own, and scaling the stylesheet alone would have left the
           animation landing on the old numbers. zoom is a layout scale, so the
           keyframes are read in the same scaled space and stay in agreement — and
           unlike transform: scale it reserves the room it uses, so nothing overlaps
           what sits below. Set to 1 to get the original size back. */
        --content-scale: 1.1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f2f2f2;
        font-family:
          'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      /* Tall wrapper: ViewTimeline source. Put real page content inside and drop
         the fixed height when embedding. */
      .scroll-track {
        height: 250vh;
      }

      interact-element {
        display: block;
      }

      /* The wrapper is made boxless instead of being stuck itself. Sticking it was
         the old fix for a real problem — a parent only as tall as the bar unsticks
         the moment it leaves the viewport — but it put the sticky on a div while the
         <header> sat inside doing nothing. display: contents generates no box at
         all, so .header's containing block becomes .scroll-track and the header can
         carry its own sticky. The animation still finds it: generate() targets this
         key's first child by selector, which display has no bearing on. */
      [data-interact-key='header'] {
        display: contents;
      }

      /* Color / background are driven by @wix/interact (header-invert). */
      .header {
        zoom: var(--content-scale);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        height: var(--header-height);
        padding: 0 clamp(12px, 3vw, 28px);
        background-color: #ffffff;
        color: #111111;
        border-bottom: 1px solid #e6e6e6;
        box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
      }

      .wordmark {
        flex: 0 0 auto;
        margin-right: 16px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: inherit;
        white-space: nowrap;
        user-select: none;
      }

      .nav {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: clamp(10px, 2.5vw, 32px);
        min-width: 0;
        overflow: clip;
        background-color: inherit;
      }

      .nav a {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
        font-size: clamp(9px, 1.6vw, 10.5px);
        font-weight: 500;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
        overflow: clip;
        text-overflow: ellipsis;
        cursor: pointer;
      }

      .nav a:hover {
        opacity: 0.45;
      }

      .menu-toggle {
        display: none;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .menu-toggle-bars {
        display: grid;
        gap: 5px;
        width: 18px;
        margin: 0 auto;
      }

      .menu-toggle-bars span {
        display: block;
        height: 1.5px;
        background: currentColor;
        transition:
          transform 0.25s cubic-bezier(0.23, 1, 0.32, 1),
          opacity 0.2s ease;
        transform-origin: center;
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(1) {
        transform: translateY(6.5px) rotate(45deg);
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(2) {
        opacity: 0;
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(3) {
        transform: translateY(-6.5px) rotate(-45deg);
      }

      .cart {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        color: inherit;
        cursor: pointer;
      }

      .cart:hover {
        opacity: 0.45;
      }

      @media (max-width: 640px) {
        .header {
          gap: 10px;
        }

        .menu-toggle {
          display: grid;
          place-items: center;
          margin-left: auto;
        }

        .nav {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          z-index: 9;
          display: none;
          flex: none;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          min-width: 0;
          overflow: visible;
          padding: 8px 0 16px;
          background-color: inherit;
          border-bottom: 1px solid currentColor;
          border-bottom-color: color-mix(in srgb, currentColor 18%, transparent);
        }

        .header.is-menu-open .nav {
          display: flex;
        }

        .nav a {
          flex: none;
          max-width: none;
          padding: 14px clamp(12px, 3vw, 28px);
          font-size: 11px;
          overflow: visible;
          text-overflow: clip;
        }
      }
    </style>

    <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
    <style>
      @keyframes header-invert {
      0% {
      background-color: #ffffff;
      color: #111111;
      border-bottom-color: #e6e6e6;
      box-shadow: 0 0 0 0 rgba(0,0,0,0);
      animation-timing-function: cubic-bezier(0.65, 0, 0.05, 1);
      }
      45% {
      background-color: #2b2b2b;
      color: #e8e8e8;
      border-bottom-color: #1a1a1a;
      box-shadow: 0 18px 48px rgba(0,0,0,0.28);
      }
      100% {
      background-color: #000000;
      color: #ffffff;
      border-bottom-color: #000000;
      box-shadow: 0 10px 32px rgba(0,0,0,0.5);
      }
      }
      [data-interact-key='page'] > :first-child {
      view-timeline: --trigger-0;
      }
      [data-interact-key='header'] > :first-child {
      --animation-0-1652uaskten: header-invert auto linear both 1 ;
      --animation-composition-0-1652uaskten: replace;
      --animation-timeline-0-1652uaskten: --trigger-0;
      --animation-range-0-1652uaskten: contain 0% contain 22%;
      }
      [data-interact-key='header'] > :first-child {
      animation: var(--animation-0-1652uaskten, none);
      animation-composition: var(--animation-composition-0-1652uaskten, replace);
      animation-timeline: var(--animation-timeline-0-1652uaskten, auto);
      animation-range: var(--animation-range-0-1652uaskten, normal);
      }
    </style>
  </head>

  <body>
    <!-- Tall wrapper + sticky header: the wrapper is the timeline source and the
         animated header lives inside it, so the view-timeline stays in scope. -->
    <interact-element data-interact-key="page">
      <div class="scroll-track">
        <interact-element data-interact-key="header">
          <header class="header">
            <span class="wordmark">My Logo</span>

            <nav class="nav" id="primary-nav" aria-label="Primary">
              <a href="#">New</a>
              <a href="#">Shop</a>
              <a href="#">Collections</a>
              <a href="#">Archives</a>
            </nav>

            <button
              class="menu-toggle"
              type="button"
              aria-label="Open menu"
              aria-controls="primary-nav"
              aria-expanded="false"
            >
              <span class="menu-toggle-bars" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </span>
            </button>

            <div class="cart" role="button" aria-label="Bag, 0 items">
              <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
                <rect
                  x="3"
                  y="8.5"
                  width="20"
                  height="14"
                  rx="1"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <line
                  x1="3"
                  y1="13"
                  x2="23"
                  y2="13"
                  stroke="currentColor"
                  stroke-width="0.75"
                />
                <text
                  x="13"
                  y="11.5"
                  text-anchor="middle"
                  font-size="4.5"
                  font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
                  letter-spacing="0.5"
                  fill="currentColor"
                >
                  BAG
                </text>
                <text
                  x="13"
                  y="20.5"
                  text-anchor="middle"
                  font-size="5"
                  font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
                  fill="currentColor"
                >
                  0
                </text>
                <path
                  d="M9 8.5V6.5a4 4 0 0 1 8 0v2"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </header>
        </interact-element>
      </div>
    </interact-element>



    <script type="module">
      import { Interact } from 'https://esm.sh/@wix/interact@2.5.9/web';

      // Scroll-scrubbed invert: white bar + dark ink → black bar + white ink.
      // Mid-stop deepens the contrast before the final black/white snap.
      // Docs: llms-full.txt — viewProgress + keyframeEffect + fill:both + contain.
      const FLASH = 'cubic-bezier(0.65, 0, 0.05, 1)';
      const pct = (value) => ({ name: 'contain', offset: { unit: 'percentage', value } });

      const config = {
        interactions: [
          {
            key: 'page',
            trigger: 'viewProgress',
            effects: [
              {
                key: 'header',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(22),
                keyframeEffect: {
                  name: 'header-invert',
                  keyframes: [
                    {
                      offset: 0,
                      backgroundColor: '#ffffff',
                      color: '#111111',
                      borderBottomColor: '#e6e6e6',
                      boxShadow: '0 0 0 0 rgba(0,0,0,0)',
                      easing: FLASH,
                    },
                    {
                      offset: 0.45,
                      backgroundColor: '#2b2b2b',
                      color: '#e8e8e8',
                      borderBottomColor: '#1a1a1a',
                      boxShadow: '0 18px 48px rgba(0,0,0,0.28)',
                    },
                    {
                      offset: 1,
                      backgroundColor: '#000000',
                      color: '#ffffff',
                      borderBottomColor: '#000000',
                      boxShadow: '0 10px 32px rgba(0,0,0,0.5)',
                    },
                  ],
                },
              },
            ],
          },
        ],
      };

      Interact.create(config);

      const header = document.querySelector('.header');
      const menuToggle = document.querySelector('.menu-toggle');
      if (header && menuToggle) {
        menuToggle.addEventListener('click', () => {
          const open = header.classList.toggle('is-menu-open');
          menuToggle.setAttribute('aria-expanded', String(open));
          menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        });
      }
    </script>
  </body>
</html>
