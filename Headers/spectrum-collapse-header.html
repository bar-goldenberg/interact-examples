<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>My Logo — collapsing lockup header</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
        <style>
            :root {
                /* Colours sampled off rep2.mp4, frame 0. */
                --violet: #5433f6;
                --ink: #101018;
                /* Breathing room from the screen edges to the header's contents — the
           lockup's left edge and the menu's right edge once they share a row. The
           3.1vw term governs across the desktop range now that the cap sits at 64px,
           so the margin grows with the window instead of flattening out at ~1160px.
           Kept under 4vw: above that the bar would eat enough width to break the
           container query below, which reads .bar__end against 92vw. */
                --edge: clamp(20px, 3.1vw, 64px);
                /* Sized so the lockup fills the bar the way the clip's does. Deliberately
           uncapped: the expanded state is defined by the *proportion* of the bar the
           lockup covers (~66% of the viewport), so it has to keep growing with the
           window. A px cap would freeze the lockup while the bar kept widening, which
           both shrinks it visually and lets .bar__end fit beside it — see the note
           there. The trade is a header that scales with the monitor: ~208px at a
           1654px viewport, ~242px at 1920, ~322px at 2560. */
                --brand-expanded: 12.58vw;
                --brand-collapsed: 30px;
                /* Scroll distance the collapse is spread over. Also .trigger's height.
           Longer than it needs to be on purpose: at 220px the lockup went from full
           height to 30px inside a flick of the wheel, which reads as a jump rather
           than a move. The extra travel is most of what makes it feel unhurried. */
                --collapse-distance: 340px;
                /* Shared by every track below so they stay locked together. An S-curve,
           not the ease-out this had before: under a scrubbed timeline an ease-out
           dumps most of the size change into the first few pixels of scroll, so the
           lockup lurched the moment you touched the wheel. Easing in as well as out
           means it leaves and arrives gently, and the middle carries the movement. */
                --collapse-ease: cubic-bezier(0.65, 0, 0.35, 1);
                /* Drawn once the bar is collapsed, to lift the sticky header off the
           content passing under it. */
                --chrome-shadow: 0 2px 18px rgba(16, 16, 24, 0.1);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: #ffffff;
                color: var(--ink);
                font-family: Poppins, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            }

            interact-element {
                display: block;
            }

            /* generate() declares the timeline on the page key's first child, which is a
         sibling of the header rather than an ancestor, so the name has to be hoisted
         to their common parent for the header to see it. Rename this alongside the
         --trigger-N that generate() emits if the config gains interactions. */
            [data-interact-key='page'] {
                timeline-scope: --trigger-0;
            }

            /* The ViewTimeline source, and the only thing that sets the scroll distance:
         a fixed-height box pinned to the top of the document. Its `exit` range runs
         from scrollY 0 to exactly its own height, which keeps the timing identical
         on every viewport — unlike a range measured against the whole page. */
            .trigger {
                position: absolute;
                top: 0;
                left: 0;
                width: 1px;
                height: var(--collapse-distance);
                opacity: 0;
                pointer-events: none;
            }

            /* The banner itself — this is the <header>. The sticky box and the semantic
         header used to be two nested elements covering exactly the same area, which
         left "the header" ambiguous; .bar inside is now just the flex row. */
            .chrome {
                position: sticky;
                top: 0;
                z-index: 20;
                background: #ffffff;
                animation: chrome-settle auto var(--collapse-ease) both;
                animation-timeline: --trigger-0;
                animation-range: exit 0% exit 100%;
            }

            /* The header is one flex line, always — the lockup, then the menu box.

         It used to be a wrapping row, which is what produced the snap: while the
         lockup was big it filled the line and pushed the menu onto a second one,
         and the moment it had shrunk enough the two rows became one. Wrapping is
         all-or-nothing, so that moment cost the bar a whole row's height in a
         single frame — 32px even after the row gap had been spent, with the sticky
         header jerking and the page under it lurching to match.

         So nothing wraps now. The menu stays on the lockup's line the whole way and
         is *displaced* into position instead: pushed down below the lockup and
         widened to span the bar while expanded, then narrowed and lifted onto the
         line as you scroll. Both are ordinary interpolations, so every frame in
         between is a real state and there is no moment where the layout changes its
         mind. The three numbers driving it are declared just below. */
            .bar {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                /* Space under the lockup while the menu sits below it. Not a row-gap any
           more — with one line there are no rows — so it feeds the menu's offset
           and the padding reservation instead. */
                --gap-row: clamp(10px, 1.6vw, 44px);
                /* The menu's own height. Fixed, so the offset and the padding can be
           written in closed form; .nav pins itself to it with min-height. */
                --nav-h: 28px;
                /* The live lockup height, rebuilt from --collapse-t rather than read back
           off .brand. Same two endpoints and same curve as the generated
           font-size track, so the two stay in agreement frame for frame. */
                --logo-h: calc(
                    var(--brand-expanded) + (var(--brand-collapsed) - var(--brand-expanded)) * var(--collapse-t)
                );
                animation: bar-merge auto var(--collapse-ease) both;
                animation-timeline: --trigger-0;
                animation-range: exit 0% exit 100%;
                /* Distance from the lockup to the menu once the collapse has brought the
           two onto one line. Reaches its 280px ceiling at a ~1640px viewport and
           eases down below that rather than clamping off, so narrower desktops
           tighten instead of crowding. Raising the ceiling alone would have changed
           nothing here: the vw term is what governs across the desktop range. */
                column-gap: clamp(24px, 17.1vw, 280px);
                /* Holds the space the displaced menu hangs into. The menu is moved by a
           transform, which layout cannot see, so without this the bar would be only
           as tall as the lockup and the menu would spill past its bottom edge. Falls
           to nothing as the menu lifts, and that is what makes the bar's height a
           smooth curve from 284px to 54px instead of a curve with a step in it. */
                padding: 10px var(--edge)
                    calc(
                        14px + max(0px, (1 - var(--rise)) * (var(--logo-h) / 2 + var(--gap-row) + var(--nav-h) / 2) + var(--nav-h) / 2 - var(--logo-h) / 2)
                    );
                /* Gives the lockup's slide and the menu's width a unit for "how wide is
           the bar": 100cqw is this element's content box, so both can be written
           without knowing the viewport or the edge padding. */
                container: bar / inline-size;
            }

            /* The three numbers the layout above is written in terms of. Registering them
         is what makes them animatable — an unregistered custom property is a string
         to the animation engine and would flip from one value to the other at the
         halfway mark instead of interpolating.

         The lift is held back to the second half. The menu's left edge sits one
         column-gap behind the lockup's right edge, so while the lockup is still wide
         the menu is still wide too and the two only clear each other late; keeping
         the menu below until 55% means that by the time it is level with the lockup
         there is room for it. Everything else rides --collapse-t directly, including
         the narrowing — it used to have a window of its own, ending at 55%, but the
         menu's width tracks the live lockup, so finishing early just made it overrun
         its final position by 300px and crawl back. On the shared track that
         doubling-back is down to about 35px, spread over a fifth of the scroll. */
            @property --collapse-t {
                syntax: '<number>';
                initial-value: 0;
                inherits: true;
            }

            @property --rise {
                syntax: '<number>';
                initial-value: 0;
                inherits: true;
            }

            @keyframes bar-merge {
                from {
                    --collapse-t: 0;
                    --rise: 0;
                }

                55% {
                    --rise: 0;
                }

                to {
                    --collapse-t: 1;
                    --rise: 1;
                }
            }

            /* The lockup's move from centred to flush left, as a track of its own.

         It used to be `margin-inline: auto`, which centres for free — auto margins
         take a flex line's spare space, and while the lockup has the row to itself
         there is a whole line of it. The catch is that it is not a position so much
         as a side effect of there being room: the instant .bar__end wraps up onto
         this row its flex-grow eats the spare space, the margins resolve to 0, and
         the lockup is simply somewhere else on the next frame. Measured at a 1654px
         viewport that was a 423px teleport inside 10px of scroll.

         So the layout keeps it flush left and this slides it back out to the centre,
         unwinding to 0 as you scroll. calc(50cqw - 50%) is the centred offset —
         half the bar minus half the lockup — and it is re-resolved every frame, so
         it stays honest while the lockup shrinks underneath it. */
            @keyframes brand-slide {
                from {
                    translate: calc(50cqw - 50%);
                }

                /* Home before the menu starts lifting at 55%, so the lockup is out of
           the way by the time anything shares its line. It gets the whole first
           half to do it in — the travel is fixed, so a shorter window would only
           mean covering it faster. */
                50%,
                100% {
                    translate: 0;
                }
            }

            [data-interact-key='brand'] {
                flex: 0 0 auto;
                animation: brand-slide auto var(--collapse-ease) both;
                animation-timeline: --trigger-0;
                animation-range: exit 0% exit 100%;
            }

            /* Just the wordmark now. The gap that used to sit here was 0.164em — dropped
         with the mark, since a flex container with one child has nothing to space. */
            .brand {
                display: flex;
                align-items: center;
                font-size: var(--brand-expanded);
                line-height: 1;
                color: var(--ink);
                text-decoration: none;
            }

            /* Held flat for the first half so the shadow belongs to the collapsed bar
         rather than trailing the lockup down the page. */
            @keyframes chrome-settle {
                0%,
                50% {
                    box-shadow: 0 0 0 0 rgba(16, 16, 24, 0);
                }

                100% {
                    box-shadow: var(--chrome-shadow);
                }
            }

            .brand__word {
                font-size: 1em;
                font-weight: 700;
                letter-spacing: -0.03em;
                white-space: nowrap;
                user-select: none;
                /* Poppins Bold hangs 0.062em of empty side bearing to the left of the M.
           This cancelled it out of the gap to the mark; with the mark gone it still
           earns its place, pulling the box onto the letterform so the M itself lands
           on the edge padding and the centring measures the visible word rather than
           invisible bearing. Being em-based it holds through the collapse.
           Re-measure if the wordmark's first letter or the font ever changes. */
                margin-left: -0.062em;
            }

            /* Links and burger share one non-wrapping box, so the burger can never be
         pushed onto a line of its own. No flex-basis games any more: this simply
         takes whatever the lockup and the column-gap leave, which at the end of the
         collapse is exactly where the menu belongs. It is the *expanded* state that
         is the special case now, and .nav handles that by overflowing this box —
         justify-content: flex-end pins its right edge here while it does. */
            .bar__end {
                flex: 1 1 auto;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: clamp(24px, 4.6vw, 58px);
                min-width: 0;
            }

            /* The two displacements that replace the old row-wrap, both continuous.

         Width runs from the full bar to this box's own width. Expanded that is far
         wider than the parent, so the menu overflows it to the left and spans the
         whole bar, spreading the links edge to edge as before; as the collapse runs,
         the left edge walks right until the menu sits exactly in its flex box, one
         column-gap clear of the lockup. Nothing is measured — 100% *is* the answer,
         which is why this needs no constants and cannot drift out of step with the
         gap or the edge padding.

         The offset carries it from below the lockup onto the line. Half the lockup,
         plus the gap, plus half its own height puts its top edge exactly on the
         lockup's bottom; unwinding that to zero lands it centred on the line. The
         lockup's height is live, so the menu keeps rising gently on its own for the
         whole first half, before --rise even starts. */
            .nav {
                /* Must not shrink. The width below is deliberately wider than this box's
           parent while the menu is expanded, and the default flex-shrink: 1 simply
           undid that — pulling it straight back to the parent's width, which looked
           exactly like the calc having failed. */
                flex: 0 0 auto;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                row-gap: 6px;
                min-height: var(--nav-h);
                width: calc(100% + (1 - var(--collapse-t)) * (100cqw - 100%));
                translate: 0
                    calc((1 - var(--rise)) * (var(--logo-h) / 2 + var(--gap-row) + var(--nav-h) / 2));
                /* space-between spreads the links across whatever width the menu has, and
           at full width that is the edge-to-edge row. It cannot also produce a flat
           10% at the end, though — that only coincides when the row happens to be
           twice the links' own width. So the shortfall is padded off the left, which
           leaves space-between distributing exactly half the width over five gaps.
           30.9em is the links' combined width in their own font, the one measured
           quantity here; re-measure it if the menu's wording changes. */
                padding-inline-start: calc(var(--collapse-t) * max(0px, 50% - 30.9em));
                font-size: clamp(13px, 1.45vw, 16px);
                min-width: 0;
            }

            .nav a {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-size: 1em;
                font-weight: 400;
                color: inherit;
                text-decoration: none;
                white-space: nowrap;
            }

            .nav a:hover {
                color: var(--violet);
            }

            .chev {
                width: 12px;
                height: 12px;
                flex: 0 0 auto;
            }

            /* Hidden until the links are, since it is only there to stand in for them. */
            .burger {
                flex: 0 0 auto;
                display: none;
                gap: 6px;
                align-content: center;
                width: 38px;
                height: 38px;
                padding: 0 8px;
                border: 0;
                background: transparent;
                color: inherit;
                cursor: pointer;
            }

            .burger span {
                display: block;
                height: 2px;
                background: currentColor;
            }

            /* Nothing is rendered below the header any more, so the page needs its own
         scroll room for the collapse to have something to scrub against. */
            .room {
                height: 200vh;
            }

            /* Phones get a plain static bar: links handed to the burger, and the lockup
         and burger on one line, hard left and hard right. None of the collapse
         applies here — see the animation override after the generated block. */
            @media (max-width: 640px) {
                .nav {
                    display: none;
                }

                .burger {
                    display: grid;
                }

                .bar {
                    /* The line is only ever the lockup plus a 38px burger, and the lockup
             is sized off the viewport too: ~213px of a 280px content box at 320px
             wide, ~249px of 335px at 375px. The desktop column-gap is far too wide
             to leave room for the burger, hence the reset. The padding goes back to
             a flat value because there is no displaced menu to hang below the line
             — the calc would otherwise reserve a slot for a hidden element. */
                    column-gap: 16px;
                    padding-bottom: 14px;
                }

                /* Shrink to the burger and let the free space push it to the right edge,
           rather than stretching across the line as the menu does on desktop. */
                .bar__end {
                    flex: 0 0 auto;
                    margin-left: auto;
                }
            }

            /* Every track pinned to the state it would have ended in, so the header still
         reads as the collapsed bar without anything having moved to get there. The
         animations themselves are switched off after the generated block. */
            @media (prefers-reduced-motion: reduce) {
                /* The three drivers pinned to their finished values. Without this they
           would sit at their registered initial 0 — the expanded layout — while
           .brand showed the collapsed size, and the bar would hold a slot open
           under a menu that was already on the line. */
                .bar {
                    --collapse-t: 1;
                    --rise: 1;
                }

                .brand {
                    font-size: var(--brand-collapsed);
                }

                .chrome {
                    box-shadow: var(--chrome-shadow);
                }
            }
        </style>
        <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
        <style>
            @keyframes brand-collapse {
                0% {
                    font-size: 12.58vw;
                    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
                }

                100% {
                    font-size: 30px;
                }
            }

            [data-interact-key="page"] > :first-child {
                view-timeline: --trigger-0;
            }

            [data-interact-key="brand"] > :first-child {
                --animation-0-182x6ych34s: brand-collapse auto linear both 1 ;
                --animation-composition-0-182x6ych34s: replace;
                --animation-timeline-0-182x6ych34s: --trigger-0;
                --animation-range-0-182x6ych34s: exit 0% exit 100%;
            }

            [data-interact-key="brand"] > :first-child {
                animation: var(--animation-0-182x6ych34s, none);
                animation-composition: var(--animation-composition-0-182x6ych34s, replace);
                animation-timeline: var(--animation-timeline-0-182x6ych34s, auto);
                animation-range: var(--animation-range-0-182x6ych34s, normal);
            }
        </style>
        <!-- Overrides of the generated block above. Has to be a separate sheet that comes
         after it: generate() emits `[data-interact-key="brand"] > :first-child`, and
         anything here matching the same element ties on specificity, so source order
         is the only thing that decides. Keep this last in the head. -->
        <style>
            /* No collapse on phones — the bar is static, so the lockup keeps the size
         .brand declares and never scrubs down to --brand-collapsed. Killing the
         timeline as well as the animation stops the ViewTimeline being observed at
         all, rather than just running an animation with nothing to show for it. */
            @media (max-width: 640px) {
                .bar,
                [data-interact-key='brand'],
                [data-interact-key='brand'] > :first-child,
                .chrome {
                    animation: none;
                    animation-timeline: auto;
                }
            }

            /* Switches off the tracks the reduced-motion block above pinned. It has to
         happen here rather than there: the generated rule sets `animation` on the
         lockup at the same specificity, so only a later sheet can take it back.
         Without this the lockup would keep scrubbing and simply overrule the pinned
         font-size, which is what it did before these two tracks were added. */
            @media (prefers-reduced-motion: reduce) {
                .bar,
                [data-interact-key='brand'],
                [data-interact-key='brand'] > :first-child,
                .chrome {
                    animation: none;
                    animation-timeline: auto;
                }
            }
        </style>
    </head>
    <body>
        <interact-element data-interact-key="page">
            <div class="trigger" aria-hidden="true"></div>
            <header class="chrome">
                <div class="bar">
                    <interact-element data-interact-key="brand">
                        <a class="brand" href="#" aria-label="My Logo home">
                            <span class="brand__word">MY LOGO</span>
                        </a>
                    </interact-element>
                    <div class="bar__end">
                        <nav class="nav" aria-label="Primary">
                            <a href="#">Insurer</a>
                            <a href="#">
                                Workplace

                                <svg class="chev" viewBox="0 0 12 12" aria-hidden="true">
                                    <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                            <a href="#">Education</a>
                            <a href="#">
                                About

                                <svg class="chev" viewBox="0 0 12 12" aria-hidden="true">
                                    <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                            <a href="#">
                                Our people

                                <svg class="chev" viewBox="0 0 12 12" aria-hidden="true">
                                    <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                            <a href="#">Get Pricing</a>
                        </nav>
                        <button class="burger" type="button" aria-label="Open menu">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>
                    </div>
                </div>
            </header>
            <div class="room" aria-hidden="true"></div>
        </interact-element>
        <script type="module">
          import { Interact } from 'https://esm.sh/@wix/interact@2.5.9/web';

            // Scroll-scrubbed collapse of the brand lockup.
            // Docs: llms-full.txt — viewProgress + keyframeEffect + fill:both.
            // `exit 0%` -> `exit 100%` on .trigger maps to scrollY 0 -> .trigger's height,
            // so the collapse always finishes after --collapse-distance of scrolling.
            // Keep in step with --collapse-ease in the stylesheet.
            const EASE = 'cubic-bezier(0.65, 0, 0.35, 1)';
            const exitAt = (value) => ({
                name: 'exit',
                offset: {
                    unit: 'percentage',
                    value
                }
            });

            const config = {
                interactions: [{
                    key: 'page',
                    trigger: 'viewProgress',
                    effects: [{
                        key: 'brand',
                        easing: 'linear',
                        fill: 'both',
                        rangeStart: exitAt(0),
                        rangeEnd: exitAt(100),
                        keyframeEffect: {
                            name: 'brand-collapse',
                            keyframes: [{
                                offset: 0,
                                fontSize: '12.58vw',
                                easing: EASE
                            }, {
                                offset: 1,
                                fontSize: '30px'
                            }, ],
                        },
                    }, ],
                }, ],
            };

            Interact.create(config);
        </script>
    </body>
</html>
