<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo — shrinking masthead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Measured off Aug-12-2026 09-56-37.mp4 frame by frame — 1384x780 at 1x, so the
         numbers in these comments are that window's CSS pixels. */
      :root {
        /* One constant white. The clip ramped its background along with the height —
           warm taupe at the top lifting to near-white by the end — but that is dropped:
           background-color has come off the keyframes entirely, so the masthead simply
           is this colour at every point in the collapse. White matches the page beneath,
           so once collapsed the bar has no visible edge of its own — the 63px band reads
           purely as the ink sitting on it (the wordmark on the left, the nav on the
           right), which is the intended plain-white look. */
        --surface: #ffffff;
        --ink: #111111;

        /* What the masthead settles to. Everything else follows from it. 63, not the
           159 it first looked like — the clip pauses at 159 for fourteen frames, but
           that is the recording stopping, not the design. The bar carries straight on
           down afterwards at the same rate. */
        --bar-h: 63px;

        /* The lockup's ink measured a constant 0.570 of the masthead's height at every
           frame of the collapse — 446/782 at the top, 90/159 at the bottom, and eight
           samples in between all within half a percent. So the type is not on a track
           of its own: it is a fixed proportion of the bar, which is why it is sized in
           cqh below rather than animated. 63.6 = that 0.570 over the 0.896em of ink
           "Logo" stands in Playfair — cap-L down to the tail of the g. */
        --lockup-ratio: 63.6;

        /* ...but only down to a floor. The proportion holds all the way to a 121px bar
           (ink 69) and then stops: the last measured frames sit at ink 47 while the bar
           carries on from 74 to 63, so the ratio drifts 0.570 -> 0.635 -> 0.746 purely
           because the numerator has stopped moving. 52.5px of type is that 47px of ink
           over the 0.896em "Logo" stands. The crossover falls at a bar of ~82px, which
           is exactly where the clip's ratio starts to drift.

           This is what brings the lockup onto the nav's line rather than under it: held
           at 47px of ink sitting 9px off the bottom, it spans y 7..54 and centres on
           30.5, against the nav's text centre in the 63px bar. */
        --lockup-min: 52.5px;

        /* ...and a ceiling, because the ratio above only ever looks at the bar's
           height. On the clip's own 1384x780 that is fine — the lockup lands at 81%
           of the width — but the taller and narrower the window, the taller the bar
           and so the wider the type, until "Logo" runs off the side. This caps it at
           90vw of advance width: 90 over the 2.202em "Logo" measures in Playfair.
           It only binds where the height-driven size would have overflowed; at the
           clip's proportions 40.87vw is the larger of the two and never applies. */
        --lockup-max: 40.87vw;

        /* Baseline to the underside of the bar. Constant 9px the whole way down, not a
           proportion — at the hero size a proportional gap would have been 44px. */
        --baseline-lift: 9px;

        --edge: 17px;
        --nav-size: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      interact-element {
        display: block;
      }

      /* generate() declares the timeline on the page key's first child, which is a
         sibling of the masthead rather than an ancestor, so the name has to be hoisted
         to their common parent for the masthead to see it. Rename this alongside the
         --trigger-N that generate() emits if the config gains interactions. */
      [data-interact-key='page'] {
        timeline-scope: --trigger-0;
      }

      /* The ViewTimeline source, and the only thing that sets the scroll distance. Its
         height is exactly the travel the masthead has to make, because the clip's
         collapse runs 1:1 with the scroll: the bar loses a pixel of height for every
         pixel scrolled. Implied scroll (780 - measured bar height) tracked the page's
         actual scroll to within 10px across the whole transition. */
      .trigger {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: calc(100vh - var(--bar-h));
        opacity: 0;
        pointer-events: none;
      }

      /* Fixed, not sticky — and that is forced by the clip rather than chosen. The
         content below sits flush against the bar's underside in every single frame. A
         sticky masthead holds its own height in the flow, so as it shrank the content
         would climb by the scroll *plus* the shrink and pull away from it; only an
         out-of-flow bar over a page padded by one viewport keeps the two locked
         together. That padding is on .page below. */
      .masthead {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        height: 100vh;
        background: var(--surface);
        /* Gives the lockup its cqh. The height is always explicit, so declaring this a
           size container costs nothing — there is no content-driven height to lose. */
        container: masthead / size;
      }

      /* Sits at the top of the bar and never moves: measured at y 27..37 and x 437..1341
         in the hero frame and again in the collapsed frame, identical to the pixel. */
      .nav {
        position: absolute;
        top: 20px;
        right: 28px;
        display: flex;
        align-items: center;
        gap: 33px;
        font-size: var(--nav-size);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .nav a {
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
      }

      .nav a:hover {
        opacity: 0.55;
      }

      .nav__rule {
        width: 1px;
        height: 22px;
        background: currentColor;
        opacity: 0.45;
      }

      .nav__cart {
        display: inline-flex;
        gap: 9px;
      }

      .nav__lang {
        display: inline-flex;
        gap: 7px;
      }

      .nav__lang a {
        opacity: 0.5;
      }

      .nav__lang a.is-on {
        opacity: 1;
        font-weight: 700;
      }

      /* Back to a shrink-to-fit box against --edge, because the centring is now only
         wanted at the top of the scroll and has to come undone on the way down. That
         rules out the text-align version this replaced: a full-width box with centred
         text has no way to travel, and its own 50% is half the *bar*, not half the
         word, so there is nothing to measure the offset from. Left-anchored and
         shrink-to-fit, 50% is half the word — which is exactly what the slide below
         needs. */
      .wordmark {
        position: absolute;
        left: var(--edge);
        /* The lowest ink, not the box and not the baseline, is what sits 9px up.

           In the clip that distinction did not exist — "Blow" has no descender, so its
           baseline was its lowest ink. "Logo" does, and anchoring the baseline instead
           would hang the g's tail 0.188em below it: three pixels past the bar when
           collapsed, and a hundred into the artwork at hero size. Measuring from the
           tail keeps the lockup inside the bar at every size and, because the ink
           height is unchanged at 47px, puts it in exactly the box "Blow" occupied.

           0.1035em = the g's 0.188em tail less the 0.0845em the baseline already sits
           above the box's underside at line-height 1. In em, so it holds at every size
           the collapse passes through. */
        bottom: calc(var(--baseline-lift) + 0.1035em);
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 400;
        /* The starting size, and only that: the keyframes take font-size over from here
           and interpolate it down to --lockup-min. This is what shows before the
           animation attaches and under prefers-reduced-motion. --lockup-ratio and
           --lockup-max are kept above as the record of where these two numbers came
           from — 40.87vw is the 90vw of width, and the floor is the clip's 47px of
           ink. */
        font-size: var(--lockup-max);
        line-height: 1;
        color: var(--ink);
        text-decoration: none;
        white-space: nowrap;
        user-select: none;
      }

      /* One viewport of padding is what the fixed masthead stands on. It is also what
         keeps the content flush with the bar: at scroll S the content's top is at
         100vh - S and the bar's height is 100vh - S, so they are the same number. */
      .page {
        padding-top: 100vh;
      }

      /* Empty. They still need a height, though: the collapse is scrubbed against the
         document's scroll, and .page's one viewport of padding only stands the
         masthead up — it adds no travel of its own, because the bar is as tall as the
         padding until the scroll starts eating both. Three of these give 180vh under
         it, comfortably past the 100vh - 63px the collapse runs over. */
      .band {
        min-height: 60vh;
      }

      /* Hidden until the row is handed over to it. */
      /* Given the nav row's own top and height rather than a top offset of its own, so
         the bars centre on exactly the line the nav text sits on — 3 rows of 2px over 2
         gaps of 5px is 16px, centred in 22px leaves a whole 3px either side, which puts
         the bars on 23 / 30 / 37 and their middle on 31. */
      .burger {
        position: absolute;
        top: 20px;
        right: var(--edge);
        display: none;
        height: 22px;
        align-content: center;
        grid-auto-rows: 2px;
        gap: 5px;
        width: 30px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }

      .burger span {
        display: block;
        height: 2px;
        background: currentColor;
        transition:
          transform 200ms cubic-bezier(0.33, 1, 0.68, 1),
          opacity 120ms linear;
      }

      .masthead.is-menu-open .burger span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }

      .masthead.is-menu-open .burger span:nth-child(2) {
        opacity: 0;
      }

      .masthead.is-menu-open .burger span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      /* 1100px, not a phone width, and the number is measured rather than picked: the
         row is 925px wide, and once the collapsed lockup's 132.6px and the 28px right
         inset are taken out of the viewport there is no longer room for it below about
         1102px. The two share a vertical band — the nav sits at y 20..42 and the
         collapsed lockup at y 7..54 — so anything narrower had them printing over each
         other. Below this the row becomes a drawer under the bar. */
      @media (max-width: 1100px) {
        /* --bar-h and --lockup-min deliberately not touched here. --bar-h has to stay
           equal to the height the keyframes land on, which generate() writes as a
           literal 63px and cannot read a variable: the trigger is one viewport less
           --bar-h, so if the two disagree the content stops meeting the bar's
           underside at the end of the collapse. */
        :root {
          --nav-size: 13px;
          --edge: 14px;
        }

        .burger {
          display: grid;
        }

        .nav {
          top: 100%;
          right: 0;
          left: 0;
          display: none;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          background: var(--surface);
          box-shadow: 0 14px 30px rgba(17, 17, 17, 0.14);
        }

        .masthead.is-menu-open .nav {
          display: flex;
        }

        /* The dividers only made sense as vertical seams in a row. */
        .nav__rule {
          display: none;
        }

        .nav a,
        .nav__cart,
        .nav__lang {
          padding: 15px var(--edge);
        }

        .nav__lang {
          gap: 10px;
        }

        .nav > * + * {
          border-top: 1px solid rgba(17, 17, 17, 0.12);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .masthead {
          height: var(--bar-h);
          background: var(--surface);
        }
      }
    </style>

    <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
    <style>
@keyframes masthead-shrink {
0% {
height: 100vh;
}
100% {
height: 63px;
}
}
@keyframes wordmark-uncentre {
0% {
translate: calc(50cqw - 50% - 17px);
font-size: 40.87vw;
}
100% {
translate: 0px;
font-size: 52.5px;
}
}
[data-interact-key="page"] > :first-child {
view-timeline: --trigger-0;
}
[data-interact-key="masthead"] > :first-child {
--animation-0-109n87c6m3e: masthead-shrink auto linear both 1 ;
--animation-composition-0-109n87c6m3e: replace;
--animation-timeline-0-109n87c6m3e: --trigger-0;
--animation-range-0-109n87c6m3e: exit 0% exit 100%;
}
[data-interact-key="masthead"] .wordmark {
--animation-0-13ob1vkovae: wordmark-uncentre auto linear both 1 ;
--animation-composition-0-13ob1vkovae: replace;
--animation-timeline-0-13ob1vkovae: --trigger-0;
--animation-range-0-13ob1vkovae: exit 0% exit 100%;
}
[data-interact-key="masthead"] > :first-child {
animation: var(--animation-0-109n87c6m3e, none);
animation-composition: var(--animation-composition-0-109n87c6m3e, replace);
animation-timeline: var(--animation-timeline-0-109n87c6m3e, auto);
animation-range: var(--animation-range-0-109n87c6m3e, normal);
}
[data-interact-key="masthead"] .wordmark {
animation: var(--animation-0-13ob1vkovae, none);
animation-composition: var(--animation-composition-0-13ob1vkovae, replace);
animation-timeline: var(--animation-timeline-0-13ob1vkovae, auto);
animation-range: var(--animation-range-0-13ob1vkovae, normal);
}
    </style>
  </head>

  <body>
    <interact-element data-interact-key="page">
      <div class="trigger" aria-hidden="true"></div>

      <interact-element data-interact-key="masthead">
        <header class="masthead">
          <button
            class="burger"
            type="button"
            aria-label="Abrir menú"
            aria-controls="primary-nav"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <nav class="nav" id="primary-nav" aria-label="Principal">
            <a class="nav__browse" href="#">Colecciones</a>
            <a class="nav__browse" href="#">Para distribuidores</a>
            <a class="nav__browse" href="#">Sobre nosotros</a>
            <a class="nav__browse" href="#">Contacto</a>
            <a class="nav__browse" href="#">Blog</a>
            <span class="nav__rule nav__browse" aria-hidden="true"></span>
            <a class="nav__cart" href="#">Carrito <span>0</span></a>
            <span class="nav__rule" aria-hidden="true"></span>
            <span class="nav__lang">
              <a class="is-on" href="#">ES</a>
              <span aria-hidden="true">/</span>
              <a href="#">EN</a>
            </span>
          </nav>

          <a class="wordmark" href="#" aria-label="Logo — inicio">Logo</a>
        </header>
      </interact-element>

      <main class="page">
        <section class="band" aria-hidden="true"></section>
        <section class="band" aria-hidden="true"></section>
        <section class="band" aria-hidden="true"></section>
      </main>
    </interact-element>


    <script type="module">
      import { Interact } from 'https://esm.sh/@wix/interact@2.5.9/web';

      // Scroll-scrubbed shrink of the masthead.
      // Docs: llms-full.txt — viewProgress + keyframeEffect + fill:both, with the range
      // set on the effect rather than the trigger.
      // `exit 0%` -> `exit 100%` on .trigger maps to scrollY 0 -> .trigger's height, so
      // the bar always lands on --bar-h after exactly one viewport-less-a-bar of
      // scrolling — which is the 1:1 relationship measured off the clip.
      // linear because that is what it measured: bar height fell a pixel per pixel
      // scrolled, and the background tone moved in step with it.
      const exitAt = (value) => ({
        name: 'exit',
        offset: { unit: 'percentage', value },
      });

      // Must equal --edge in the stylesheet: it is the lockup's left anchor, and the
      // centring offset below is measured from it. generate() writes keyframe values as
      // literals and cannot read a custom property, hence the duplicate.
      const EDGE = '17px';

      const config = {
        interactions: [
          {
            key: 'page',
            trigger: 'viewProgress',
            effects: [
              {
                key: 'masthead',
                easing: 'linear',
                fill: 'both',
                rangeStart: exitAt(0),
                rangeEnd: exitAt(100),
                keyframeEffect: {
                  name: 'masthead-shrink',
                  keyframes: [
                    // Height only. The clip also ramped background-color across this
                    // track, through a mid stop at 0.866 to match a tone that did not
                    // move linearly — all of that is gone now that the bar is one fixed
                    // grey, and with the colour out there is nothing left for the middle
                    // keyframe to carry.
                    { offset: 0, height: '100vh' },
                    { offset: 1, height: '63px' },
                  ],
                },
              },
              {
                // The lockup starts centred and unwinds to its left anchor, so only the
                // top of the scroll is centred. Same key and timeline as the bar, with a
                // selector down onto the type — nothing new to keep in sync.
                //
                // 50cqw - 50% - EDGE is the offset from the left anchor to the centred
                // position: half the bar, less half the word, less the anchor's own
                // inset. cqw and % are both re-resolved every frame, which matters
                // because the word is getting smaller the whole way down — a fixed
                // pixel offset would drift off centre as it shrank.
                key: 'masthead',
                selector: '.wordmark',
                easing: 'linear',
                fill: 'both',
                rangeStart: exitAt(0),
                rangeEnd: exitAt(100),
                keyframeEffect: {
                  name: 'wordmark-uncentre',
                  keyframes: [
                    // font-size is on this track rather than left to the cqh rule in the
                    // stylesheet, because 90vw has to be the *actual* starting size, not
                    // a ceiling. As a ceiling it never bound at the clip's proportions —
                    // 63.6cqh came to 496px against 40.87vw's 566px, so the height term
                    // won and the lockup sat at 80vw. Driving it from here pins both
                    // ends: 90vw of width at the top, the 52.5px floor at the bottom.
                    { offset: 0, translate: `calc(50cqw - 50% - ${EDGE})`, fontSize: '40.87vw' },
                    { offset: 1, translate: '0px', fontSize: '52.5px' },
                  ],
                },
              },
            ],
          },
        ],
      };

      Interact.create(config);

      // The open state lives as a class on the masthead so CSS drives both the drawer
      // and the bars, and the button's label and aria-expanded are kept in step.
      const masthead = document.querySelector('.masthead');
      const burger = document.querySelector('.burger');
      if (masthead && burger) {
        burger.addEventListener('click', () => {
          const open = masthead.classList.toggle('is-menu-open');
          burger.setAttribute('aria-expanded', String(open));
          burger.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
        });
      }
    </script>
  </body>
</html>
