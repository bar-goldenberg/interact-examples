<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MY LOGO — side reveal header</title>

    <style>
      :root {
        /* One post-zoom pixel, in the pre-zoom units this stylesheet is written in.
           Anything sized as a whole multiple of it lands on a whole pixel once the
           header's zoom is applied. */
        --hair: calc(1px / var(--content-scale));

        /* 65 post-zoom px, up from 58 (which came out 63.8). The exact number is
           chosen so the whole vertical chain lands on pixel boundaries: 65 less the
           1px rule leaves 64 of content, the 30px menu button centres in that at a
           whole 17, and the bar stack centres in the button at a whole 7. Every one
           of those has to be even for the next to come out whole. */
        --header-height: calc(65 * var(--hair));
        /* Everything in the header rendered 10% larger. Applied as one zoom on the
           header rather than by editing each size: the collapse's keyframes carry px
           values of their own, and scaling the stylesheet alone would have left the
           animation landing on the old numbers. zoom is a layout scale, so the
           keyframes are read in the same scaled space and stay in agreement — and
           unlike transform: scale it reserves the room it uses, so nothing overlaps
           what sits below. Set to 1 to get the original size back. */
        --content-scale: 1.1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f2f2f2;
        font-family:
          'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      .scroll-track {
        height: 250vh;
      }

      interact-element {
        display: block;
      }

      /* Boxless, so the <header> inside can hold the sticky itself rather than the
         wrapper holding it on the header's behalf. A wrapper only as tall as the bar
         cannot stick — it leaves the viewport with it — but with no box at all the
         header's containing block becomes .scroll-track and the problem goes away.
         generate() targets this key's first child by selector, so the animation is
         unaffected. Sticky is a positioned value, so it also still serves as the
         containing block .header provided with position: relative. */
      [data-interact-key='header'] {
        display: contents;
      }

      .header {
        zoom: var(--content-scale);
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        height: var(--header-height);
        background-color: #ffffff;
        /* Also a whole post-zoom pixel: at 1px it computed to 1.1 and took the
           content box — and therefore everything centred in it — off the grid.
           Only the colour is animated, so the width is free to change. */
        border-bottom: var(--hair) solid #e6e6e6;
        overflow: clip;
      }

      /* Base (light) + overlay (dark) share one grid cell so the wipe covers
         logo and hamburger as it travels from the left. */
      .header-base,
      [data-interact-key='veil'] {
        grid-area: 1 / 1;
        min-width: 0;
      }

      .header-base {
        z-index: 0;
        display: flex;
        color: #111111;
      }

      [data-interact-key='veil'] {
        z-index: 1;
        pointer-events: none;
      }

      .veil {
        display: flex;
        width: 100%;
        height: 100%;
        background: #000000;
        color: #ffffff;
        clip-path: inset(0 100% 0 0);
      }

      .ink {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        min-width: 0;
        width: 100%;
        padding: 0 clamp(12px, 3vw, 28px);
        color: inherit;
      }

      .wordmark {
        flex: 0 0 auto;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: inherit;
        white-space: nowrap;
        user-select: none;
      }

      .menu-toggle {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: calc(30 * var(--hair));
        height: calc(30 * var(--hair));
        margin-left: auto;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .menu-toggle-bars {
        display: grid;
        gap: calc(5 * var(--hair));
        width: calc(20 * var(--hair));
        margin: 0 auto;
      }

      /* The bars were 1.5px — already a half pixel before the header's zoom, and
         1.64 after it, at tops of 23.44 / 30.58 / 37.72. Three fractional heights on
         three fractional offsets rasterise three different ways, which is why they
         did not look the same weight. 2 whole post-zoom pixels on whole offsets. */
      .menu-toggle-bars span {
        display: block;
        height: calc(2 * var(--hair));
        background: currentColor;
        transition:
          transform 0.25s cubic-bezier(0.23, 1, 0.32, 1),
          opacity 0.2s ease;
        transform-origin: center;
      }

      /* 7 = one bar (2) plus one gap (5), the distance between bar centres. */
      .header.is-menu-open .menu-toggle-bars span:nth-child(1) {
        transform: translateY(calc(7 * var(--hair))) rotate(45deg);
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(2) {
        opacity: 0;
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(3) {
        transform: translateY(calc(-7 * var(--hair))) rotate(-45deg);
      }

      .header-base .menu-toggle:hover {
        opacity: 0.45;
      }
    </style>

    <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
    <style>
      @keyframes veil-side-reveal {
      0% {
      clip-path: inset(0 100% 0 0);
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      100% {
      clip-path: inset(0 0% 0 0);
      }
      }
      @keyframes header-border-reveal {
      0% {
      border-bottom-color: #e6e6e6;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      100% {
      border-bottom-color: #000000;
      }
      }
      [data-interact-key='page'] > :first-child {
      view-timeline: --trigger-0;
      }
      [data-interact-key='veil'] > :first-child {
      --animation-0-3jhe7wf139: veil-side-reveal auto linear both 1 ;
      --animation-composition-0-3jhe7wf139: replace;
      --animation-timeline-0-3jhe7wf139: --trigger-0;
      --animation-range-0-3jhe7wf139: contain 0% contain 14%;
      }
      [data-interact-key='header'] > :first-child {
      --animation-0-1652uaskten: header-border-reveal auto linear both 1 ;
      --animation-composition-0-1652uaskten: replace;
      --animation-timeline-0-1652uaskten: --trigger-0;
      --animation-range-0-1652uaskten: contain 0% contain 14%;
      }
      [data-interact-key='veil'] > :first-child {
      animation: var(--animation-0-3jhe7wf139, none);
      animation-composition: var(--animation-composition-0-3jhe7wf139, replace);
      animation-timeline: var(--animation-timeline-0-3jhe7wf139, auto);
      animation-range: var(--animation-range-0-3jhe7wf139, normal);
      }
      [data-interact-key='header'] > :first-child {
      animation: var(--animation-0-1652uaskten, none);
      animation-composition: var(--animation-composition-0-1652uaskten, replace);
      animation-timeline: var(--animation-timeline-0-1652uaskten, auto);
      animation-range: var(--animation-range-0-1652uaskten, normal);
      }
    </style>
  </head>

  <body>
    <interact-element data-interact-key="page">
      <div class="scroll-track">
        <interact-element data-interact-key="header">
          <header class="header">
            <div class="header-base">
              <div class="ink">
                <span class="wordmark">My Logo</span>
                <button
                  class="menu-toggle"
                  type="button"
                  aria-label="Open menu"
                  aria-expanded="false"
                >
                  <span class="menu-toggle-bars" aria-hidden="true">
                    <span></span><span></span><span></span>
                  </span>
                </button>
              </div>
            </div>

            <interact-element data-interact-key="veil">
              <div class="veil" aria-hidden="true">
                <div class="ink">
                  <span class="wordmark">My Logo</span>
                  <span class="menu-toggle">
                    <span class="menu-toggle-bars">
                      <span></span><span></span><span></span>
                    </span>
                  </span>
                </div>
              </div>
            </interact-element>
          </header>
        </interact-element>
      </div>
    </interact-element>

              },
              {
                key: 'header',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(14),
                keyframeEffect: {
                  name: 'header-border-reveal',
                  keyframes: [
                    {
                      offset: 0,
                      borderBottomColor: '#e6e6e6',
                      easing: WIPE,
                    },
                    {
                      offset: 1,
                      borderBottomColor: '#000000',
                    },
                  ],
                },
              },
            ],
          },
        ],
      };

      WixInteract.Interact.create(config);

      const header = document.querySelector('.header');
      const menuToggle = document.querySelector('.header-base .menu-toggle');
      if (header && menuToggle) {
        menuToggle.addEventListener('click', () => {
          const open = header.classList.toggle('is-menu-open');
          menuToggle.setAttribute('aria-expanded', String(open));
          menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        });
      }
    </script>
  </body>
</html>
