<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MY LOGO — collapsing logo header</title>

    <style>
      :root {
        --header-height: 58px;
        /* Everything in the header rendered 10% larger. Applied as one zoom on the
           header rather than by editing each size: the collapse's keyframes carry px
           values of their own, and scaling the stylesheet alone would have left the
           animation landing on the old numbers. zoom is a layout scale, so the
           keyframes are read in the same scaled space and stay in agreement — and
           unlike transform: scale it reserves the room it uses, so nothing overlaps
           what sits below. Set to 1 to get the original size back. */
        --content-scale: 1.1;
        --logo-expanded: 108px;
        --logo-collapsed: 36px;
        --ink: #111111;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f2f2f2;
        font-family:
          'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      /* Tall wrapper: ViewTimeline source. Put real page content inside and drop
         the fixed height when embedding. */
      .scroll-track {
        height: 250vh;
      }

      interact-element {
        display: block;
      }

      .header {
        zoom: var(--content-scale);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        height: var(--header-height);
        padding: 0 clamp(12px, 3vw, 28px);
        background: #ffffff;
        border-bottom: 1px solid #e6e6e6;
      }

      /* Stretch to the header's 58px: align-items:center would otherwise leave this
         wrapper at auto height, and .logo-slot's height:100% would collapse to 0 —
         clipping the absolutely positioned wordmark with overflow:clip. */
      [data-interact-key='logo'] {
        align-self: stretch;
        display: flex;
        align-items: center;
      }

      /* Width is what @wix/interact animates. flex-shrink: 0 so the header never
         squeezes the animating box. Measured off the clip's wordmark (~184px ink). */
      .logo-slot {
        position: relative;
        flex: 0 0 auto;
        width: var(--logo-expanded);
        height: 100%;
        overflow: clip;
      }

      [data-interact-key='wordmark'],
      [data-interact-key='symbol'] {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
      }

      .wordmark {
        max-width: 100%;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: none;
      }

      .wordmark sup {
        font-size: 7px;
        font-weight: 600;
        vertical-align: super;
        margin-left: 1px;
      }

      /* Resting state matches the first keyframe of symbol-in. */
      .symbol {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        color: var(--ink);
        opacity: 0;
        transform: rotate(-90deg) scale(0.4);
        transform-origin: center;
      }

      /* min-width: 0 lets the row shrink inside the flex header so links ellipsis
         instead of shoving the cart off-screen. */
      .nav {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: clamp(10px, 2.5vw, 32px);
        min-width: 0;
        overflow: hidden;
      }

      .nav a {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
        font-size: clamp(9px, 1.6vw, 10.5px);
        font-weight: 500;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }

      .nav a:hover {
        opacity: 0.45;
      }

      /* Desktop-only control; shown below 640px in place of the inline links. */
      .menu-toggle {
        display: none;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }

      .menu-toggle-bars {
        display: grid;
        gap: 5px;
        width: 18px;
        margin: 0 auto;
      }

      .menu-toggle-bars span {
        display: block;
        height: 1.5px;
        background: currentColor;
        transition:
          transform 0.25s cubic-bezier(0.23, 1, 0.32, 1),
          opacity 0.2s ease;
        transform-origin: center;
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(1) {
        transform: translateY(6.5px) rotate(45deg);
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(2) {
        opacity: 0;
      }

      .header.is-menu-open .menu-toggle-bars span:nth-child(3) {
        transform: translateY(-6.5px) rotate(-45deg);
      }

      /* Never shrink: the cart stays put while the nav yields space. */
      .cart {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        color: var(--ink);
        cursor: pointer;
      }

      .cart:hover {
        opacity: 0.45;
      }

      @media (max-width: 640px) {
        .header {
          position: sticky;
          gap: 10px;
        }

        .logo-slot {
          max-width: 40vw;
        }

        .menu-toggle {
          display: grid;
          place-items: center;
          margin-left: auto;
        }

        /* Off-canvas panel under the sticky bar — links leave the inline row. */
        .nav {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          z-index: 9;
          display: none;
          flex: none;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          min-width: 0;
          overflow: visible;
          padding: 8px 0 16px;
          background: #ffffff;
          border-bottom: 1px solid #e6e6e6;
        }

        .header.is-menu-open .nav {
          display: flex;
        }

        .nav a {
          flex: none;
          max-width: none;
          padding: 14px clamp(12px, 3vw, 28px);
          font-size: 11px;
          overflow: visible;
          text-overflow: clip;
        }
      }
    </style>

    <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
    <style>
      @keyframes wordmark-out {
      0% {
      opacity: 1;
      transform: translateX(0px) scale(1);
      filter: blur(0px);
      animation-timing-function: cubic-bezier(0.55, 0, 0.12, 1);
      }
      100% {
      opacity: 0;
      transform: translateX(-20px) scale(0.82);
      filter: blur(5px);
      }
      }
      @keyframes symbol-in {
      0% {
      opacity: 0;
      transform: rotate(-90deg) scale(0.4);
      animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      100% {
      opacity: 1;
      transform: rotate(0deg) scale(1);
      }
      }
      @keyframes logo-shrink {
      0% {
      width: 108px;
      animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
      }
      100% {
      width: 36px;
      }
      }
      [data-interact-key='page'] > :first-child {
      view-timeline: --trigger-0;
      }
      [data-interact-key='wordmark'] > :first-child {
      --animation-0-15bwrqduy1a: wordmark-out auto linear both 1 ;
      --animation-composition-0-15bwrqduy1a: replace;
      --animation-timeline-0-15bwrqduy1a: --trigger-0;
      --animation-range-0-15bwrqduy1a: contain 0% contain 16%;
      }
      [data-interact-key='symbol'] > :first-child {
      --animation-0-14529av53r3: symbol-in auto linear both 1 ;
      --animation-composition-0-14529av53r3: replace;
      --animation-timeline-0-14529av53r3: --trigger-0;
      --animation-range-0-14529av53r3: contain 6% contain 28%;
      }
      [data-interact-key='logo'] > :first-child {
      --animation-0-3j9sfcyv34: logo-shrink auto linear both 1 ;
      --animation-composition-0-3j9sfcyv34: replace;
      --animation-timeline-0-3j9sfcyv34: --trigger-0;
      --animation-range-0-3j9sfcyv34: contain 0% contain 28%;
      }
      [data-interact-key='wordmark'] > :first-child {
      animation: var(--animation-0-15bwrqduy1a, none);
      animation-composition: var(--animation-composition-0-15bwrqduy1a, replace);
      animation-timeline: var(--animation-timeline-0-15bwrqduy1a, auto);
      animation-range: var(--animation-range-0-15bwrqduy1a, normal);
      }
      [data-interact-key='symbol'] > :first-child {
      animation: var(--animation-0-14529av53r3, none);
      animation-composition: var(--animation-composition-0-14529av53r3, replace);
      animation-timeline: var(--animation-timeline-0-14529av53r3, auto);
      animation-range: var(--animation-range-0-14529av53r3, normal);
      }
      [data-interact-key='logo'] > :first-child {
      animation: var(--animation-0-3j9sfcyv34, none);
      animation-composition: var(--animation-composition-0-3j9sfcyv34, replace);
      animation-timeline: var(--animation-timeline-0-3j9sfcyv34, auto);
      animation-range: var(--animation-range-0-3j9sfcyv34, normal);
      }

    </style>
  </head>

  <body>
    <!-- Tall wrapper + sticky header: the wrapper is the timeline source and every
         animated element lives inside it, so the view-timeline stays in scope. -->
    <interact-element data-interact-key="page">
      <div class="scroll-track">
        <header class="header">
          <interact-element data-interact-key="logo">
            <div class="logo-slot">
              <interact-element data-interact-key="wordmark">
                <span class="wordmark">My Logo</span>
              </interact-element>

              <interact-element data-interact-key="symbol">
                <span class="symbol" aria-hidden="true">
                  <!-- viewBox tightened to the artwork's bounding box; fill follows
                       --ink via currentColor instead of the source .cls-1 fill. -->
                  <svg
                    viewBox="15.692 10.984 106.72 106.72"
                    width="22"
                    height="22"
                    fill="currentColor"
                  >
                    <path
                      d="M95.732,37.664c6.828,0,13.656,2.605,18.866,7.814,10.419,10.419,10.419,27.312,0,37.732-5.21,5.21-12.038,7.814-18.866,7.814v-53.361Z"
                    />
                    <path
                      d="M42.372,37.664c0-6.828,2.605-13.656,7.814-18.866,10.419-10.419,27.312-10.419,37.732,0,5.21,5.21,7.814,12.038,7.814,18.866h-53.361Z"
                    />
                    <path
                      d="M42.372,91.024c-6.828,0-13.656-2.605-18.866-7.814-10.419-10.419-10.419-27.312,0-37.732,5.21-5.21,12.038-7.814,18.866-7.814v53.361Z"
                    />
                    <path
                      d="M95.732,91.024c0,6.828-2.605,13.656-7.814,18.866-10.419,10.419-27.312,10.419-37.732,0-5.21-5.21-7.814-12.038-7.814-18.866h53.361Z"
                    />
                    <rect
                      x="50.186"
                      y="45.478"
                      width="37.732"
                      height="37.732"
                      transform="translate(-25.273 67.673) rotate(-45)"
                    />
                  </svg>
                </span>
              </interact-element>
            </div>
          </interact-element>

          <nav class="nav" id="primary-nav" aria-label="Primary">
            <a href="#">New</a>
            <a href="#">Shop</a>
            <a href="#">Collections</a>
            <a href="#">Archives</a>
          </nav>

          <button
            class="menu-toggle"
            type="button"
            aria-label="Open menu"
            aria-controls="primary-nav"
            aria-expanded="false"
          >
            <span class="menu-toggle-bars" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>

          <div class="cart" role="button" aria-label="Bag, 0 items">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
              <rect
                x="3"
                y="8.5"
                width="20"
                height="14"
                rx="1"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <line
                x1="3"
                y1="13"
                x2="23"
                y2="13"
                stroke="currentColor"
                stroke-width="0.75"
              />
              <text
                x="13"
                y="11.5"
                text-anchor="middle"
                font-size="4.5"
                font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
                letter-spacing="0.5"
                fill="currentColor"
              >
                BAG
              </text>
              <text
                x="13"
                y="20.5"
                text-anchor="middle"
                font-size="5"
                font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
                fill="currentColor"
              >
                0
              </text>
              <path
                d="M9 8.5V6.5a4 4 0 0 1 8 0v2"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </header>
      </div>
    </interact-element>


    <script type="module">
      import { Interact } from 'https://esm.sh/@wix/interact@2.5.9/web';

      const LOGO_EXPANDED = '108px'; // keep in sync with --logo-expanded
      const LOGO_COLLAPSED = '36px';

      // Front-loaded snap for the slot, a hard exit for the wordmark, and a springy
      // quarter-turn entrance for the mark — overlapping ranges so it reads as one
      // morph rather than two fades in sequence.
      const SNAP = 'cubic-bezier(0.23, 1, 0.32, 1)';
      const EXIT = 'cubic-bezier(0.55, 0, 0.12, 1)';
      const POP = 'cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      const pct = (value) => ({ name: 'contain', offset: { unit: 'percentage', value } });

      const config = {
        interactions: [
          {
            key: 'page',
            trigger: 'viewProgress',
            effects: [
              {
                key: 'wordmark',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(16),
                keyframeEffect: {
                  name: 'wordmark-out',
                  keyframes: [
                    {
                      offset: 0,
                      opacity: '1',
                      transform: 'translateX(0px) scale(1)',
                      filter: 'blur(0px)',
                      easing: EXIT,
                    },
                    {
                      offset: 1,
                      opacity: '0',
                      transform: 'translateX(-20px) scale(0.82)',
                      filter: 'blur(5px)',
                    },
                  ],
                },
              },
              {
                key: 'symbol',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(6),
                rangeEnd: pct(28),
                keyframeEffect: {
                  name: 'symbol-in',
                  keyframes: [
                    {
                      offset: 0,
                      opacity: '0',
                      transform: 'rotate(-90deg) scale(0.4)',
                      easing: POP,
                    },
                    {
                      offset: 1,
                      opacity: '1',
                      transform: 'rotate(0deg) scale(1)',
                    },
                  ],
                },
              },
              {
                key: 'logo',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(28),
                keyframeEffect: {
                  name: 'logo-shrink',
                  keyframes: [
                    { offset: 0, width: LOGO_EXPANDED, easing: SNAP },
                    { offset: 1, width: LOGO_COLLAPSED },
                  ],
                },
              },
            ],
          },
        ],
      };

      Interact.create(config);

      const header = document.querySelector('.header');
      const menuToggle = document.querySelector('.menu-toggle');
      if (header && menuToggle) {
        menuToggle.addEventListener('click', () => {
          const open = header.classList.toggle('is-menu-open');
          menuToggle.setAttribute('aria-expanded', String(open));
          menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        });
      }
    </script>
  </body>
</html>
