<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collapsing logo header — My Logo</title>

    <style>
      :root {
        --header-height: 60px;
        /* Everything in the header rendered 10% larger. Applied as one zoom on the
           header rather than by editing each size: the collapse's keyframes carry px
           values of their own, and scaling the stylesheet alone would have left the
           animation landing on the old numbers. zoom is a layout scale, so the
           keyframes are read in the same scaled space and stay in agreement — and
           unlike transform: scale it reserves the room it uses, so nothing overlaps
           what sits below. Set to 1 to get the original size back. */
        --content-scale: 1.1;
        /* One post-zoom pixel, expressed in the pre-zoom units the stylesheet is
           written in. Anything sized as a whole multiple of this lands on a whole
           pixel after the header's zoom is applied. Only worth doing for hairlines:
           the menu bars are 2px, and at 1.1 they came out 2.2px on fractional y
           positions, so the rasteriser rounded each of the three differently and
           they visibly disagreed in weight. Larger shapes absorb the rounding. */
        --hair: calc(1px / var(--content-scale));
        /* Inset from the container edge to the logo pill, and to the menu button on
           the other side. Three other places have to carry the same number and
           cannot read this variable: .surface's resting left below, the first
           surface-spread keyframe, and EDGE in the config at the bottom — the
           surface starts life sitting exactly on the pill, so if they disagree it
           steps sideways on the first frame of the collapse. */
        --edge-pad: 18px;
        --chip-collapsed: 48px;
        /* Minimum space between the mark and the text. It is a flex gap, so it is
           reserved no matter how long the label is. */
        --chip-gap: 24px;
        /* 8 padding + 32 mark + 24 gap + ~63 text + 6 + 8 padding.
           Swapping the text means re-measuring it and updating this — and the
           matching width in the generated keyframes. */
        --chip-expanded: 141px;
        --chip-height: 40px;
        /* One black for the mark, the label and the menu icon. */
        --ink: #000000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eeeeee;
        font-family:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }

      .header {
        zoom: var(--content-scale);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: var(--header-height);
        padding: 0 var(--edge-pad);
        background: rgba(238, 238, 238, 0.72);
        backdrop-filter: blur(10px);
      }

      /* Everything except the surface sits above it. */
      .header > *:not(.surface) {
        position: relative;
        z-index: 1;
      }

      /* The single white surface of the header. Its resting geometry is the capsule
         behind the logo — same position, size and radius the pill used to draw itself —
         and surface-spread stretches that same element into the full bar. Values here
         match the animation's first keyframe. */
      .surface {
        position: absolute;
        left: var(--edge-pad);
        top: 10px;
        width: var(--chip-expanded);
        height: var(--chip-height);
        border-radius: 999px;
        background: #ffffff;
        box-shadow:
          0 1px 1px rgba(16, 18, 27, 0.05),
          0 4px 12px rgba(16, 18, 27, 0.07);
        pointer-events: none;
      }

      /* Tall wrapper: its height is the scroll distance the animation is spread over,
         and it is the ViewTimeline source. */
      .scroll-track {
        height: 250vh;
      }

      /* flex-shrink: 0 so a narrow header never squeezes the animating width. */
      interact-element {
        display: block;
        flex: 0 0 auto;
      }

      /* The pointer target for the peek-on-hover effect. It always spans the expanded
         pill, so the hit area never moves and the pointer can travel over the whole
         revealed label without the pill collapsing under it. */
      .logo-slot {
        width: var(--chip-expanded);
        height: var(--chip-height);
      }

      /* The pill. Its width is what @wix/interact animates: it rests expanded and
         collapses as the page scrolls. Hover animates min-width instead, so the two
         effects never fight over one property: while the pill is collapsed the
         min-width wins and opens it, and at rest (width 141px) it changes nothing. */
      .chip {
        display: flex;
        align-items: center;
        width: var(--chip-expanded);
        height: var(--chip-height);
        padding: 0 8px;
        column-gap: var(--chip-gap);
        /* No background of its own: .surface draws the white behind it. This box only
           clips the label as it narrows. */
        border-radius: 999px;
        /* clip, not hidden: `hidden` creates a scroll container and can break the
           view timeline driving this element. */
        overflow: clip;
      }

      /* A square box, so the mark turns around its own centre. */
      .chip__icon {
        color: var(--ink);
        flex: 0 0 32px;
        height: 32px;
        display: grid;
        place-items: center;
      }

      /* Right-aligned flex content overflows (and is clipped) on the left, so the
         label is hidden last-letter-first as the pill narrows. The box hugs the text,
         which is what keeps --chip-gap exact — so there is no room for a soft mask
         over the clipping edge without tinting the first letter. */
      .chip__label {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        overflow: clip;
        padding-right: 6px;
      }

      .chip__text {
        white-space: nowrap;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      /* A floating white button at rest; menu-flatten dissolves it into the surface once
         the surface has spread, so the header ends up as one white plane. */
      .menu {
        flex: 0 0 auto;
        display: grid;
        /* 4 post-zoom px. With the bars at 2 each the block comes to 14, which
           centres in the 44px button at a whole 15px offset — so every bar starts on
           a pixel boundary rather than a third of the way into one. */
        gap: calc(4 * var(--hair));
        place-content: center;
        width: var(--chip-height);
        height: var(--chip-height);
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #ffffff;
        box-shadow:
          0 1px 1px rgba(16, 18, 27, 0.05),
          0 4px 12px rgba(16, 18, 27, 0.07);
        cursor: pointer;
      }

      .menu span {
        display: block;
        /* 18 x 2 post-zoom px. 16 would have scaled to 17.6 and left both ends soft;
           18 is the nearest whole pixel to it and keeps the bar the ~10% wider the
           rest of the header is. */
        width: calc(18 * var(--hair));
        height: calc(2 * var(--hair));
        border-radius: calc(2 * var(--hair));
        background: var(--ink);
        transition:
          transform 200ms cubic-bezier(0.33, 1, 0.68, 1),
          opacity 120ms linear;
      }

      /* Bars fold into a cross while the menu is open — the same treatment the other
         headers in this set use. The bars are 2px on a 4px gap, so their centres are
         6px apart and that is the travel needed to meet in the middle. */
      .header.is-menu-open .menu span:nth-child(1) {
        transform: translateY(calc(6 * var(--hair))) rotate(45deg);
      }

      .header.is-menu-open .menu span:nth-child(2) {
        opacity: 0;
      }

      .header.is-menu-open .menu span:nth-child(3) {
        transform: translateY(calc(-6 * var(--hair))) rotate(-45deg);
      }

      /* The panel hangs below the bar rather than sitting in its flow: the collapse
         animates the header's own geometry, and a panel in the flow would add to the
         height the animation is busy controlling.

         Selector is `.header > .menu-panel` rather than `.menu-panel` on purpose —
         the `.header > *:not(.surface)` rule above sets position: relative on every
         child, and at (0,2,0) it would otherwise outrank this and leave the panel in
         the flow. Matching that specificity and coming later is what wins. */
      .header > .menu-panel {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 2;
        display: none;
        flex-direction: column;
        background: #ffffff;
        box-shadow: 0 12px 28px rgba(16, 18, 27, 0.12);
      }

      .header.is-menu-open > .menu-panel {
        display: flex;
      }

      .menu-panel a {
        padding: 14px 20px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-decoration: none;
      }

      .menu-panel a + a {
        border-top: 1px solid rgba(16, 18, 27, 0.08);
      }

      .menu-panel a:hover {
        background: rgba(16, 18, 27, 0.04);
      }
    </style>

    <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
    <style>
      @keyframes chip-collapse {
        0% {
          width: 141px;
          animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
        }
        100% {
          width: 48px;
        }
      }
      @keyframes mark-turn {
        0% {
          rotate: 0deg;
          animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
        }
        100% {
          rotate: 90deg;
        }
      }
      @keyframes surface-spread {
        0% {
          left: 18px;
          top: 10px;
          width: 141px;
          height: 40px;
          border-radius: 999px;
          animation-timing-function: cubic-bezier(0.55, 0, 0.12, 1);
        }
        62% {
          left: 0px;
          top: 10px;
          width: 100%;
          height: 40px;
          border-radius: 999px;
          animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
        }
        100% {
          left: 0px;
          top: 0px;
          width: 100%;
          height: 60px;
          border-radius: 0px;
        }
      }
      @keyframes menu-flatten {
        0% {
          background-color: rgba(255, 255, 255, 1);
          box-shadow:
            0 1px 1px rgba(16, 18, 27, 0.05),
            0 4px 12px rgba(16, 18, 27, 0.07);
          animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
        }
        100% {
          background-color: rgba(255, 255, 255, 0);
          box-shadow:
            0 1px 1px rgba(16, 18, 27, 0),
            0 4px 12px rgba(16, 18, 27, 0);
        }
      }
      @keyframes chip-peek {
        0% {
          min-width: 48px;
        }
        100% {
          min-width: 141px;
        }
      }
      @keyframes mark-pop {
        0% {
          transform: rotate(0deg) scale(1);
        }
        100% {
          transform: rotate(90deg) scale(1.06);
        }
      }
      [data-interact-key='page'] > :first-child {
        view-timeline: --trigger-0;
      }
      [data-interact-key='chip'] > :first-child {
        --animation-0-7pdycko5nw: chip-collapse auto linear both 1;
        --animation-composition-0-7pdycko5nw: replace;
        --animation-timeline-0-7pdycko5nw: --trigger-0;
        --animation-range-0-7pdycko5nw: contain 0% contain 14%;
      }
      [data-interact-key='chip'] .chip__icon {
        --animation-0-lc0cibljk9: mark-turn auto linear both 1;
        --animation-composition-0-lc0cibljk9: replace;
        --animation-timeline-0-lc0cibljk9: --trigger-0;
        --animation-range-0-lc0cibljk9: contain 0% contain 18%;
      }
      [data-interact-key='page'] .surface {
        --animation-0-5or6xo3krd: surface-spread auto linear both 1;
        --animation-composition-0-5or6xo3krd: replace;
        --animation-timeline-0-5or6xo3krd: --trigger-0;
        --animation-range-0-5or6xo3krd: contain 0% contain 20%;
      }
      [data-interact-key='page'] .menu {
        --animation-0-pkrhmhotnx: menu-flatten auto linear both 1;
        --animation-composition-0-pkrhmhotnx: replace;
        --animation-timeline-0-pkrhmhotnx: --trigger-0;
        --animation-range-0-pkrhmhotnx: contain 9% contain 18%;
      }
      [data-interact-key='chip'] > :first-child {
        --animation-1-7pdycko5nw: chip-peek 240ms 0ms cubic-bezier(0.19, 1, 0.22, 1) both 1 paused;
        --animation-composition-1-7pdycko5nw: replace;
        --animation-timeline-1-7pdycko5nw: auto;
        --animation-range-1-7pdycko5nw: normal;
      }
      [data-interact-key='chip'] .chip__icon {
        --animation-1-lc0cibljk9: mark-pop 260ms 30ms cubic-bezier(0.175, 0.885, 0.32, 1.275) both 1
          paused;
        --animation-composition-1-lc0cibljk9: replace;
        --animation-timeline-1-lc0cibljk9: auto;
        --animation-range-1-lc0cibljk9: normal;
      }
      [data-interact-key='chip'] > :first-child {
        animation: var(--animation-0-7pdycko5nw, none), var(--animation-1-7pdycko5nw, none);
        animation-composition: var(--animation-composition-0-7pdycko5nw, replace),
          var(--animation-composition-1-7pdycko5nw, replace);
        animation-timeline: var(--animation-timeline-0-7pdycko5nw, auto),
          var(--animation-timeline-1-7pdycko5nw, auto);
        animation-range: var(--animation-range-0-7pdycko5nw, normal),
          var(--animation-range-1-7pdycko5nw, normal);
      }
      [data-interact-key='chip'] .chip__icon {
        animation: var(--animation-0-lc0cibljk9, none), var(--animation-1-lc0cibljk9, none);
        animation-composition: var(--animation-composition-0-lc0cibljk9, replace),
          var(--animation-composition-1-lc0cibljk9, replace);
        animation-timeline: var(--animation-timeline-0-lc0cibljk9, auto),
          var(--animation-timeline-1-lc0cibljk9, auto);
        animation-range: var(--animation-range-0-lc0cibljk9, normal),
          var(--animation-range-1-lc0cibljk9, normal);
      }
      [data-interact-key='page'] .surface {
        animation: var(--animation-0-5or6xo3krd, none);
        animation-composition: var(--animation-composition-0-5or6xo3krd, replace);
        animation-timeline: var(--animation-timeline-0-5or6xo3krd, auto);
        animation-range: var(--animation-range-0-5or6xo3krd, normal);
      }
      [data-interact-key='page'] .menu {
        animation: var(--animation-0-pkrhmhotnx, none);
        animation-composition: var(--animation-composition-0-pkrhmhotnx, replace);
        animation-timeline: var(--animation-timeline-0-pkrhmhotnx, auto);
        animation-range: var(--animation-range-0-pkrhmhotnx, normal);
      }
    </style>
  </head>

  <body>
    <!-- Tall wrapper + sticky container: the wrapper is the timeline source and the
         animated chip lives inside it, so the timeline is in scope with no extra CSS.
         Put the real page content inside .scroll-track and its height can go away. -->
    <interact-element data-interact-key="page">
      <div class="scroll-track">
        <header class="header">
          <!-- The white surface. At rest it is exactly the capsule behind the logo; on
               scroll it is the same element stretched into the full bar. -->
          <div class="surface"></div>

          <!-- The hover source is this fixed-size slot, not the pill: an effect that
               resizes the hovered element itself shifts its own hit area. -->
          <interact-element data-interact-key="logo">
            <div class="logo-slot">
              <interact-element data-interact-key="chip">
                <div class="chip">
                  <span class="chip__icon" aria-hidden="true">
                    <!-- viewBox is tightened to the artwork's own bounding box so the glyph
                         fills the icon slot; the fill follows the text colour instead of
                         the source file's `.cls-1` class, which would leak into the page. -->
                    <svg
                      viewBox="15.692 10.984 106.72 106.72"
                      width="22"
                      height="22"
                      fill="currentColor"
                    >
                      <path
                        d="M95.732,37.664c6.828,0,13.656,2.605,18.866,7.814,10.419,10.419,10.419,27.312,0,37.732-5.21,5.21-12.038,7.814-18.866,7.814v-53.361Z"
                      />
                      <path
                        d="M42.372,37.664c0-6.828,2.605-13.656,7.814-18.866,10.419-10.419,27.312-10.419,37.732,0,5.21,5.21,7.814,12.038,7.814,18.866h-53.361Z"
                      />
                      <path
                        d="M42.372,91.024c-6.828,0-13.656-2.605-18.866-7.814-10.419-10.419-10.419-27.312,0-37.732,5.21-5.21,12.038-7.814,18.866-7.814v53.361Z"
                      />
                      <path
                        d="M95.732,91.024c0,6.828-2.605,13.656-7.814,18.866-10.419,10.419-27.312,10.419-37.732,0-5.21-5.21-7.814-12.038-7.814-18.866h53.361Z"
                      />
                      <rect
                        x="50.186"
                        y="45.478"
                        width="37.732"
                        height="37.732"
                        transform="translate(-25.273 67.673) rotate(-45)"
                      />
                    </svg>
                  </span>
                  <span class="chip__label">
                    <span class="chip__text">My Logo</span>
                  </span>
                </div>
              </interact-element>
            </div>
          </interact-element>

          <button
            class="menu"
            type="button"
            aria-label="Open menu"
            aria-controls="primary-menu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <!-- The menu the button claimed to open. It had none: the control was
               labelled "Open menu" with no aria-controls, no aria-expanded, no panel
               anywhere in the page and no handler, so it announced itself to a screen
               reader as a menu button and then did nothing when pressed. -->
          <nav class="menu-panel" id="primary-menu" aria-label="Primary">
            <a href="#">New</a>
            <a href="#">Shop</a>
            <a href="#">Collections</a>
            <a href="#">Archives</a>
          </nav>
        </header>
      </div>
    </interact-element>


    <script type="module">
      import { Interact } from 'https://esm.sh/@wix/interact@2.5.9/web';

      const COLLAPSED = '48px';
      const EXPANDED = '141px'; // keep in sync with --chip-expanded

      // Most of the travel happens in the first fraction of the range, so the header
      // reacts on the very first pixels of scroll instead of easing in slowly.
      const SNAP = 'cubic-bezier(0.23, 1, 0.32, 1)';

      // The surface gets its own pair: a slow-in, fast-out sweep for the horizontal throw,
      // then a plain ease-out for the vertical fill it lands on.
      const SWEEP = 'cubic-bezier(0.55, 0, 0.12, 1)';
      const SETTLE = 'cubic-bezier(0.33, 1, 0.68, 1)';

      // The one shadow in the design, shared by the surface and the menu button.
      const SHADOW = '0 1px 1px rgba(16, 18, 27, 0.05), 0 4px 12px rgba(16, 18, 27, 0.07)';
      const SHADOW_GONE = '0 1px 1px rgba(16, 18, 27, 0), 0 4px 12px rgba(16, 18, 27, 0)';

      const MARK = '.chip__icon';

      // Must equal --edge-pad in the stylesheet: this is where the surface sits before
      // it is thrown across the bar, and it has to start out exactly under the pill.
      const EDGE = '18px';

      // Short, closely spaced ranges: the whole collapse resolves within ~200px of
      // scroll, and the small offsets between them keep it from landing all at once.
      const pct = (value) => ({ name: 'contain', offset: { unit: 'percentage', value } });

      const config = {
        interactions: [
          {
            // The source is the tall .scroll-track wrapper; its height is the scroll
            // distance, and `contain` covers the phase where the header is stuck.
            key: 'page',
            trigger: 'viewProgress',
            effects: [
              {
                key: 'chip', // the animated element inside the sticky header
                easing: 'linear', // per-keyframe easing shapes the motion
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(14),
                keyframeEffect: {
                  name: 'chip-collapse',
                  keyframes: [
                    { offset: 0, width: EXPANDED, easing: SNAP },
                    { offset: 1, width: COLLAPSED },
                  ],
                },
              },
              {
                // One clean quarter turn, finishing just after the pill: the mark is the
                // last thing to settle. `rotate` is its own property, so the hover
                // transform below composes with it instead of overwriting it.
                key: 'chip',
                selector: MARK,
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(18),
                keyframeEffect: {
                  name: 'mark-turn',
                  keyframes: [
                    { offset: 0, rotate: '0deg', easing: SNAP },
                    { offset: 1, rotate: '90deg' },
                  ],
                },
              },
              {
                // The white bar is not a second surface fading in: it is the logo's own
                // capsule stretching out. The same element travels from the pill's
                // geometry to the full header, so the bar that ends up covering
                // everything visibly came out of the logo.
                //
                // The travel is deliberately the long one here, and in two stages, so it
                // reads as a stretch rather than a state change: it is thrown out
                // sideways first, holding its 40px height and its round ends, and only
                // once it spans the header does it drop its radius and fill the 60px.
                selector: '.surface',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(0),
                rangeEnd: pct(20),
                keyframeEffect: {
                  name: 'surface-spread',
                  keyframes: [
                    {
                      offset: 0,
                      left: EDGE,
                      top: '10px',
                      width: EXPANDED,
                      height: '40px',
                      borderRadius: '999px',
                      easing: SWEEP,
                    },
                    {
                      // A full-width capsule: the whole throw has happened, none of the
                      // squaring off yet.
                      offset: 0.62,
                      left: '0px',
                      top: '10px',
                      width: '100%',
                      height: '40px',
                      borderRadius: '999px',
                      easing: SETTLE,
                    },
                    {
                      offset: 1,
                      left: '0px',
                      top: '0px',
                      width: '100%',
                      height: '60px',
                      borderRadius: '0px',
                    },
                  ],
                },
              },
              {
                // Held back until the spreading surface has reached the button, so the
                // capsule dissolves as the white arrives under it rather than before.
                selector: '.menu',
                easing: 'linear',
                fill: 'both',
                rangeStart: pct(9),
                rangeEnd: pct(18),
                keyframeEffect: {
                  name: 'menu-flatten',
                  keyframes: [
                    {
                      offset: 0,
                      backgroundColor: 'rgba(255, 255, 255, 1)',
                      boxShadow: SHADOW,
                      easing: SETTLE,
                    },
                    {
                      offset: 1,
                      backgroundColor: 'rgba(255, 255, 255, 0)',
                      boxShadow: SHADOW_GONE,
                    },
                  ],
                },
              },
            ],
          },
          {
            // Peek on pointer/keyboard interest. It animates min-width, not width, so
            // it never competes with the scroll effect above: it only has something to
            // do once the scroll has narrowed the pill.
            key: 'logo', // the fixed-size slot, so the hit area never moves
            trigger: 'interest', // hover, plus keyboard focus
            effects: [
              {
                key: 'chip',
                triggerType: 'alternate', // opens on enter, reverses on leave
                fill: 'both',
                duration: 240,
                // No overshoot here: the pill must not push past its own hover slot.
                easing: 'expoOut', // named easing from @wix/motion
                keyframeEffect: {
                  name: 'chip-peek',
                  keyframes: [{ minWidth: COLLAPSED }, { minWidth: EXPANDED }],
                },
              },
              {
                // The mark answers a beat later with its own turn and a small pop —
                // the one place that is allowed to overshoot.
                key: 'chip',
                selector: MARK,
                triggerType: 'alternate',
                fill: 'both',
                duration: 260,
                delay: 30,
                easing: 'backOut',
                keyframeEffect: {
                  name: 'mark-pop',
                  keyframes: [
                    { transform: 'rotate(0deg) scale(1)' },
                    { transform: 'rotate(90deg) scale(1.06)' },
                  ],
                },
              },
            ],
          },
        ],
      };

      Interact.create(config);

      // Same wiring as the other headers in this set: the open state lives as a class
      // on .header so CSS drives both the panel and the bars, and the button's label
      // and aria-expanded are kept in step with it.
      const header = document.querySelector('.header');
      const menu = document.querySelector('.menu');
      if (header && menu) {
        menu.addEventListener('click', () => {
          const open = header.classList.toggle('is-menu-open');
          menu.setAttribute('aria-expanded', String(open));
          menu.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        });
      }
    </script>
  </body>
</html>
