<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Logo — collapsing wordmark header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Measured off Aug-11-2026 10-58-46.mp4, frame by frame. The recording is a
         1802x308 crop of a ~1900px window at 1x — the crop loses about 105px on the
         left, which is why the first rail cell and the start of the wordmark run off
         the edge of it. Figures in the comments below are that window's CSS pixels. */
      :root {
        --ink: #0b0b0b;
        --rule: #0b0b0b;

        /* The collapsed size is the clip's, measured. The expanded size is set so the
           two are 182px apart, which is the travel the rail's top edge was measured
           making — that distance is the animation, so it is the thing worth holding
           on to. 12.1cqw is 230px at the 1900px window the clip was recorded on, and
           keeps scaling with the viewport the way the original did.

           It is no longer sized to lay the wordmark across the full width. That was
           the clip's look, but it only works for a long wordmark: "My Logo" is 3.5em
           against "Mattia Capezzani®"'s 7.4em, so filling the width would want 538px
           of type and a 558px header — near enough double. */
        --wordmark-expanded: 12.1cqw;
        --wordmark-collapsed: 48px;

        /* Plain line-height 1. It was briefly squeezed to 0.88, to make Crimson —
           which is 7.5% narrower per unit of height than the clip's own face — match
           the measured widths and the measured header travel at the same time. That
           compensation bought nothing once the wordmark changed, and it cost: the box
           closed up around the type while the descenders stayed put, so the y and g
           hung into the rail with 5px to spare. */
        --wordmark-leading: 1;

        --masthead-pad-top: 16px;
        /* Opened up from the 16px the clip had on both sides. Only the underside
           moves, so the wordmark keeps its position and the header just gains the
           difference. */
        --masthead-pad-bottom: 26px;

        /* The rail never moves or resizes in the clip — 53px tall throughout, cells
           unchanged. All it does is ride up as the wordmark above it shrinks. */
        --rail-h: 53px;
        /* Inset from the screen edges to the first and last link. Opened up from the
           18px the clip's cells carried, and made proportional on the way: with the
           links spread by space-between it is only the outer two that touch the
           edges, so a flat value reads tighter and tighter as the window grows.
           Held under 4vw so five links never crowd the middle. */
        --rail-pad: clamp(16px, 3.4vw, 64px);
        --rail-size: 25px;

        /* Scroll distance the collapse is spread over. Also .trigger's height.
           Measured, not guessed: the rail's top edge was tracked frame by frame for
           progress, and the page's own scroll was recovered over the same frames by
           correlating the strip of content visible under the header. Progress came
           out linear against scroll — 0.198 to 0.967 over 143px — which extrapolates
           to 186px end to end. It only looks eased in the clip because the flick that
           drove it was still accelerating. */
        --collapse-distance: 186px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      interact-element {
        display: block;
      }

      /* generate() declares the timeline on the page key's first child, which is a
         sibling of the header rather than an ancestor, so the name has to be hoisted
         to their common parent for the header to see it. Rename this alongside the
         --trigger-N that generate() emits if the config gains interactions. */
      [data-interact-key='page'] {
        timeline-scope: --trigger-0;
      }

      /* The ViewTimeline source, and the only thing that sets the scroll distance:
         a fixed-height box pinned to the top of the document. Its `exit` range runs
         from scrollY 0 to exactly its own height, which keeps the timing identical
         on every viewport — unlike a range measured against the whole page. */
      .trigger {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: var(--collapse-distance);
        opacity: 0;
        pointer-events: none;
      }

      /* The whole banner — wordmark and rail — is this one element. It used to be a
         sticky div with a <header> nested inside it doing nothing the div was not
         already doing; now the element that sticks, the element that paints the
         white behind the type, and the element the page reads as its header are all
         the same box, so "the header" means one unambiguous thing in the markup. */
      .chrome {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #ffffff;
      }

      /* The wordmark's own band. Nothing here is animated except the font-size the
         generated keyframes drive — the header's height is simply what this line
         box comes to, so the rail below is carried up by the type shrinking rather
         than by a second animation that would have to be kept in step with it. */
      .masthead {
        display: block;
        padding: var(--masthead-pad-top) 0 var(--masthead-pad-bottom);
        text-align: center;
        /* At its largest the wordmark is 99.3% of the content box, so it never
           actually spills — but it is close enough that a rounding difference in
           another font would put a horizontal scrollbar on the page. clip, never
           hidden: overflow: hidden on an ancestor of the timeline source creates a
           new scroll context and silently breaks the whole ViewTimeline. Pairing
           clip on one axis with visible on the other is allowed, which matters here
           because the squeezed line box lets the type sit proud of its own box. */
        overflow-x: clip;
        /* Gives --wordmark-expanded its 100cqw. */
        container: masthead / inline-size;
      }

      /* No open font matches the clip's. It was measured three ways — glyph ink
         widths, letter advances, and the whole string's aspect — and nothing wins on
         all three, which is the signature of a licensed face. Crimson takes the two
         that describe the letterforms themselves (3.9% and 4.1% off, against 6.8%
         and 4.7% for Times, the runner-up); Georgia and Gelasio match the aspect
         almost exactly but are visibly the wrong drawing, low-contrast and
         large-x-height where the clip is neither. The aspect is what the leading
         above compensates for. */
      .wordmark {
        display: block;
        font-family: 'Crimson Text', 'Times New Roman', Times, serif;
        font-weight: 400;
        font-size: var(--wordmark-expanded);
        line-height: var(--wordmark-leading);
        white-space: nowrap;
        color: var(--ink);
        text-decoration: none;
        user-select: none;
      }

      /* Five links, evenly spaced. This was the clip's boxed grid — eleven cells
         divided by hairlines, a spacer, a search field and an account group — and it
         is now an ordinary menu.

         space-between is what makes the spacing even: it hands the leftover width out
         in equal shares between the items, so the five gaps stay identical to each
         other no matter how differently the words measure. The rail's own padding
         keeps the outer two off the edges, which the old cells got from their
         borders. The top and bottom rules stay: with the page white below, the lower
         one is the only thing marking where the header ends. */
      .rail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--rail-h);
        padding: 0 var(--rail-pad);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        font-size: var(--rail-size);
      }

      /* inline-flex so the three links carrying a chevron keep it on the baseline
         beside the word instead of letting it sit as a stray inline image. */
      .rail__cell {
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
      }

      /* Sized in em rather than the source file's flat 12px: the rail's type is 25px
         here against 16px there, so a fixed chevron would have come out noticeably
         small against it. 0.5em keeps the same proportion to the word. */
      .chev {
        width: 0.5em;
        height: 0.5em;
        flex: 0 0 auto;
      }

      /* Underline rather than the old cell's background tint, which had nothing left
         to fill now that the cells have no edges. */
      .rail__cell:hover {
        text-decoration: underline;
        text-underline-offset: 0.28em;
      }

      /* Empty white page under the header. It still needs a height — this is what
         gives the document something to scroll, and the collapse has nothing to
         scrub against without it. The rail's bottom border is what separates the
         sticky header from it once the two are touching. */
      .stage {
        height: 220vh;
      }

      /* Five links need far less room than the eleven cells did, so these steps are
         about the type staying comfortable rather than the rail running out of line.
         Nothing is dropped at any width — space-between just closes the gaps up. */
      @media (max-width: 1200px) {
        :root {
          --rail-size: 18px;
          --rail-h: 42px;
          --wordmark-collapsed: 30px;
          --masthead-pad-top: 12px;
          --masthead-pad-bottom: 20px;
        }
      }

      @media (max-width: 720px) {
        :root {
          --rail-size: 15px;
          --rail-h: 36px;
          --wordmark-collapsed: 22px;
        }

        /* Six labels this long stop fitting one line somewhere under 800px, and with
           nothing to collapse them into they have to be allowed to wrap. Once they
           do, space-between is the wrong rule — it would stretch a two-item last row
           across the full width — so the spacing becomes a flat gap and the rows
           centre instead. The fixed height gives way to a floor for the same reason. */
        .rail {
          height: auto;
          min-height: var(--rail-h);
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px clamp(14px, 4vw, 28px);
          padding-block: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wordmark {
          font-size: var(--wordmark-collapsed);
        }
      }
    </style>

    <!-- Output of @wix/interact's generate(config, true). Re-run generate() if the
         config at the bottom of this file changes. -->
    <style>
@keyframes wordmark-collapse {
0% {
font-size: 12.1cqw;
}
100% {
font-size: 48px;
}
}
[data-interact-key="page"] > :first-child {
view-timeline: --trigger-0;
}
[data-interact-key="wordmark"] > :first-child {
--animation-0-15bwrqduy1a: wordmark-collapse auto linear both 1 ;
--animation-composition-0-15bwrqduy1a: replace;
--animation-timeline-0-15bwrqduy1a: --trigger-0;
--animation-range-0-15bwrqduy1a: exit 0% exit 100%;
}
[data-interact-key="wordmark"] > :first-child {
animation: var(--animation-0-15bwrqduy1a, none);
animation-composition: var(--animation-composition-0-15bwrqduy1a, replace);
animation-timeline: var(--animation-timeline-0-15bwrqduy1a, auto);
animation-range: var(--animation-range-0-15bwrqduy1a, normal);
}
    </style>
  </head>

  <body>
    <interact-element data-interact-key="page">
      <div class="trigger" aria-hidden="true"></div>

      <header class="chrome">
        <!-- The interact-element sits inside .masthead, not around it: generate()
             hangs the animation off `[data-interact-key] > :first-child`, so the
             wrapper has to be the type's immediate parent or the font-size lands on
             a box the wordmark does not inherit from. .masthead stays outside it as
             the container --wordmark-expanded measures its 100cqw against. -->
        <div class="masthead">
          <interact-element data-interact-key="wordmark">
            <a class="wordmark" href="#" aria-label="My Logo home">My Logo</a>
          </interact-element>
        </div>

        <nav class="rail" aria-label="Primary">
          <a class="rail__cell" href="#">Insurer</a>
          <a class="rail__cell" href="#">
            Workplace
            <svg class="chev" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <a class="rail__cell" href="#">Education</a>
          <a class="rail__cell" href="#">
            About
            <svg class="chev" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <a class="rail__cell" href="#">
            Our people
            <svg class="chev" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <a class="rail__cell" href="#">Get Pricing</a>
        </nav>
      </header>

      <div class="stage" aria-hidden="true"></div>
    </interact-element>


    <script type="module">
      import { Interact } from 'https://esm.sh/@wix/interact@2.5.9/web';

      // Scroll-scrubbed collapse of the wordmark.
      // Docs: llms-full.txt — viewProgress + keyframeEffect + fill:both, with the
      // range set on the effect rather than the trigger.
      // `exit 0%` -> `exit 100%` on .trigger maps to scrollY 0 -> .trigger's height,
      // so the collapse always finishes after --collapse-distance of scrolling.
      // linear because that is what the clip measured: progress tracked the page's
      // scroll position straight, with no easing on top.
      const exitAt = (value) => ({
        name: 'exit',
        offset: { unit: 'percentage', value },
      });

      const config = {
        interactions: [
          {
            key: 'page',
            trigger: 'viewProgress',
            effects: [
              {
                key: 'wordmark',
                easing: 'linear',
                fill: 'both',
                rangeStart: exitAt(0),
                rangeEnd: exitAt(100),
                keyframeEffect: {
                  name: 'wordmark-collapse',
                  keyframes: [
                    { offset: 0, fontSize: '12.1cqw' },
                    { offset: 1, fontSize: '48px' },
                  ],
                },
              },
            ],
          },
        ],
      };

      Interact.create(config);
    </script>
  </body>
</html>
