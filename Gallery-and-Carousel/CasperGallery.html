<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casper Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    interact-element {
      display: block;
    }

    #image-container {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: clip;
    }

    #grid {
      position: absolute;
      inset: -3vmin;
      display: grid;
      /* Much denser field: 16 x 9 tiles means the images sit shoulder to shoulder,
         so a single pointer pass lights up a thick cluster instead of a few dots. */
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(9, 1fr);
    }

    #grid > interact-element {
      min-width: 0;
      min-height: 0;
    }

    .cell {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    /* Cheap scatter so the field reads as a loose cloud, not a rigid grid. */
    #grid > interact-element:nth-child(3n) .cell {
      align-items: flex-end;
    }

    #grid > interact-element:nth-child(4n + 1) .cell {
      align-items: flex-start;
    }

    #grid > interact-element:nth-child(5n + 2) .cell {
      justify-content: flex-start;
    }

    #grid > interact-element:nth-child(7n + 3) .cell {
      justify-content: flex-end;
    }

    .cell-inner {
      will-change: transform;
    }

    .cell-img {
      display: block;
      /* Baseline (medium) tile. Size tiers below override this for a mixed field. */
      width: clamp(58px, 6.4vw, 98px);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 3px;
      opacity: 0;
      transform: scale(0.06);
      transform-origin: center;
      will-change: transform, opacity, filter;
      pointer-events: none;
    }

    /* --- Size tiers ------------------------------------------------------
       Deterministic, co-prime nth-child steps so the field mixes small
       confetti with a handful of large "hero" tiles. Images are allowed to
       overflow their cell (the cell itself stays the stable hover hit area,
       so varying image size never shifts the pointer regions). Later rules
       win on ties, which is what produces the irregular distribution. */

    /* Small */
    #grid > interact-element:nth-child(5n + 3) .cell-img {
      width: clamp(40px, 4.4vw, 64px);
    }

    /* Extra small — sparse specks */
    #grid > interact-element:nth-child(13n + 6) .cell-img {
      width: clamp(28px, 3.1vw, 46px);
    }

    /* Medium-large */
    #grid > interact-element:nth-child(7n + 1) .cell-img {
      width: clamp(82px, 9.2vw, 140px);
    }

    /* Large */
    #grid > interact-element:nth-child(11n + 4) .cell-img {
      width: clamp(104px, 11.8vw, 178px);
    }

    /* Extra large — a few dominant anchors */
    #grid > interact-element:nth-child(23n + 9) .cell-img {
      width: clamp(130px, 15vw, 228px);
      border-radius: 4px;
    }

    /* A little aspect variety so it doesn't read as an all-squares field. */
    #grid > interact-element:nth-child(9n + 2) .cell-img {
      aspect-ratio: 3 / 4;
    }

    #grid > interact-element:nth-child(8n + 5) .cell-img {
      aspect-ratio: 4 / 3;
    }
  </style>
</head>

  <script type="module">
    import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';
    import { TrackMouse } from 'https://esm.sh/@wix/motion-presets';

    Interact.registerEffects({ TrackMouse });

    const CELL_COUNT = 144;
    const interactions = [];

    for (let i = 0; i < CELL_COUNT; i += 1) {
      const key = `cell-${i}`;
      // Deterministic per-cell variation - keeps the field from feeling mechanical.
      const rotation = ((i * 37) % 29) - 14;
      const floatDistance = 3 + ((i * 53) % 6);
      const floatDuration = 3000 + ((i * 611) % 2400);
      const floatDelay = (i * 173) % 1800;

      // Pointer bloom: the cell is the (stable) hit area, the image inside is the
      // target - so scaling it never shifts the hover region. `triggerType: 'alternate'`
      // plays in on enter and reverses out on leave, leaving a trail behind the
      // cursor.
      //
      // Asymmetric feel, the Casper way: the whole visible transition lives in the
      // first ~24% of a long (1300ms) timeline and the rest is a hold. Played
      // forward that means the tile is fully up in ~120ms - an instant pop. Played
      // in reverse on mouse-out it keeps the hold first, so the tile lingers under
      // the trail for ~1s and then dissolves gradually instead of blinking off.
      interactions.push({
        key,
        trigger: 'hover',
        effects: [
          {
            selector: '.cell-img',
            // Play-mode lives on the effect as `triggerType` in the current API
            // (it used to be `params: { type }` on the interaction).
            triggerType: 'alternate',
            duration: 1300,
            // Linear overall so the keyframe offsets alone shape the timing.
            easing: 'linear',
            fill: 'both',
            keyframeEffect: {
              name: `bloom-${i}`,
              keyframes: [
                {
                  offset: 0,
                  opacity: 0,
                  transform: `scale(0.06) rotate(${rotation}deg)`,
                  filter: 'brightness(1.5) saturate(1.5)',
                },
                {
                  // ~45ms in: already half-visible - this is the "pop".
                  offset: 0.035,
                  opacity: 0.55,
                  transform: `scale(0.94) rotate(${rotation * 0.45}deg)`,
                  filter: 'brightness(1.3) saturate(1.35)',
                },
                {
                  // ~115ms in: full opacity with a scale overshoot.
                  offset: 0.09,
                  opacity: 1,
                  transform: `scale(1.3) rotate(${rotation * 0.22}deg)`,
                  filter: 'brightness(1.16) saturate(1.2)',
                },
                {
                  offset: 0.16,
                  opacity: 1,
                  transform: `scale(0.97) rotate(${rotation * 0.08}deg)`,
                  filter: 'brightness(1.06) saturate(1.1)',
                },
                {
                  // Settled by ~310ms - everything after this is a hold, which
                  // becomes the slow tail when the animation runs in reverse.
                  offset: 0.24,
                  opacity: 1,
                  transform: 'scale(1) rotate(0deg)',
                  filter: 'brightness(1) saturate(1)',
                },
                {
                  offset: 1,
                  opacity: 1,
                  transform: 'scale(1) rotate(0deg)',
                  filter: 'brightness(1) saturate(1)',
                },
              ],
            },
          },
        ],
      });

      // Ambient drift on a wrapper, so it never fights the bloom.
      interactions.push({
        key,
        trigger: 'viewEnter',
        params: { threshold: 0 },
        effects: [
          {
            selector: '.cell-inner',
            triggerType: 'once',
            duration: floatDuration,
            delay: floatDelay,
            iterations: Infinity,
            alternate: true,
            easing: 'ease-in-out',
            fill: 'both',
            keyframeEffect: {
              name: `float-${i}`,
              keyframes: [
                { transform: 'translate3d(0px, 0px, 0px)' },
                { transform: `translate3d(0px, -${floatDistance}px, 0px)` },
              ],
            },
          },
        ],
      });
    }

    // Whole field leans toward the cursor anywhere in the viewport.
    interactions.push({
      key: 'image-field',
      trigger: 'pointerMove',
      params: { hitArea: 'root' },
      effects: [
        {
          selector: '#grid',
          fill: 'both',
          namedEffect: {
            type: 'TrackMouse',
            distance: { value: 56, unit: 'px' },
            axis: 'both',
          },
        },
      ],
    });

    Interact.create({ interactions });
  </script>
