<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casper Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    interact-element {
      display: block;
    }

    .mouse-image {
      position: absolute;
      left: 0;
      top: 0;
      width: 120px;
      aspect-ratio: 1;
      object-fit: cover;
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(0);
      transform-origin: center;
      will-change: transform, opacity;
    }
  </style>
</head>
<body class="bg-gray-50 antialiased">
  <interact-element data-interact-key="image-field">
    <main id="image-container" class="relative h-screen w-screen overflow-clip bg-gray-50">
      <div class="pointer-events-none absolute left-1/2 top-8 z-20 -translate-x-1/2 rounded-lg bg-white/70 px-4 py-2 text-sm font-medium text-gray-700 shadow-md backdrop-blur-sm">
        Move your mouse over the screen
      </div>
    </main>
  </interact-element>

  <script type="module">
    import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

    const IMAGE_COUNT = 250;
    const MAX_DISTANCE = 200;
    const MAX_SCALE = 3.6;
    const SMOOTHING = 0.2;
    const IMAGE_SIZE = 120;
    const FRAME = 1000 / 60;

    const container = document.getElementById('image-container');

    for (let index = 1; index <= IMAGE_COUNT; index += 1) {
      const image = document.createElement('img');
      image.src = `https://picsum.photos/300/300?random=${index}`;
      image.alt = '';
      image.className = 'mouse-image shadow-sm';
      image.decoding = 'async';
      image.loading = index > 40 ? 'lazy' : 'eager';
      container.appendChild(image);
    }

    const images = Array.from(container.querySelectorAll('.mouse-image'));
    const pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let lastTime = 0;
    let seeded = false;

    function resetImage(image, width, height) {
      image._x = -IMAGE_SIZE + Math.random() * (width / 2);
      image._y = height - IMAGE_SIZE / 2 - Math.random() * (height / 2);
      image._v = 0.5 + Math.random() * 1.5;
      image._s = 0;
    }

    // Single render pass. Driven by @wix/interact's own animation loop (the
    // looping customEffect below), and re-run on each pointer sample so the
    // field stays responsive even if motion is reduced.
    function render(now) {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (!width || !height) return;

      if (!seeded) {
        images.forEach((image) => resetImage(image, width, height));
        seeded = true;
        lastTime = now;
      }

      const delta = Math.min(Math.max(now - lastTime, 0), 100) / FRAME;
      lastTime = now;

      for (const image of images) {
        image._x += image._v * delta;
        image._y -= image._v * delta;

        if (image._x > width || image._y < -IMAGE_SIZE) {
          resetImage(image, width, height);
        }

        const centerX = image._x + IMAGE_SIZE / 2;
        const centerY = image._y + IMAGE_SIZE / 2;
        const distance = Math.hypot(pointer.x - centerX, pointer.y - centerY);
        const targetScale = Math.max(0, MAX_SCALE * (1 - distance / MAX_DISTANCE));

        image._s += (targetScale - image._s) * Math.min(1, SMOOTHING * delta);

        const visible = image._s > 0.01;
        if (visible !== image._vis) {
          image.style.opacity = visible ? '1' : '0';
          image._vis = visible;
        }

        image.style.transform = `translate3d(${image._x}px, ${image._y}px, 0) scale(${image._s})`;
      }
    }

    // Time effect: interact keeps this custom effect ticking for as long as the
    // field is on screen, which replaces the hand-rolled requestAnimationFrame loop.
    const driftField = (_element, progress) => {
      if (progress === null) return; // teardown signal
      render(performance.now());
    };

    // Scrub effect: pointer position across the viewport, 0-1 on each axis.
    const trackPointer = (_element, progress) => {
      if (!progress) return;
      pointer.x = progress.x * window.innerWidth;
      pointer.y = progress.y * window.innerHeight;
      render(performance.now());
    };

    Interact.create({
      interactions: [
        {
          key: 'image-field',
          trigger: 'viewEnter',
          params: { threshold: 0 },
          effects: [
            {
              duration: 1000,
              iterations: Infinity,
              easing: 'linear',
              fill: 'both',
              triggerType: 'once',
              customEffect: driftField,
            },
          ],
        },
        {
          key: 'image-field',
          trigger: 'pointerMove',
          params: { hitArea: 'root' },
          effects: [
            {
              fill: 'both',
              customEffect: trackPointer,
            },
          ],
        },
      ],
    });
  </script>
</body>
</html>
