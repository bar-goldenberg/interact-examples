<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Pop-up Effect</title>
    <!-- Load Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load @wix/interact -->
    <script src="https://esm.sh/@wix/interact@2.5.1/web" type="module"></script>
    <style>
        /* CSS custom properties (controllable via explorer sliders) */
        :root {
            --trigger-distance: 85;
            --spawn-count: 1;
            --base-size: 210;
            --border-radius: 0;
        }

        /* Set the Inter font as the default */
        html, body {
            font-family: 'Inter', sans-serif;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: clip; /* Prevent scrollbars from appearing */
        }

        /* This is now the main WRAPPER class for the image + title */
        .popup-wrapper {
            position: absolute;
            /* Center the wrapper on the cursor */
            transform: translate(-50%, -50%);
            /* Prevent images from capturing mouse events */
            pointer-events: none;
            /* Apply the animation - new duration */
            animation: popAndFade 0.55s ease-out forwards;
            will-change: transform, opacity;
        }

        /* Styling for the image itself, inside the wrapper.
           Size and radius come straight from the CSS variables --
           --rand is the per-image randomization factor (0.8 - 1.2). */
        .popup-wrapper img {
            display: block;
            width: auto;
            height: auto;
            max-width: calc(var(--base-size) * var(--rand, 1) * 1px);
            max-height: calc(var(--base-size) * var(--rand, 1) * 1px);
            border-radius: calc(var(--border-radius) * 1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* The keyed pointer-trail root must fill the viewport */
        interact-element[data-interact-key="cursor-trail"] {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* The source images live in the markup (hidden) so they are
           pre-loaded and simply cloned when the cursor spawns one. */
        #trail-sources { display: none; }

        /* * Animation keyframes:
         * Total duration: 0.55s
         * 0% - 32%: Fast expand
         * 32% - 80%: Shorter hold
         * 80% - 100%: Faster fade
         */
        @keyframes popAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            32% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            80% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- This is the main container that listens for pointer movement -->
    <interact-element data-interact-key="cursor-trail">
        <div id="effect-container" class="relative w-full h-full">
            <!-- Helper text to guide the user -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <interact-element data-interact-key="helper-text">
                    <p class="text-gray-400 text-lg">
                        Move your mouse around the screen
                    </p>
                </interact-element>
            </div>
        </div>
    </interact-element>

    <!-- Image pool: declarative source list, pre-loaded and cloned on spawn -->
    <div id="trail-sources" aria-hidden="true">
        <img src="https://static.wixstatic.com/media/9eca39_bc8b7813d7474b8db690847acd574ebc~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_e0af56b91bf64fbc9611afab61b96d96~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_e824a437f7744180929afdd797603004~mv2.webp" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_4834077538244734befe8dfdafb2bf52~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_3f6aea6c9b914664b028f84f10b8c3d6~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_f2559369489a42659e862b8d2cbf0789~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_f3130cc17ba8447b8f803d846563f9f6~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_8923188b5c0046709dada3d38f6e3dcf~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_2057483f44894c84a447b85f900f4cde~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_618bfeb93fcf4f5ca7a9f42733b3b61e~mv2.webp" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_f2f224dca1fc48e3898fc9256e214502~mv2.jpg" alt="">
        <img src="https://static.wixstatic.com/media/9eca39_118b28ee9fcf4f83aff362a0f60e1ed8~mv2.jpg" alt="">
    </div>

    <script type="module">
        import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';
        import { CustomMouse } from 'https://esm.sh/@wix/motion-presets';

        // pointerMove + customEffect is driven by the CustomMouse preset
        Interact.registerEffects({ CustomMouse });

        // Read a CSS custom property as a number (explorer sliders drive these)
        const cssVar = (name, fallback) => {
            const n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
            return isNaN(n) ? fallback : n;
        };

        // Pointer position of the last spawn
        let last = { x: 0, y: 0 };

        Interact.create({
            interactions: [
                {
                    // Helper text fades out shortly after it becomes visible
                    key: 'helper-text',
                    trigger: 'viewEnter',
                    effects: [
                        {
                            triggerType: 'once',
                            keyframeEffect: {
                                name: 'gentleFadeOut',
                                keyframes: [
                                    { opacity: 1, offset: 0 },
                                    { opacity: 1, offset: 0.8 },
                                    { opacity: 0, offset: 1.0 }
                                ]
                            },
                            duration: 4000,
                            fill: 'both'
                        }
                    ]
                },
                {
                    // Cursor trail: spawns an image every --trigger-distance px of travel
                    key: 'cursor-trail',
                    trigger: 'pointerMove',
                    params: { hitArea: 'root' },
                    effects: [
                        {
                            fill: 'both',
                            customEffect: (element, progress) => {
                                if (progress.active === false) return;

                                const x = progress.x * window.innerWidth;
                                const y = progress.y * window.innerHeight;

                                // Only spawn once the pointer has travelled far enough
                                if (Math.hypot(x - last.x, y - last.y) <= cssVar('--trigger-distance', 85)) return;
                                last = { x, y };

                                const stage = element.querySelector('#effect-container') || element;
                                const sources = document.querySelectorAll('#trail-sources img');
                                const count = Math.round(cssVar('--spawn-count', 1));

                                for (let i = 0; i < count; i++) {
                                    // First image at the exact position, extras offset randomly +/-30px
                                    const ox = i === 0 ? 0 : (Math.random() - 0.5) * 60;
                                    const oy = i === 0 ? 0 : (Math.random() - 0.5) * 60;

                                    const wrapper = document.createElement('div');
                                    wrapper.className = 'popup-wrapper';
                                    wrapper.style.left = `${x + ox}px`;
                                    wrapper.style.top = `${y + oy}px`;
                                    // Randomize size to 80%-120% of --base-size (consumed in CSS)
                                    wrapper.style.setProperty('--rand', 0.8 + Math.random() * 0.4);
                                    wrapper.appendChild(sources[Math.floor(Math.random() * sources.length)].cloneNode());
                                    wrapper.addEventListener('animationend', () => wrapper.remove(), { once: true });

                                    stage.appendChild(wrapper);
                                }
                            }
                        }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
