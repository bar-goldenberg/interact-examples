<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Gallery Grid with @wix/interact</title>
    <script type="module" src="https://esm.sh/@wix/interact@2.5.1/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --max-rotate-z: 15;
            --max-move: 40;
            --pointer-latency: 50ms;
            --pointer-direction: 1;
        }
        body {
            margin: 0;
            padding: 40px;
            background: #111;
            font-family: 'Inter', sans-serif;
            perspective: 1000px;
        }

        .grid-container {
            display: grid;
            gap: 40px;
            grid-template-columns: repeat(8, 1fr);
        }

        /* Use 'contents' to prevent wrappers from breaking the grid layout */
        interact-element {
            display: contents;
        }

        .card-component {
            position: relative;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .card-inner {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 32px;
            box-sizing: border-box;
            color: white;
            font-weight: 500;
            transform-style: preserve-3d;
        }

        .card-content {
            opacity: 0;
            transform: translateY(12px);
        }

        .card-content h3 {
            margin: 0 0 4px 0;
        }

        .card-content p {
            margin: 0;
        }

        /* Responsive Grid Layout */
        @media(max-width: 1200px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media(max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width: 750px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <interact-element data-interact-key="grid-wrapper">
        <div class="grid-container" id="grid-container">
            <!-- Cards will be dynamically inserted here by JavaScript -->
        </div>
    </interact-element>

    <script type="module">
        import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

        const container = document.getElementById('grid-container');
        const numCards = 32;
        let columns = 8;

        // Create HTML for cards dynamically
        function createCards() {
            let cardsHtml = '';
            for (let i = 0; i < numCards; i++) {
                cardsHtml += `
                    <interact-element data-interact-key="card-${i}">
                      <div class="card-component">
                        <interact-element data-interact-key="card-inner-${i}">
                            <div class="card-inner" style="background-image: linear-gradient(180deg, #0003, #000c), url('https://picsum.photos/seed/card${i + 1}/600/400')">
                                <interact-element data-interact-key="card-content-${i}">
                                    <div class="card-content">
                                        <h3>Card ${i + 1}</h3>
                                        <p>Demo text</p>
                                    </div>
                                </interact-element>
                            </div>
                        </interact-element>
                      </div>
                    </interact-element>
                `;
            }
            container.innerHTML = cardsHtml;
        }

        // Dynamically resolve the number of columns based on window width
        function currentColumns() {
            if (window.innerWidth < 750) return 2;
            if (window.innerWidth < 900) return 3;
            if (window.innerWidth < 1200) return 4;
            return 8;
        }

        // Helper to calculate card's position factor relative to the grid center
        function getPositionFactor(index, cols) {
            const numRows = Math.ceil(numCards / cols);
            const row = Math.floor(index / cols);
            const col = index % cols;
            const centerCol = (cols - 1) / 2;
            const centerRow = (numRows - 1) / 2;

            const offsetX = centerCol !== 0 ? (col - centerCol) / centerCol : 0;
            const offsetY = centerRow !== 0 ? (row - centerRow) / centerRow : 0;

            const factor = Math.min(1, Math.sqrt(offsetX * offsetX + offsetY * offsetY));
            return { factor, offsetX, offsetY };
        }

        // Build a length expression driven by the CSS custom properties, so the
        // amplitude stays live-tunable exactly like the old computed-style read.
        const moveExpr = (coef) =>
            `calc(var(--max-move) * var(--pointer-direction) * ${coef.toFixed(4)} * 1px)`;
        const rotateExpr = (coef) =>
            `calc(var(--max-rotate-z) * var(--pointer-direction) * ${coef.toFixed(4)} * 1deg)`;

        function buildConfig(cols) {
            const interactions = [];
            const xEffects = [];
            const yEffects = [];

            for (let i = 0; i < numCards; i++) {
                // Hover reveal — play-mode now lives on the effect as `triggerType`
                interactions.push({
                    key: `card-${i}`,
                    trigger: 'hover',
                    effects: [{
                        key: `card-content-${i}`,
                        effectId: 'content-reveal',
                        triggerType: 'alternate'
                    }]
                });

                const { factor, offsetX, offsetY } = getPositionFactor(i, cols);

                // Horizontal pointer travel -> translateX + rotateZ
                const kx = factor * -offsetX;
                const kz = factor * -Math.sign(offsetX || 1);

                xEffects.push({
                    key: `card-inner-${i}`,
                    keyframeEffect: {
                        name: `card-pointer-x-${i}`,
                        keyframes: [
                            { transform: `translateX(${moveExpr(-kx)}) rotateZ(${rotateExpr(-kz)})` },
                            { transform: `translateX(${moveExpr(kx)}) rotateZ(${rotateExpr(kz)})` }
                        ]
                    },
                    fill: 'both',
                    composite: 'add',
                    transitionDuration: 50,
                    transitionEasing: 'ease-out'
                });

                // Vertical pointer travel -> translateY
                const ky = factor * -offsetY;

                yEffects.push({
                    key: `card-inner-${i}`,
                    keyframeEffect: {
                        name: `card-pointer-y-${i}`,
                        keyframes: [
                            { transform: `translateY(${moveExpr(-ky)})` },
                            { transform: `translateY(${moveExpr(ky)})` }
                        ]
                    },
                    fill: 'both',
                    composite: 'add',
                    transitionDuration: 50,
                    transitionEasing: 'ease-out'
                });
            }

            // Two pointerMove interactions, one per axis, composited additively
            interactions.push({
                key: 'grid-wrapper',
                trigger: 'pointerMove',
                params: { hitArea: 'self', axis: 'x' },
                effects: xEffects
            });

            interactions.push({
                key: 'grid-wrapper',
                trigger: 'pointerMove',
                params: { hitArea: 'self', axis: 'y' },
                effects: yEffects
            });

            return {
                effects: {
                    'content-reveal': {
                        keyframeEffect: {
                            name: 'content-reveal-anim',
                            keyframes: [
                                { opacity: 0, transform: 'translateY(12px)' },
                                { opacity: 1, transform: 'translateY(0px)' }
                            ]
                        },
                        duration: 300,
                        easing: 'ease-out',
                        fill: 'both'
                    }
                },
                interactions
            };
        }

        createCards();
        columns = currentColumns();
        Interact.create(buildConfig(columns));

        // Column count changes the per-card geometry, so rebuild the whole config once settled
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const cols = currentColumns();
                if (cols === columns) return;
                columns = cols;
                Interact.create(buildConfig(columns));
            }, 200);
        });
    </script>
</body>

</html>
