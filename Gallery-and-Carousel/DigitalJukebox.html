<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll-Driven 3D Totem with @wix/interact</title>
    <style>
        /* --- CSS Custom Properties for Explorer Sliders --- */
        :root {
            --item-width: 800px;
            --item-height: 512px;
            --item-radius: 12px;
            --item-gap: 32px;
        }

        /* --- Basic Setup and Resets --- */
        body {
            margin: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: clip; /* Prevent the main body from scrolling (clip keeps ViewTimeline intact) */
        }

        /* --- Main Screen Container --- */
        .screen {
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* --- Scrollable 3D Viewport --- */
        .scroll-view {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            position: relative;
            /* Modern CSS for snap-scrolling */
            scroll-snap-type: y proximity;
        }

        /* --- Cross-Browser Scrollbar Hiding --- */
        .scroll-view::-webkit-scrollbar {
            display: none; /* For Chrome, Safari and Opera */
        }
        .scroll-view {
            -ms-overflow-style: none;  /* For IE and Edge */
            scrollbar-width: none;  /* For Firefox */
        }

        /* --- List that contains the 3D items --- */
        .item-list {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d; /* Enables 3D positioning for child elements */
            /* Padding allows the first and last items to be centered.
               Uses CSS var so explorer sliders can change height and keep snap working. */
            padding: calc(50vh - var(--item-height) / 2) 0;
        }

        /* --- Individual Card Styling --- */
        .list-item {
            position: relative;
            width: var(--item-width);
            max-width: 90vw; /* Ensure it fits on smaller screens */
            height: var(--item-height);
            background-color: #f0f0f0;
            border-radius: var(--item-radius);
            background-size: cover;
            background-position: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            margin: 0 auto var(--item-gap); /* Vertically space out items */
            /* Snap alignment for each item */
            scroll-snap-align: center;
        }

        /* --- Per-item caption (replaces the JS-driven info panel text) --- */
        .item-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 60px 20px 24px;
            text-align: center;
            color: #ffffff;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0));
            border-radius: 0 0 var(--item-radius) var(--item-radius);
            pointer-events: none;
            opacity: 0;
        }

        .item-caption h2 {
            margin: 0 0 6px 0;
            font-size: 32px;
            font-weight: 600;
        }

        .item-caption p {
            margin: 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.75);
        }

        /* --- Decorative fade at the Bottom of the screen --- */
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, rgba(255, 255, 255, 1) 50%, rgba(255, 255, 255, 0));
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="screen">
        <div class="scroll-view" id="scroll-view">
            <div class="item-list" id="item-list">
                <!-- Items are statically rendered -->
                <interact-element data-interact-key="item-0">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_5a41dd4ed9284d6dacf0d2ec84697472~mv2.jpg)">
                        <div class="item-caption"><h2>Teebs</h2><p>The Tropics</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-1">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_fcb77553ba6842bc80afe7b8cae070a6~mv2.jpg)">
                        <div class="item-caption"><h2>Astrid Sonne</h2><p>Boost</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-2">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_46273f3267014f7c800436bbc8b3ad83~mv2.jpg)">
                        <div class="item-caption"><h2>ML Buch</h2><p>Boarding</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-3">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_ff88830ded7e417cae47c905e83d7722~mv2.jpg)">
                        <div class="item-caption"><h2>Burial</h2><p>Archangel</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-4">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_e6d98be6268347e48cff39f5c20fb0f8~mv2.jpg)">
                        <div class="item-caption"><h2>Aphex Twin</h2><p>Avril 14th</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-5">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_55aad4d241374a2b827d4b00554b24ae~mv2.jpg)">
                        <div class="item-caption"><h2>Four Tet</h2><p>Two Thousand and Seventeen</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-6">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_f4bbbb8da30b4951b24924aad5dbfed2~mv2.jpg)">
                        <div class="item-caption"><h2>Bonobo</h2><p>Cirrus</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-7">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_099bae5648814dce8bb05379af044ecc~mv2.jpg)">
                        <div class="item-caption"><h2>Tycho</h2><p>Awake</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-8">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_6b14cf5bce1044db9a807dd3c5cc9028~mv2.jpg)">
                        <div class="item-caption"><h2>Floating Points</h2><p>Nespole</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-9">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_565eb438708548da92653669027017a8~mv2.webp)">
                        <div class="item-caption"><h2>Caribou</h2><p>Odessa</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-10">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_cb4b664a75934f89ac680625002ab076~mv2.jpg)">
                        <div class="item-caption"><h2>Jon Hopkins</h2><p>Emerald Rush</p></div>
                    </div>
                </interact-element>
                <interact-element data-interact-key="item-11">
                    <div class="list-item" style="background-image: url(https://static.wixstatic.com/media/9eca39_76de18515def47789ddab891e3ce12fa~mv2.jpg)">
                        <div class="item-caption"><h2>Boards of Canada</h2><p>Roygbiv</p></div>
                    </div>
                </interact-element>
            </div>
        </div>

        <div class="info-panel"></div>
    </div>

    <!-- Import @wix/interact -->
    <script type="module">
        import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

        const TOTAL_ITEMS = 12;

        // Card travels from a distant, tilted-back state to a centered, flat state and back.
        const scroll3DEffect = {
            name: 'scroll-3d-transform',
            keyframes: [
                { offset: 0,   opacity: 0.2, transform: 'perspective(500px) rotateX(25deg) translateZ(-350px)' },
                { offset: 0.5, opacity: 1,   transform: 'perspective(500px) rotateX(0deg) translateZ(0px)' },
                { offset: 1,   opacity: 0.2, transform: 'perspective(500px) rotateX(-25deg) translateZ(-350px)' }
            ]
        };

        // Caption reveals only while its card is near the center of the viewport.
        // This replaces the previous customEffect that rewrote a shared info panel.
        const captionEffect = {
            name: 'scroll-3d-caption',
            keyframes: [
                { offset: 0,    opacity: 0, transform: 'translateY(12px)' },
                { offset: 0.36, opacity: 0, transform: 'translateY(12px)' },
                { offset: 0.5,  opacity: 1, transform: 'translateY(0px)' },
                { offset: 0.64, opacity: 0, transform: 'translateY(12px)' },
                { offset: 1,    opacity: 0, transform: 'translateY(12px)' }
            ]
        };

        const coverRange = {
            rangeStart: { name: 'cover', offset: { value: 0, unit: 'percentage' } },
            rangeEnd: { name: 'cover', offset: { value: 100, unit: 'percentage' } }
        };

        const interactions = Array.from({ length: TOTAL_ITEMS }, (_, index) => ({
            key: `item-${index}`,
            trigger: 'viewProgress',
            effects: [
                {
                    keyframeEffect: scroll3DEffect,
                    easing: 'linear',
                    fill: 'both',
                    ...coverRange
                },
                {
                    selector: '.item-caption',
                    keyframeEffect: captionEffect,
                    easing: 'linear',
                    fill: 'both',
                    ...coverRange
                }
            ]
        }));

        Interact.create({ interactions });
    </script>
</body>
</html>
