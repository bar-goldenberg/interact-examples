<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Vertical Expanding Image Gallery with @wix/interact</title>
   <!-- Google Fonts (Inter) -->
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
   <!-- Tailwind CSS -->
   <script src="https://cdn.tailwindcss.com"></script>
   <style>
       :root {
           --panel-default-height: 20vh;
           --panel-open-height: 50vh;
           --panel-speed: 1;
           --panel-gap: 1.5rem;
       }

       /* Basic body setup */
       body {
           font-family: 'Inter', sans-serif;
           background-color: #ffffff;
           /* Added for smoother scrolling experience */
           overscroll-behavior-y: contain;
           min-height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
       }


       /* Vertical container for rows */
       .feature-container {
           display: flex;
           flex-direction: column;
           gap: var(--panel-gap, 1.5rem);
           width: 100%;
           margin: 0 auto;
       }

       /* The interact wrappers must not break the flex column layout */
       .feature-container > interact-element {
           display: block;
           width: 100%;
       }


       /* Each row styling */
       .feature-column {
           width: 100%;
           /* Use max-height for animation instead of height */
           max-height: var(--panel-default-height, 20vh); /* Default height for desktop */
           overflow: clip;
           position: relative; /* Required for z-index stacking */
           z-index: 1; /* Default stacking context */
           cursor: pointer;
           box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
           border-radius: 1rem;
           outline-offset: 4px;
       }


       /* Image styling */
       .feature-column .feature-image {
           width: 100%;
           height: 100%;
           object-fit: cover;
           pointer-events: none;
       }


       /* Text group - initial state for animation */
       .feature-text-group {
           position: absolute;
           bottom: 1.25rem;
           left: 1.25rem;
           opacity: 0;
           transform: translateY(20px);
           z-index: 10;
           text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.6);
           line-height: 1.2;
           /* Prevents text from being selected during interaction */
           user-select: none;
           /* FIX: Prevents this element from capturing mouse events, stopping the hover glitch */
           pointer-events: none;
       }


       /* Subtitle styling */
       .feature-bottom-subtitle {
           font-size: 0.875rem;
           font-weight: 400;
           color: rgba(255, 255, 255, 0.9);
           white-space: nowrap;
       }


       /* Title styling */
       .feature-bottom-title {
           font-size: 1.875rem;
           font-weight: 700;
           color: white;
           white-space: nowrap;
       }

       /* Media query for mobile responsiveness */
       @media (max-width: 768px) {
           :root {
               --panel-default-height: 25vh;
               --panel-open-height: 45vh;
           }

           .feature-column {
               max-height: var(--panel-default-height, 25vh); /* Initial height for mobile */
           }

           .feature-bottom-title {
               font-size: 1.5rem; /* Slightly smaller title on mobile */
           }

           .feature-bottom-subtitle {
               font-size: 0.8rem; /* Slightly smaller subtitle on mobile */
           }
       }
   </style>
</head>
<body class="p-6">


   <div class="w-full mx-auto">
       <div id="feature-container" class="feature-container">
           <interact-element data-interact-key="col-1">
               <div id="column-1" class="feature-column" tabindex="0">
                   <interact-element data-interact-key="txt-1">
                       <div id="text-1" class="feature-text-group">
                           <p class="feature-bottom-subtitle">Italian Alps</p>
                           <h2 class="feature-bottom-title">Serene Lakes</h2>
                       </div>
                   </interact-element>
                   <img src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?q=80&w=1974&auto=format=fit=crop"
                        onerror="this.onerror=null;this.src='https://placehold.co/1200x800/cccccc/ffffff?text=Image+Not+Found';"
                        alt="A serene lake with mountains in the background" class="feature-image">
               </div>
           </interact-element>

           <interact-element data-interact-key="col-2">
               <div id="column-2" class="feature-column" tabindex="0">
                   <interact-element data-interact-key="txt-2">
                       <div id="text-2" class="feature-text-group">
                           <p class="feature-bottom-subtitle">Arid Climate</p>
                           <h2 class="feature-bottom-title">Vast Deserts</h2>
                       </div>
                   </interact-element>
                   <img src="https://images.unsplash.com/photo-1488197047962-b48492212cda?q=80&w=2070&auto=format=fit=crop"
                        onerror="this.onerror=null;this.src='https://placehold.co/1200x800/cccccc/ffffff?text=Image+Not+Found';"
                        alt="Sand dunes in a vast desert under a clear sky" class="feature-image">
               </div>
           </interact-element>

           <interact-element data-interact-key="col-3">
               <div id="column-3" class="feature-column" tabindex="0">
                   <interact-element data-interact-key="txt-3">
                       <div id="text-3" class="feature-text-group">
                           <p class="feature-bottom-subtitle">Tropical Paradise</p>
                           <h2 class="feature-bottom-title">Lush Rainforests</h2>
                       </div>
                   </interact-element>
                   <img src="https://images.unsplash.com/photo-1425913397330-cf8af2ff40a1?q=80&w=1974&auto=format=fit=crop"
                        onerror="this.onerror=null;this.src='https://placehold.co/1200x800/cccccc/ffffff?text=Image+Not+Found';"
                        alt="A dense rainforest with sunlight filtering through the canopy" class="feature-image">
               </div>
           </interact-element>

           <interact-element data-interact-key="col-4">
               <div id="column-4" class="feature-column" tabindex="0">
                   <interact-element data-interact-key="txt-4">
                       <div id="text-4" class="feature-text-group">
                           <p class="feature-bottom-subtitle">Coastal Views</p>
                           <h2 class="feature-bottom-title">Ocean Cliffs</h2>
                       </div>
                   </interact-element>
                   <img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1974&auto=format=fit=crop"
                        onerror="this.onerror=null;this.src='https://placehold.co/1200x800/cccccc/ffffff?text=Image+Not+Found';"
                        alt="Dramatic ocean cliffs with waves crashing below" class="feature-image">
               </div>
           </interact-element>
       </div>
   </div>


   <script type="module">
       // Pure @wix/interact — no hand-written listeners, observers or animation loops.
       import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

       const EXPAND_EASE = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';

       // State effects declare their play-mode via `stateAction` on the effect.
       // Values read straight from CSS custom properties, so live tweaks to
       // --panel-*-height apply without any JS.
       const effects = {
           'v-expand': {
               stateAction: 'toggle',
               transitionProperties: [
                   {
                       name: 'max-height',
                       value: 'var(--panel-open-height, 50vh)',
                       duration: 500,
                       easing: EXPAND_EASE
                   },
                   {
                       name: 'box-shadow',
                       value: '0 18px 50px rgba(0, 0, 0, 0.28)',
                       duration: 500,
                       easing: EXPAND_EASE
                   },
                   { name: 'z-index', value: '10', duration: 0 }
               ]
           },
           // Caption rises into place slightly after the panel starts opening.
           'reveal': {
               stateAction: 'toggle',
               transitionProperties: [
                   { name: 'opacity', value: '1', duration: 400, delay: 200, easing: 'ease-out' },
                   {
                       name: 'transform',
                       value: 'translateY(0)',
                       duration: 400,
                       delay: 200,
                       easing: EXPAND_EASE
                   }
               ]
           }
       };

       const interactions = [];

       for (let i = 1; i <= 4; i++) {
           // 'interest' = hover + keyboard focus, so the tabindex on each card works too.
           // hover/click-family triggers take no params — playback lives on the effect.
           interactions.push({
               key: `col-${i}`,
               trigger: 'interest',
               effects: [
                   { key: `col-${i}`, effectId: 'v-expand' },
                   { key: `txt-${i}`, effectId: 'reveal' }
               ]
           });
       }

       Interact.create({ effects, interactions });
   </script>
</body>
</html>
