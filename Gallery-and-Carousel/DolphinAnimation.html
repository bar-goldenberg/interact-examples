<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Burst Animation</title>
    <style>
        :root {
            --particle-lifespan: 80;
            --base-particle-width: 180;
            --size-variation: 0.2;
            --particle-spacing: 100;
            --hop-height: 100;
            --hop-width: 40;
            --density: 1;
            --particle-radius: 0;
        }

        /* Basic styling for the page */
        body {
            margin: 0;
            padding: 0;
            overflow: clip; /* Hide scrollbars */
            background-color: #f0f0f0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            cursor: crosshair; /* Change cursor for better visibility */
        }

        /* This wrapper is the interact trigger; it must fill the viewport */
        interact-element[data-interact-key="page-container"] {
            display: block;
            width: 100%;
            height: 100%;
        }

        #page-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Styling for the info text */
        .info-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 1.5rem;
            text-align: center;
            pointer-events: none; /* Make sure text doesn't interfere with mouse events */
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        /* Hidden once the cursor has moved (data attribute set on first pointer tick) */
        body[data-moved] .info-text {
            opacity: 0;
        }

        /* The source images live in the markup (hidden) so they are pre-loaded and
           their intrinsic aspect ratio is known the moment a particle is created. */
        #particle-sources { display: none; }

        /* This is the MASK container for the particle.
           Size comes from the CSS variables plus the per-particle --rand / --ratio. */
        .particle {
            position: absolute;
            width: calc(var(--base-particle-width) * var(--rand, 1) * 1px);
            aspect-ratio: var(--ratio, 0.6154);
            will-change: transform;
            pointer-events: none;
            overflow: clip; /* This is the crucial property that creates the mask effect */
            border-radius: calc(var(--particle-radius, 0) * 1px);
            /* The transform origin is adjusted to be the bottom center for a more natural pop-up effect */
            transform-origin: bottom center;
            /* --particle-lifespan is expressed in frames (60fps), as in the original */
            animation: particle-hop calc(var(--particle-lifespan) * 1s / 60) linear both;
        }

        /* This is the actual image element that moves inside the mask */
        .particle-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: calc(var(--particle-radius, 0) * 1px);
            will-change: transform;
            animation: particle-reveal calc(var(--particle-lifespan) * 1s / 60) linear both;
        }

        /*
         * The hop arc: the original loop drove this per frame with
         * easeOutCubic(sin(lifeProgress * PI)) — sampled here as keyframes so the
         * whole motion runs on the compositor with no JS loop.
         * X drifts linearly by --hop-w, Y follows the arc scaled by --hop-height,
         * and the shadow alpha tracks 0.15 * arc^2.
         */
        @keyframes particle-hop {
            0% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.00px), calc(var(--hop-height) * -0.0px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.0); }
            5% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.05px), calc(var(--hop-height) * -0.3997px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.024); }
            10% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.10px), calc(var(--hop-height) * -0.6701px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.067); }
            15% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.15px), calc(var(--hop-height) * -0.8372px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.105); }
            20% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.20px), calc(var(--hop-height) * -0.93px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.13); }
            25% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.25px), calc(var(--hop-height) * -0.9749px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.143); }
            30% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.30px), calc(var(--hop-height) * -0.993px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.148); }
            40% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.40px), calc(var(--hop-height) * -0.9999px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
            50% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.50px), calc(var(--hop-height) * -1.0px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
            60% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.60px), calc(var(--hop-height) * -0.9999px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
            70% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.70px), calc(var(--hop-height) * -0.993px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.148); }
            75% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.75px), calc(var(--hop-height) * -0.9749px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.143); }
            80% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.80px), calc(var(--hop-height) * -0.93px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.13); }
            85% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.85px), calc(var(--hop-height) * -0.8372px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.105); }
            90% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.90px), calc(var(--hop-height) * -0.6701px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.067); }
            95% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 0.95px), calc(var(--hop-height) * -0.3997px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.024); }
            100% { transform: translate(-50%, -100%) translate(calc(var(--hop-w, 0) * 1.00px), calc(var(--hop-height) * -0.0px)) rotate(var(--angle, 0deg)); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.0); }
        }

        /* The image slides up inside its mask as the particle rises (1 - arc) */
        @keyframes particle-reveal {
            0% { transform: translateY(100.0%); }
            5% { transform: translateY(60.03%); }
            10% { transform: translateY(32.99%); }
            15% { transform: translateY(16.28%); }
            20% { transform: translateY(7.0%); }
            25% { transform: translateY(2.51%); }
            30% { transform: translateY(0.7%); }
            40% { transform: translateY(0.01%); }
            50% { transform: translateY(0.0%); }
            60% { transform: translateY(0.01%); }
            70% { transform: translateY(0.7%); }
            75% { transform: translateY(2.51%); }
            80% { transform: translateY(7.0%); }
            85% { transform: translateY(16.28%); }
            90% { transform: translateY(32.99%); }
            95% { transform: translateY(60.03%); }
            100% { transform: translateY(100.0%); }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!--
      This interact-element wraps the whole page and is the pointerMove source.
    -->
    <interact-element data-interact-key="page-container">
        <div id="page-container">
            <div class="info-text" id="infoText">Move your cursor to start the animation.</div>
        </div>
    </interact-element>

    <!-- Image pool: declarative source list, pre-loaded and sampled on spawn -->
    <div id="particle-sources" aria-hidden="true">

    </div>

    <script type="module">
        import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';
        import { CustomMouse } from 'https://esm.sh/@wix/motion-presets';

        // pointerMove + customEffect is driven by the CustomMouse preset
        Interact.registerEffects({ CustomMouse });

        // Read a CSS custom property as a number (explorer sliders drive these)
        const cssVar = (name, fallback) => {
            const n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
            return Number.isFinite(n) ? n : fallback;
        };

        // Pointer position of the last spawn
        let last = null;

        Interact.create({
            interactions: [
                {
                    // Particles are spawned along the cursor's path; each one's hop,
                    // reveal and shadow are pure CSS from here on.
                    key: 'page-container',
                    trigger: 'pointerMove',
                    params: { hitArea: 'root' },
                    effects: [
                        {
                            fill: 'both',
                            customEffect: (element, progress) => {
                                if (progress.active === false) return;

                                const stage = element.querySelector('#page-container') || element;
                                const sources = document.querySelectorAll('#particle-sources img');
                                const x = progress.x * window.innerWidth;
                                const y = progress.y * window.innerHeight;

                                // On the first move, just sync the position and hide the hint
                                if (!last) {
                                    last = { x, y };
                                    document.body.dataset.moved = '';
                                    return;
                                }

                                const spacing = Math.max(5, cssVar('--particle-spacing', 100))
                                    / Math.max(0.1, cssVar('--density', 1));
                                const dx = x - last.x;
                                const dy = y - last.y;
                                const distance = Math.hypot(dx, dy);
                                if (distance < spacing) return;

                                // Lay particles evenly along the path travelled since the last spawn
                                const count = Math.floor(distance / spacing);
                                const angle = Math.atan2(dy, dx);
                                const variation = Math.max(0, cssVar('--size-variation', 0.2));

                                for (let i = 1; i <= count; i++) {
                                    const img = sources[Math.floor(Math.random() * sources.length)];
                                    const direction = (Math.random() - 0.5) * 2;

                                    const particle = document.createElement('div');
                                    particle.className = 'particle';
                                    particle.style.left = `${last.x + Math.cos(angle) * spacing * i}px`;
                                    particle.style.top = `${last.y + Math.sin(angle) * spacing * i}px`;
                                    // Per-particle values consumed by the CSS keyframes
                                    particle.style.setProperty('--rand', (Math.random() - 0.5) * variation + 1);
                                    particle.style.setProperty('--ratio', img.naturalWidth / img.naturalHeight || 0.6154);
                                    particle.style.setProperty('--hop-w', cssVar('--hop-width', 40) * direction);
                                    particle.style.setProperty('--angle', `${direction * 10}deg`);

                                    const inner = document.createElement('div');
                                    inner.className = 'particle-image';
                                    inner.style.backgroundImage = `url(${img.src})`;
                                    particle.appendChild(inner);

                                    particle.addEventListener('animationend', () => particle.remove(), { once: true });
                                    stage.appendChild(particle);
                                }

                                last = {
                                    x: last.x + Math.cos(angle) * spacing * count,
                                    y: last.y + Math.sin(angle) * spacing * count
                                };
                            }
                        }
                    ]
                }
            ]
        });
    </script>
</body>
</html>
