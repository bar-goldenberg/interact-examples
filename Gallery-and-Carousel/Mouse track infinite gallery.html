<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidy Gallery with @wix/interact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Kept in sync with the engine by the bootstrap customEffect */
            --item-size: 40vh;
        }

        body {
            margin: 0;
            overflow: clip; /* Prevent native scroll */
            background-color: #ffffff;
            color: black;
            font-family: 'Helvetica Neue', sans-serif;
            user-select: none;
        }

        /* The keyed interact root must not disturb layout */
        interact-element { display: contents; }

        /* The window we look through */
        #gallery-viewport {
            width: 100vw;
            height: 100vh;
            overflow: clip;
            position: relative;
        }

        /* Container - No longer a grid, just a coordinate space */
        #gallery-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Item container - Absolute for free positioning */
        .gallery-item {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: var(--item-size);
            will-change: translate; /* Critical for performance */
        }

        /* Image styling */
        .img-wrapper {
            width: 100%;
            height: var(--item-size);
            border-radius: 4px;
            overflow: clip;
            background: #1a1a1a;
            position: relative;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.2);
        }

        .parallax-layer {
            width: 100%;
            height: 100%;
            will-change: translate;
            scale: 3;
            transform-origin: center;
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform-origin: center;
        }

        /* Text styling */
        .text-wrapper {
            position: absolute;
            top: 100%;
            padding-top: 5px;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        .gallery-text {
            font-size: 14px;
            font-weight: 500;
            color: #111111;
            letter-spacing: 0.5px;
            transform-origin: top left;
            display: inline-block;
            white-space: nowrap;
        }

        /* Responsive styles for mobile */
        @media (max-width: 768px) {
            .gallery-text {
                font-size: 12px;
            }
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading">Initializing Gallery...</div>

<!-- One keyed wrapper drives everything: the bootstrap/engine effect, the
     pointer feed, and the per-item hover fan-out. -->
<interact-element data-interact-key="gallery">
    <div id="gallery-viewport">
        <div id="gallery-content">
            <!-- Items built by the bootstrap customEffect -->
        </div>
    </div>
</interact-element>

<script type="module">
    import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';
    import { CustomMouse } from 'https://esm.sh/@wix/motion-presets';

    // pointerMove + customEffect is driven by the CustomMouse preset
    Interact.registerEffects({ CustomMouse });

    // The only module-scope state: the handful of numbers the pointer effect
    // writes and the engine effect reads. All behaviour lives in the effects.
    const input = {
        x: window.innerWidth / 2,   // pointer position
        y: window.innerHeight / 2,
        active: false
    };

    const HOVER_BLUR = 8;

    Interact.create({
        interactions: [
            {
                // ── Bootstrap + per-frame engine ───────────────────────────
                // An infinite time effect makes interact itself the ticker, so
                // there is no requestAnimationFrame loop in this file. The whole
                // engine lives in this effect's closure.
                key: 'gallery',
                trigger: 'viewEnter',
                effects: [
                    {
                        triggerType: 'once',
                        duration: 1000,
                        iterations: Infinity,
                        easing: 'linear',
                        fill: 'both',
                        customEffect: (() => {
                            const TOTAL_ITEMS = 40;
                            const GRID_COLS = 8;
                            const GRID_ROWS = 5;
                            const MAX_SPEED = 6;        // Max px per frame
                            const VELOCITY_LERP = 0.03; // Momentum
                            const PARALLAX_FACTOR = 0.08;

                            const TITLES = [
                                'NEON VOID', 'URBAN ECHO', 'SILENT FORM', 'LIQUID TIME', 'GLASS SOUL',
                                'CONCRETE SKY', 'VELVET HAZE', 'IRON PULSE', 'SOLAR DRIFT', 'LUNAR EDGE',
                                'PRISM CORE', 'STATIC FLOW', 'ECHO CHAMBER', 'NIGHT BLOOM', 'WHITE NOISE',
                                'SHADOW PLAY', 'METAL HEART', 'OCEAN DUST', 'WINTER SUN', 'DESERT ICE',
                                'CYBER MIST', 'RAPID EYE', 'ZERO GRAVITY', 'BLIND SPOT', 'DEEP FOCUS',
                                'RAW MATTER', 'PURE LOGIC', 'LOST SIGNAL', 'DARK MATTER', 'LIGHT WAVE',
                                'AUTO PILOT', 'BLUE STEEL', 'RED SHIFT', 'GREEN ZONE', 'GOLD RUSH',
                                'SILVER LINE', 'COPPER TONE', 'CHROME LIFE', 'CARBON COPY', 'FINAL CUT'
                            ];

                            const layout = { itemSize: 0, colPitch: 0, rowPitch: 0, worldWidth: 0, worldHeight: 0 };
                            const camera = { x: 0, y: 0 };
                            const velocity = { x: 0.1, y: 0.1 };
                            let items = [];
                            let started = false;

                            // Continuous responsive sizing: 400px wide -> 20vh,
                            // 1400px wide -> 40vh, clamped either side.
                            const measure = () => {
                                const factor = Math.min(0.4, Math.max(0.2, 0.0002 * window.innerWidth + 0.12));
                                layout.itemSize = window.innerHeight * factor;
                                const gap = layout.itemSize * 0.6375;
                                document.documentElement.style.setProperty('--item-size', `${layout.itemSize}px`);
                                layout.colPitch = layout.itemSize + gap;
                                layout.rowPitch = layout.itemSize + layout.itemSize * 0.25 + gap;
                                layout.worldWidth = GRID_COLS * layout.colPitch;
                                layout.worldHeight = GRID_ROWS * layout.rowPitch;
                                items.forEach((item, i) => {
                                    item.baseX = (i % GRID_COLS) * layout.colPitch;
                                    item.baseY = Math.floor(i / GRID_COLS) * layout.rowPitch;
                                });
                            };

                            const build = () => {
                                const container = document.getElementById('gallery-content');
                                for (let i = 0; i < TOTAL_ITEMS; i++) {
                                    const el = document.createElement('div');
                                    el.className = 'gallery-item cursor-pointer';
                                    el.innerHTML = `
                                        <div class="img-wrapper">
                                            <div class="parallax-layer">
                                                <img src="https://picsum.photos/seed/${i + 88}/1200/1500"
                                                     class="gallery-img" alt="Gallery item ${i}" loading="lazy" />
                                            </div>
                                        </div>
                                        <div class="text-wrapper">
                                            <div class="gallery-text">${TITLES[i % TITLES.length]}</div>
                                        </div>
                                    `;
                                    container.appendChild(el);
                                    items.push({ el, parallax: el.querySelector('.parallax-layer'), baseX: 0, baseY: 0 });
                                }
                                document.getElementById('loading').style.display = 'none';
                            };

                            // Re-measures the world when the viewport changes.
                            // No trigger reports a resize, so this one listener
                            // stays — registered here, inside the effect.
                            const wireResize = () => {
                                window.addEventListener('resize', () => {
                                    measure();
                                    input.x = window.innerWidth / 2;
                                    input.y = window.innerHeight / 2;
                                });
                            };

                            // One frame of the simulation.
                            return () => {
                                if (!started) {
                                    started = true;
                                    build();
                                    measure();
                                    wireResize();
                                }

                                const cx = window.innerWidth / 2;
                                const cy = window.innerHeight / 2;

                                // Pointer offset from centre sets a target velocity,
                                // the camera eases toward it and keeps its momentum
                                // when the pointer stops.
                                const targetVx = input.active ? -((input.x - cx) / cx) * MAX_SPEED : 0;
                                const targetVy = input.active ? -((input.y - cy) / cy) * MAX_SPEED : 0;
                                velocity.x += (targetVx - velocity.x) * VELOCITY_LERP;
                                velocity.y += (targetVy - velocity.y) * VELOCITY_LERP;
                                camera.x += velocity.x;
                                camera.y += velocity.y;

                                const offsetX = layout.itemSize / 2;
                                const offsetY = layout.itemSize / 2 + layout.itemSize * 0.125;

                                for (const item of items) {
                                    // Endless wrap around the world box
                                    let wx = (((item.baseX + camera.x) % layout.worldWidth) + layout.worldWidth) % layout.worldWidth;
                                    if (wx > layout.worldWidth / 2) wx -= layout.worldWidth;
                                    let wy = (((item.baseY + camera.y) % layout.worldHeight) + layout.worldHeight) % layout.worldHeight;
                                    if (wy > layout.worldHeight / 2) wy -= layout.worldHeight;

                                    item.el.style.translate = `${wx + cx - offsetX}px ${wy + cy - offsetY}px`;
                                    item.parallax.style.translate = `${wx * -PARALLAX_FACTOR}px ${wy * -PARALLAX_FACTOR}px`;
                                }
                            };
                        })()
                    }
                ]
            },
            {
                // ── Pointer feed ──────────────────────────────────────────
                // Replaces the mousemove/touchmove listeners: interact reports
                // the position and whether the pointer is still in the page.
                // Touch drives it too — a moving finger moves the camera.
                key: 'gallery',
                trigger: 'pointerMove',
                params: { hitArea: 'root' },
                effects: [
                    {
                        fill: 'both',
                        customEffect: (element, progress) => {
                            input.x = progress.x * window.innerWidth;
                            input.y = progress.y * window.innerHeight;
                            input.active = progress.active !== false;
                        }
                    }
                ]
            },
            {
                // ── Per-item hover ────────────────────────────────────────
                // listContainer makes each .gallery-item its own hover source;
                // 'alternate' reverses on leave.
                key: 'gallery',
                trigger: 'hover',
                listContainer: '#gallery-content',
                effects: [
                    {
                        selector: '.gallery-img',
                        triggerType: 'alternate',
                        duration: 600,
                        easing: 'ease-out',
                        fill: 'both',
                        keyframeEffect: {
                            name: 'img-defocus',
                            keyframes: [
                                { filter: 'blur(0px)', transform: 'scale(1)' },
                                { filter: `blur(${HOVER_BLUR}px)`, transform: 'scale(0.95)' }
                            ]
                        }
                    },
                    {
                        selector: '.gallery-text',
                        triggerType: 'alternate',
                        duration: 500,
                        easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
                        fill: 'both',
                        keyframeEffect: {
                            name: 'text-dim',
                            keyframes: [{ opacity: 1 }, { opacity: 0.4 }]
                        }
                    }
                ]
            }
        ]
    });
</script>

</body>
</html>
