<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive 3D Card Deck Scroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import @wix/interact library -->
    <script type="module" src="https://esm.sh/@wix/interact@2.5.1/web"></script>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #f3f4f6;
        }

        /* 1. Main scrollable area to drive the animation */
        .scroll-section {
            height: 1000vh; /* Provides scrollable space */
        }

        /* 2. Sticky container that acts as the "viewport" for our animation */
        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: clip; /* clip preserves ViewTimeline behavior */
            /* Perspective is moved to the .animation-viewport */
        }

        /* Flex container for desktop/mobile layouts */
        .animation-layout-container {
            display: flex;
            width: 100%;
            height: 100vh;
            /* Desktop default: text below animation */
            flex-direction: column;
        }

        /* Viewport for the 3D animation */
        .animation-viewport {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Takes up all space except text */
            perspective: 2000px; /* Shared 3D viewpoint for all card children */
        }

        /* Viewport for the text */
        .text-viewport {
            position: relative;
            width: 100%;
            /* Desktop height for bottom text */
            height: 20vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. The card element styles */
        .card {
            position: absolute;
            /* Desktop card size */
            width: 500px;
            height: 60vh;
            max-width: 70vw;
            top: 50%;
            left: 50%;
            border-radius: 1.5rem;
            overflow: clip;
            background: #1f2937;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            will-change: transform, opacity;
            /* Start all cards at the center */
            transform: translate(-50%, -50%);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 4. Title layers — one per card, each faded by its own keyframeEffect */
        .title-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            padding: 0 2rem;
            box-sizing: border-box;
            color: #000000;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Hidden until its scroll range is active */
        }

        .title-layer h2 {
            font-size: 2.25rem; /* 36px */
            line-height: 2.5rem; /* 40px */
            font-weight: 700;
        }
        .title-layer p {
            font-size: 1.25rem; /* 20px */
            line-height: 1.75rem; /* 28px */
            color: #000000;
        }

        /* 5. Responsive Media Query for Mobile */
        @media (max-width: 768px) {
            .animation-layout-container {
                /* Mobile: text next to animation */
                flex-direction: row;
            }

            .animation-viewport {
                /* Animation takes 60% of width */
                width: 60%;
                height: 100vh;
            }

            .text-viewport {
                /* Text takes 40% of width */
                width: 40%;
                height: 100vh;
                padding: 1rem;
                align-items: center; /* Vertically center text */
                justify-content: flex-start; /* Align content to the left */
            }

            .card {
                /* Mobile-friendly portrait card size */
                width: 250px;
                height: 350px;
                max-width: 90vw;
            }

            .title-layer {
                text-align: left; /* Left-align text on mobile */
                align-items: flex-start;
                padding: 1rem;
            }

            .title-layer h2 {
                font-size: 1.5rem;
                line-height: 1.75rem;
            }
            .title-layer p {
                font-size: 1rem;
                line-height: 1.25rem;
                margin-top: 0.5rem; /* Adds gap */
            }
        }

    </style>
</head>
<body>

    <div class="scroll-section">
        <!-- The sticky wrapper is the trigger for the viewProgress animation -->
        <interact-element data-interact-key=".sticky-wrapper">
            <div class="sticky-wrapper">

                <!-- Layout container -->
                <div class="animation-layout-container">

                    <!-- Viewport for cards -->
                    <div class="animation-viewport">
                        <!-- Card 1 -->
                        <interact-element data-interact-key="#card-1">
                            <div id="card-1" class="card">
                                <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2414" class="card-image" alt="Cosmic Landscape">
                            </div>
                        </interact-element>

                        <!-- Card 2 -->
                        <interact-element data-interact-key="#card-2">
                            <div id="card-2" class="card">
                                <img src="https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=2670" class="card-image" alt="Galaxy View">
                            </div>
                        </interact-element>

                        <!-- Card 3 -->
                        <interact-element data-interact-key="#card-3">
                            <div id="card-3" class="card">
                                <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=2672" class="card-image" alt="Earth from Space">
                            </div>
                        </interact-element>

                        <!-- Card 4 -->
                        <interact-element data-interact-key="#card-4">
                            <div id="card-4" class="card">
                                <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2414" class="card-image" alt="Nebula">
                            </div>
                        </interact-element>

                        <!-- Card 5 -->
                        <interact-element data-interact-key="#card-5">
                            <div id="card-5" class="card">
                                <img src="https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=2670" class="card-image" alt="Lunar Surface">
                            </div>
                        </interact-element>

                        <!-- Card 6 -->
                        <interact-element data-interact-key="#card-6">
                            <div id="card-6" class="card">
                                <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2414" class="card-image" alt="Aurora Borealis">
                            </div>
                        </interact-element>

                        <!-- Card 7 -->
                        <interact-element data-interact-key="#card-7">
                            <div id="card-7" class="card">
                                <img src="https://images.unsplash.com/photo-1454789548928-9efd52dc4031?q=80&w=2680" class="card-image" alt="Astronaut">
                            </div>
                        </interact-element>
                    </div> <!-- End .animation-viewport -->

                    <!-- Viewport for text: one static title layer per card -->
                    <div class="text-viewport">
                        <interact-element data-interact-key="#title-1">
                            <div id="title-1" class="title-layer">
                                <h2>Stellar Nurseries</h2>
                                <p>Where Stars Are Born</p>
                            </div>
                        </interact-element>

                        <interact-element data-interact-key="#title-2">
                            <div id="title-2" class="title-layer">
                                <h2>Galactic Wonders</h2>
                                <p>A Universe of Possibility</p>
                            </div>
                        </interact-element>

                        <interact-element data-interact-key="#title-3">
                            <div id="title-3" class="title-layer">
                                <h2>Our Blue Planet</h2>
                                <p>A fragile existence</p>
                            </div>
                        </interact-element>

                        <interact-element data-interact-key="#title-4">
                            <div id="title-4" class="title-layer">
                                <h2>Cosmic Clouds</h2>
                                <p>The Dust of Creation</p>
                            </div>
                        </interact-element>

                        <interact-element data-interact-key="#title-5">
                            <div id="title-5" class="title-layer">
                                <h2>The Silent Moon</h2>
                                <p>A Watcher in the Night</p>
                            </div>
                        </interact-element>

                        <interact-element data-interact-key="#title-6">
                            <div id="title-6" class="title-layer">
                                <h2>Celestial Dance</h2>
                                <p>The Northern Lights</p>
                            </div>
                        </interact-element>

                        <interact-element data-interact-key="#title-7">
                            <div id="title-7" class="title-layer">
                                <h2>Final Frontier</h2>
                                <p>The Journey Beyond</p>
                            </div>
                        </interact-element>
                    </div> <!-- End .text-viewport -->

                </div> <!-- End .animation-layout-container -->

            </div>
        </interact-element>
    </div>

    <script type="module">
        import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

        // --- Check for mobile viewport ---
        const isMobile = window.matchMedia("(max-width: 768px)").matches;

        const cardCount = 7;
        const effects = [];

        // --- Animation path for DESKTOP (Horizontal) ---
        const desktopAnimationKeyframes = [
            { offset: 0,   transform: 'translate(-50%, -50%) translateX(150%) translateZ(-900px) rotateY(-60deg) rotateX(15deg)', opacity: 0 },
            { offset: 0.3, transform: 'translate(-50%, -50%) translateX(60%) translateZ(-300px) rotateY(-30deg) rotateX(5deg)', opacity: 1 },
            { offset: 0.5, transform: 'translate(-50%, -50%) translateX(0) translateZ(0) rotateY(0deg) rotateX(0deg)', opacity: 1 },
            { offset: 0.7, transform: 'translate(-50%, -50%) translateX(-60%) translateZ(-300px) rotateY(30deg) rotateX(-5deg)', opacity: 1 },
            { offset: 1,   transform: 'translate(-50%, -50%) translateX(-150%) translateZ(-900px) rotateY(60deg) rotateX(-15deg)', opacity: 0 }
        ];

        // --- Animation path for MOBILE (Vertical) ---
        const mobileAnimationKeyframes = [
            { offset: 0,   transform: 'translate(-50%, -50%) translateY(150%) translateZ(-900px) rotateX(60deg)', opacity: 0 },
            { offset: 0.3, transform: 'translate(-50%, -50%) translateY(60%) translateZ(-300px) rotateX(30deg)', opacity: 1 },
            { offset: 0.5, transform: 'translate(-50%, -50%) translateY(0) translateZ(0) rotateX(0deg)', opacity: 1 },
            { offset: 0.7, transform: 'translate(-50%, -50%) translateY(-60%) translateZ(-300px) rotateX(-30deg)', opacity: 1 },
            { offset: 1,   transform: 'translate(-50%, -50%) translateY(-150%) translateZ(-900px) rotateX(-60deg)', opacity: 0 }
        ];

        // --- Select the correct keyframes based on viewport ---
        const animationKeyframes = isMobile ? mobileAnimationKeyframes : desktopAnimationKeyframes;

        // Title cross-fade keyframes: hidden -> visible at card center -> hidden
        const titleFadeKeyframes = [
            { offset: 0,   opacity: 0 },
            { offset: 0.5, opacity: 1 },
            { offset: 1,   opacity: 0 }
        ];

        const progressPerCard = 1 / (cardCount + 1);

        // Create a staggered scroll-driven animation for each card, plus its title
        for (let i = 1; i <= cardCount; i++) {
            const start = (i - 1) * progressPerCard;
            const duration = progressPerCard * 2; // Animations overlap
            const end = start + duration;

            // Card movement effect
            effects.push({
                key: `#card-${i}`,
                keyframeEffect: {
                    name: `card-move-${i}`,
                    // Use the responsively-selected keyframes
                    keyframes: animationKeyframes
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: start * 100 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: end * 100 } },
                easing: 'linear',
                fill: 'both'
            });

            // Matching title layer: tight fade window centered on the card's
            // center position (0.5 of its own animation range).
            const titleFadeStart = start + 0.4 * duration;
            const titleFadeEnd = start + 0.6 * duration;

            effects.push({
                key: `#title-${i}`,
                keyframeEffect: {
                    name: `title-fade-${i}`,
                    keyframes: titleFadeKeyframes
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: titleFadeStart * 100 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: titleFadeEnd * 100 } },
                easing: 'linear',
                fill: 'both'
            });
        }

        const config = {
            interactions: [{
                key: '.sticky-wrapper',
                trigger: 'viewProgress',
                effects: effects // All card and title effects
            }]
        };

        Interact.create(config);
    </script>

</body>
</html>
