<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Nebula Carousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #110f1a;
            color: #f0eefc;
            overflow: clip;
        }

        /* The keyed interact root must not disturb layout */
        interact-element { display: contents; }

        /* Click/cursor zones either side — these replace the JS that watched
           mousemove to swap the cursor and the JS that measured click zones. */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            border: 0;
            padding: 0;
            background: transparent;
            z-index: 0;
        }
        .nav-zone.prev { left: 0; cursor: w-resize; }
        .nav-zone.next { right: 0; cursor: e-resize; }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        .carousel-container {
            /* above the backdrop: .carousel's preserve-3d traps the flown-out
               card's z-index, so the whole container has to clear it */
            z-index: 1001;
            perspective: 1500px;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .carousel {
            position: relative;
            width: 300px;
            height: 500px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .card {
            position: absolute;
            width: 300px;
            height: 500px;
            background: #1a1a2e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 0;
            transition: transform 0.5s cubic-bezier(0.33, 1, 0.68, 1), filter 0.5s ease, box-shadow 0.5s ease, opacity 0.3s ease;
            cursor: pointer;
            user-select: none;
            border: 2px solid rgba(120, 120, 180, 0.4);
            will-change: transform, filter;
        }

        .card-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            padding: 2rem 1.25rem 1.5rem;
            color: white;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.3) 60%, transparent 100%);
            opacity: 0;
        }

        .card-artist {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .card-keywords {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.03em;
            opacity: 0.8;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .card.active {
            transform: translateX(0) translateZ(0) rotateY(0deg) scale(1);
            filter: brightness(1);
            z-index: 10;
            box-shadow: 0 12px 40px rgba(80, 80, 200, 0.25), 0 0 60px rgba(100, 100, 220, 0.1);
        }
        .card.left-1 { transform: translateX(-60%) translateZ(-200px) rotateY(35deg) scale(0.9); filter: brightness(0.75); z-index: 5; }
        .card.right-1 { transform: translateX(60%) translateZ(-200px) rotateY(-35deg) scale(0.9); filter: brightness(0.75); z-index: 5; }
        .card.left-2 { transform: translateX(-110%) translateZ(-400px) rotateY(45deg) scale(0.8); filter: brightness(0.55); z-index: 2; }
        .card.right-2 { transform: translateX(110%) translateZ(-400px) rotateY(-45deg) scale(0.8); filter: brightness(0.55); z-index: 2; }
        .card.left-3 { transform: translateX(-150%) translateZ(-600px) rotateY(55deg) scale(0.7); filter: brightness(0.35); z-index: 1; }
        .card.right-3 { transform: translateX(150%) translateZ(-600px) rotateY(-55deg) scale(0.7); filter: brightness(0.35); z-index: 1; }
        .card.hidden { transform: translateX(0) translateZ(-800px) scale(0.5); opacity: 0; z-index: 0; }

        .card.fly-out {
            position: fixed;
            top: 50%;
            left: 50%;
            /* The card's own transform transition drives the zoom */
            transform: translate(-50%, -50%) scale(1.35);
            z-index: 1001;
            cursor: default;
            filter: brightness(1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .card.fly-out .card-content {
            /* beats the hover keyframe effect while the card is enlarged */
            opacity: 1 !important;
        }

        /* While a card is enlarged the rest of the deck steps aside and the
           side zones stop swallowing the click that closes it. */
        body.card-open .card:not(.fly-out) { opacity: 0; }
        /* the container sits above the backdrop, so it must not swallow the
           click that dismisses the enlarged card */
        body.card-open .carousel-container { pointer-events: none; }
        body.card-open .card.fly-out { pointer-events: auto; }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(4px);
            transition: opacity 0.5s ease;
        }
        .backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- One keyed wrapper: listContainer turns every .card into its own hover
         source, so no per-card keys are needed. -->
    <interact-element data-interact-key="carousel">
        <div class="carousel-container" id="carousel-container">
            <button class="nav-zone prev" id="nav-prev" aria-label="Previous card"></button>
            <button class="nav-zone next" id="nav-next" aria-label="Next card"></button>
            <div class="carousel" id="carousel"></div>
        </div>
    </interact-element>
    <div class="backdrop" id="backdrop"></div>

    <script type="module">
        import { Interact } from 'https://esm.sh/@wix/interact@2.5.1/web';

        // The only module-scope state: where the deck is and whether it is busy.
        // Every line of behaviour lives inside the customEffect below.
        const deck = { index: 0, open: false, busy: false };

        Interact.create({
            interactions: [
                {
                    // ── Bootstrap ──────────────────────────────────────────
                    // Builds the deck and wires the few gestures no trigger can
                    // express. Runs once, when the carousel comes into view.
                    key: 'carousel',
                    trigger: 'viewEnter',
                    effects: [
                        {
                            triggerType: 'once',
                            duration: 1,
                            fill: 'both',
                            customEffect: (() => {
                                const FLY_OUT_DURATION = 500;
                                const STEP_DURATION = 150;

                                const cardData = [
                                    { artist: 'Orion Nebula',     keywords: 'Stellar Nursery • Cosmic Clouds • New Stars',   imageUrl: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Carina Nebula',    keywords: 'Cosmic Reef • Massive Stars • Destruction',     imageUrl: 'https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Eagle Nebula',     keywords: 'Creation • Destruction • Pillars of Gas',       imageUrl: 'https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Veil Nebula',      keywords: 'Supernova Remnant • Wisps • Ethereal',          imageUrl: 'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Rosette Nebula',   keywords: 'Stellar Cluster • Rose • Ionized Hydrogen',     imageUrl: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Horsehead Nebula', keywords: 'Dark Nebula • Cosmic Dust • Silhouette',        imageUrl: 'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Helix Nebula',     keywords: 'Planetary Nebula • Dying Star • The Eye',       imageUrl: 'https://images.unsplash.com/photo-1484950763426-56b5bf172dbb?w=600&h=1000&fit=crop&q=80' },
                                    { artist: 'Lagoon Nebula',    keywords: 'Emission Nebula • Star Formation • H II Region', imageUrl: 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=600&h=1000&fit=crop&q=80' }
                                ];

                                const POSITIONS = { 0: 'active', 1: 'right-1', '-1': 'left-1', 2: 'right-2', '-2': 'left-2', 3: 'right-3', '-3': 'left-3' };

                                const carousel = () => document.getElementById('carousel');
                                const backdrop = () => document.getElementById('backdrop');
                                let started = false;

                                const build = () => {
                                    cardData.forEach((data, index) => {
                                        const card = document.createElement('div');
                                        card.className = 'card';
                                        card.dataset.index = index;
                                        card.innerHTML = `
                                            <img src="${data.imageUrl}" alt="${data.artist}" class="card-image" draggable="false">
                                            <div class="card-content">
                                                <div class="card-artist font-cinzel">${data.artist}</div>
                                                <div class="card-keywords">${data.keywords}</div>
                                            </div>
                                        `;
                                        carousel().appendChild(card);
                                    });
                                };

                                // Position classes carry the 3D layout; the CSS
                                // transitions on .card animate every change.
                                const layout = () => {
                                    if (deck.open) return;
                                    document.querySelectorAll('.card').forEach((card, index) => {
                                        let diff = index - deck.index;
                                        if (Math.abs(diff) > cardData.length / 2) {
                                            diff = diff > 0 ? diff - cardData.length : diff + cardData.length;
                                        }
                                        card.className = 'card ' + (POSITIONS[diff] || 'hidden');
                                    });
                                };

                                // step() moves the deck; navigate() is the guarded
                                // entry point. The multi-step walk calls step()
                                // directly — navigate() would be blocked by the
                                // very busy flag it sets.
                                const step = (dir) => {
                                    deck.index = (deck.index + dir + cardData.length) % cardData.length;
                                    layout();
                                };
                                const navigate = (dir) => {
                                    if (deck.open || deck.busy) return;
                                    step(dir);
                                };

                                const openCard = (card) => {
                                    deck.open = true;
                                    card.classList.add('fly-out');
                                    backdrop().classList.add('visible');
                                    document.body.classList.add('card-open');
                                };

                                const close = () => {
                                    if (!deck.open) return;
                                    // Dropping the class lets the card's own transform
                                    // transition shrink it back into the deck.
                                    document.querySelector('.card.fly-out')?.classList.remove('fly-out');
                                    backdrop().classList.remove('visible');
                                    document.body.classList.remove('card-open');
                                    setTimeout(() => { deck.open = false; layout(); }, FLY_OUT_DURATION);
                                };

                                const pickCard = (card) => {
                                    if (deck.open || deck.busy) return;
                                    if (card.classList.contains('active')) { openCard(card); return; }

                                    let diff = +card.dataset.index - deck.index;
                                    if (Math.abs(diff) > cardData.length / 2) {
                                        diff = diff > 0 ? diff - cardData.length : diff + cardData.length;
                                    }
                                    const dir = diff > 0 ? 1 : -1;
                                    const steps = Math.abs(diff);
                                    deck.busy = true;
                                    for (let i = 0; i < steps; i++) setTimeout(() => step(dir), i * STEP_DURATION);
                                    setTimeout(() => { deck.busy = false; }, steps * STEP_DURATION);
                                };

                                // Event plumbing. A customEffect is a per-frame
                                // animation callback, not an event hook, so the
                                // one-shot inputs below stay as listeners —
                                // registered here, inside the effect.
                                const wire = () => {
                                    document.getElementById('nav-prev').addEventListener('click', () => navigate(-1));
                                    document.getElementById('nav-next').addEventListener('click', () => navigate(1));
                                    backdrop().addEventListener('click', close);

                                    carousel().addEventListener('click', (e) => {
                                        const card = e.target.closest('.card');
                                        if (card) pickCard(card);
                                    });

                                    document.addEventListener('keydown', (e) => {
                                        if (deck.open) {
                                            if (e.key === 'Escape') close();
                                            return;
                                        }
                                        if (e.key === 'ArrowRight') navigate(1);
                                        else if (e.key === 'ArrowLeft') navigate(-1);
                                    });

                                    let touchStartX = 0;
                                    const container = document.getElementById('carousel-container');
                                    container.addEventListener('touchstart', (e) => {
                                        if (deck.open || deck.busy) return;
                                        touchStartX = e.changedTouches[0].screenX;
                                    }, { passive: true });
                                    container.addEventListener('touchend', (e) => {
                                        if (deck.open || deck.busy) return;
                                        const delta = e.changedTouches[0].screenX - touchStartX;
                                        if (Math.abs(delta) > 50) navigate(delta < 0 ? 1 : -1);
                                    }, { passive: true });
                                };

                                return () => {
                                    if (started) return;
                                    started = true;
                                    build();
                                    wire();
                                    layout();
                                };
                            })()
                        }
                    ]
                },
                {
                    // ── Per-card hover ─────────────────────────────────────
                    // listContainer makes each .card its own hover source;
                    // 'alternate' reverses the pair on leave.
                    key: 'carousel',
                    trigger: 'hover',
                    listContainer: '#carousel',
                    effects: [
                        {
                            selector: '.card-image',
                            triggerType: 'alternate',
                            duration: 600,
                            easing: 'ease-out',
                            fill: 'both',
                            keyframeEffect: {
                                name: 'card-image-zoom',
                                keyframes: [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }]
                            }
                        },
                        {
                            selector: '.card-content',
                            triggerType: 'alternate',
                            duration: 350,
                            easing: 'ease-out',
                            fill: 'both',
                            keyframeEffect: {
                                name: 'card-caption-in',
                                keyframes: [{ opacity: 0 }, { opacity: 1 }]
                            }
                        }
                    ]
                },
            ]
        });
    </script>

</body>
</html>
