<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slab Pull</title>
    <!-- Classic (not module) so it runs before the body paints: the split-and-hide
         initial state must never be visible, and a page with JS off must still
         render the headline as ordinary text. -->
    <script>
      document.documentElement.className = 'anim';
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The reference is a 1:1 poster. A site is not square, so nothing here is
         keyed to the poster's width — the type scales off the viewport and the
         artwork off the panel's height, which is the dimension a hero actually
         owns. The poster's own proportions survive as ratios: the headline still
         starts an eighth of the way in, the art still bleeds off two edges. */
      :root {
        /* Black and white: the gutter is the ink, so the panel is framed by a
           hairline of the same black the type is set in. */
        --paper: #0b0b0b;
        --panel: #ffffff;
        --ink: #0b0b0b;

        --gutter: clamp(8px, 0.9vw, 18px);
        --pad: clamp(22px, 4.4vw, 82px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }

      /* interact-element is only a binding hook, so it is kept out of layout. */
      interact-element {
        display: contents;
      }

      .frame {
        padding: var(--gutter);
      }

      .poster {
        position: relative;
        min-height: calc(100svh - 2 * var(--gutter));
        padding: var(--pad);
        background: var(--panel);
        /* clip, never hidden: hidden would open a scroll context on the panel. */
        overflow: clip;
      }

      /* ---- artwork -------------------------------------------------------- */

      /* Pinned to both edges, so on desktop the photograph runs the full height of
         the fold and its width follows from its own ratio. The photograph is left
         exactly as shot: no filter, no blend mode, no screen over it. */
      .art-wrap {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        aspect-ratio: 63 / 80;
        pointer-events: none;
      }

      .art {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* The same reveal as the headline, at poster scale: nine bars of ink over the
         photograph, each eaten away by its own seam. The photograph itself is never
         touched — it is simply uncovered — so it stays exactly as shot while the
         motion reads as one language with the type. */
      .slabs {
        position: absolute;
        inset: 0;
      }

      .slab {
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(var(--i) * (100% / var(--n)));
        /* One pixel of overlap: adjacent tracks round independently and would
           otherwise leak hairlines of the photograph between them. */
        width: calc(100% / var(--n) + 1px);
        background: var(--ink);
        /* Only the left half of the pair the headline uses, so the bar starts
           whole and is eaten from the left instead of arriving first. */
        clip-path: inset(0 0 0 var(--seam));
      }

      /* ---- headline ------------------------------------------------------- */

      .headline {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.7rem, 8vw, 9rem);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }

      .line {
        display: block;
        white-space: pre;
      }

      /* One seam runs down every character. --seam is where it currently sits and
         --edge is how much of the bar has not arrived yet; both are registered so
         they can be animated, and both inherit, so a single animation on .ch
         drives both layers. Two layers animated separately would be two entries in
         one stagger, and the sequence would run all the bars before any glyph. */
      @property --seam {
        syntax: '<percentage>';
        inherits: true;
        initial-value: 100%;
      }
      @property --edge {
        syntax: '<percentage>';
        inherits: true;
        initial-value: 0%;
      }

      /* Each character is its own two-layer stack: a solid bar of ink over the
         glyph. Both are clipped at --seam, in opposite directions, so the bar is
         eaten away from the left at exactly the rate the letter is uncovered and
         the two never overlap or leave a gap. */
      .ch {
        position: relative;
        display: inline-block;
      }

      .ch__blk {
        position: absolute;
        left: -0.012em;
        right: var(--blk-right, -0.012em);
        top: var(--blk-top, 0.2em);
        bottom: 0.07em;
        background: currentColor;
        clip-path: inset(0 var(--edge) 0 var(--seam));
        pointer-events: none;
      }

      /* Three bar shapes in rotation. A uniform bar per letter reads as a loading
         placeholder; letting every third one sit low or run short is what makes
         the row read as a coarse, badly-resolved picture of the words. */
      .ch:nth-child(3n + 2) {
        --blk-top: 0.4em;
      }
      .ch:nth-child(4n + 3) {
        --blk-right: 0.16em;
      }

      .ch__gl {
        display: inline-block;
        clip-path: inset(0 calc(100% - var(--seam)) 0 0);
      }

      /* Pre-animation state. Scoped to .anim so the headline is plain visible text
         when JS never runs, and applied to the split spans only — the characters
         are picked by selector rather than keyed, so generate() emits no initial
         rules of its own for them. The effect fills both ways, so its last
         keyframe outranks this rule for good once the run is over. */
      .anim .line--split .ch {
        --seam: 0%;
        --edge: 100%;
      }
      .anim .slab {
        --seam: 0%;
      }

      /* Between the split and the first frame the headline would otherwise flash
         its unstyled self; .ready is added in the same tick as the split. */
      .anim .line--split {
        visibility: hidden;
      }
      .anim .line--split.ready {
        visibility: visible;
      }

      /* ---- footnote ------------------------------------------------------- */

      /* The one small thing at the bottom of the fold, against three lines of
         display type at the top. It stays put while the headline resolves — the
         whole effect reads as motion because something in the frame is not
         moving. */
      /* Three facts, not a sentence: set as separate items divided by hairlines, so
         the line never breaks mid-phrase and leaves a widow like "easy pace" on a
         line of its own. Each item is nowrap, so a narrow panel drops a whole fact
         to the next line instead of splitting one. */
      .note {
        position: absolute;
        z-index: 1;
        left: var(--pad);
        bottom: var(--pad);
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        row-gap: 0.5em;
        font-size: clamp(0.8rem, 1.05vw, 1rem);
        font-weight: 500;
        letter-spacing: -0.005em;
      }

      .note span {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
      }

      .note span + span::before {
        content: '';
        width: 1px;
        height: 0.95em;
        margin: 0 1.35em;
        background: currentColor;
        opacity: 0.3;
      }

      /* On a phone there is no room for a column beside the headline, so the panel
         becomes three stacked rows and the photograph takes whatever height the
         type leaves it. Taking it out of absolute positioning is the point: at
         narrow widths the headline grows and the footnote wraps, and a band pinned
         to a percentage of the panel would be run into from both ends. Negative
         margins give back the bleed that flow layout takes away. */
      @media (max-width: 767px) {
        .poster {
          display: flex;
          flex-direction: column;
          gap: clamp(18px, 5vw, 34px);
        }

        /* The artwork comes first in the source because it sits behind everything
           on desktop; in the stacked layout the type has to lead, and the order
           properties say so without moving it in the DOM. Left in source order it
           would open the panel with a band of white above the photograph. */
        .headline {
          order: 1;
        }
        .art-wrap {
          order: 2;
        }
        .note {
          order: 3;
        }

        .art-wrap {
          position: relative;
          left: auto;
          right: auto;
          top: auto;
          bottom: auto;
          width: auto;
          height: auto;
          aspect-ratio: auto;
          flex: 1 1 auto;
          min-height: 32svh;
          margin: 0 calc(var(--pad) * -1);
        }

        .art {
          object-position: 50% 32%;
        }

        /* Stacked, and the hairlines go with the row they divided. */
        .note {
          position: static;
          flex-direction: column;
          row-gap: 0.35em;
        }

        .note span + span::before {
          display: none;
        }

        .headline {
          font-size: clamp(2.4rem, 11.5vw, 4.4rem);
        }
      }

      /* The trigger is gated on the same query, so with reduced motion nothing
         ever runs and the headline has to stand on its own. */
      @media (prefers-reduced-motion: reduce) {
        .anim .line--split {
          visibility: visible;
        }
        .anim .line--split .ch {
          --seam: 100%;
          --edge: 0%;
        }
        .anim .slab {
          --seam: 100%;
        }
        .anim .line--split .ch__blk {
          display: none;
        }
      }
    </style>
  </head>

    <script type="module">
      import { Interact, generate } from 'https://esm.sh/@wix/interact@2/web';

      /* Split each headline line into per-character stacks. Done here rather than
         in the markup so the document still carries the words as words — the
         split spans are aria-hidden and the readable text moves to aria-label.
         Spaces stay plain: they own no bar and no glyph, so the sweep crosses a
         word gap in a single frame, the way the reference does. */
      const lines = document.querySelectorAll('.headline .line');
      const words = [];

      lines.forEach((line) => {
        const text = line.textContent;
        words.push(text);
        line.textContent = '';
        line.setAttribute('aria-hidden', 'true');

        for (const character of text) {
          if (character === ' ') {
            line.append(' ');
            continue;
          }
          const cell = document.createElement('span');
          cell.className = 'ch';
          cell.innerHTML = '<i class="ch__blk"></i><span class="ch__gl"></span>';
          cell.lastChild.textContent = character;
          line.append(cell);
        }

        line.classList.add('line--split');
      });

      document.querySelector('.headline').setAttribute('aria-label', words.join(' '));

      /* Nine bars is enough to read as a coarse grid at poster scale and few enough
         that the last one still starts while the headline is finishing. */
      const SLABS = 9;
      const slabs = document.querySelector('.slabs');
      slabs.style.setProperty('--n', SLABS);

      for (let i = 0; i < SLABS; i += 1) {
        const slab = document.createElement('i');
        slab.className = 'slab';
        slab.style.setProperty('--i', i);
        slabs.append(slab);
      }

      /* Two thirds of the run is the seam travelling left to right, so from a third
         of the way on every character shows resolved letter to the left of the seam
         and solid ink to the right of it — the coarse leading edge the reference
         sweeps across the whole headline. The first third is the bar itself
         arriving, --edge opening from nothing to the character's full width.
         steps() is the point of the whole thing: a smooth seam is a wipe, a seam
         that jumps in six equal bites is a picture arriving at six resolutions.
         fill: 'both' because the last keyframe is the finished headline and has to
         outlive the animation. */
      const SEAM = {
        duration: 560,
        easing: 'steps(6, end)',
        fill: 'both',
        keyframeEffect: {
          name: 'slab-pull',
          keyframes: [
            { offset: 0, '--edge': '100%', '--seam': '0%' },
            { offset: 0.34, '--edge': '0%', '--seam': '0%' },
            { offset: 1, '--edge': '0%', '--seam': '100%' },
          ],
        },
      };

      const config = {
        conditions: {
          motion: { type: 'media', predicate: '(prefers-reduced-motion: no-preference)' },
        },
        interactions: [
          {
            key: 'poster',
            trigger: 'viewEnter',
            params: { threshold: 0 },
            conditions: ['motion'],
            /* One trigger on the panel, staggered across every character: the
               characters are targets, not sources, so they are picked by selector
               from a single keyed root instead of carrying keys of their own. One
               selector, not one per layer — a second selector would append its
               matches to the same stagger and run a whole pass behind the first. */
            sequences: [
              { offset: 38, triggerType: 'once', effects: [{ effectId: 'seam', selector: '.ch' }] },
            ],
          },
          /* The bars get their own trigger rather than a second sequence on the
             panel's: only the first sequence of an interaction is ever started, so
             a second one there is generated, indexed, and never played. A second
             selector on the first sequence is no good either — the two selectors
             share one index run, and the bars would queue up behind every
             character. Started a beat late and stepped wider, so both finish
             together. */
          {
            key: 'art',
            trigger: 'viewEnter',
            params: { threshold: 0 },
            conditions: ['motion'],
            sequences: [
              {
                delay: 160,
                offset: 70,
                triggerType: 'once',
                effects: [{ effectId: 'seam', selector: '.slab' }],
              },
            ],
          },
        ],
        effects: { seam: SEAM },
      };

      // No build step on this page, so the interaction CSS is generated here and
      // injected before create() runs. `true` = custom-element integration.
      const sheet = document.createElement('style');
      sheet.textContent = generate(config, true);
      document.head.append(sheet);

      document.querySelectorAll('.line--split').forEach((line) => line.classList.add('ready'));

      Interact.create(config);
    </script>
  </body>
</html>
