<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whip Turn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Everything keys off --card-h, including the perspective, so the deck
         scales as one piece and the foreshortening stays identical to the
         reference (a 284 x 379 poster seen through an ~790px perspective).
         Only --ratio changes between mobile and desktop. */
      :root {
        --ratio: 0.7493; /* 284 / 379 — the reference poster */
        /* The width cap is 74vw, not the flat card width: perspective swells the
           near edge to ~1.3x mid-turn, so the card needs that much room or it
           gets clipped by the viewport at the widest point of the flip. */
        --card-h: min(60svh, 74vw / var(--ratio));
        --card-w: calc(var(--card-h) * var(--ratio));
        --depth: calc(var(--card-h) * 2.0844); /* 790 / 379 */

        --title: calc(var(--card-h) * 0.0884);
        --body: calc(var(--card-h) * 0.0345);
        --pad: calc(var(--card-h) * 0.045);

        --ink: #0d0d0b;
        --paper: #f2f1de;
      }

      /* Desktop gets a wider, more oblong card. Mobile keeps the reference. */
      @media (min-width: 768px) {
        :root {
          --ratio: 1.3333; /* 4 / 3 */
          --card-h: min(62svh, 74vw / var(--ratio));
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #000;
        color: var(--paper);
        font-family: 'Helvetica Neue', Archivo, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        /* Never `overflow: hidden` anywhere above the deck — it creates a scroll
           context and breaks the ViewTimeline the mobile scrub depends on. */
        overflow-x: clip;
      }

      /* The scene is taller than the screen on every size: that extra height is
         the scroll distance the flip is scrubbed across. One and a half screens
         of scroll, so the turn keeps up with an ordinary flick. */
      .scene {
        height: 250svh;
      }

      .stage {
        position: sticky;
        top: 0;
        height: 100svh;
        display: grid;
        place-items: center;
      }

      /* interact-element is only a binding hook, so it is kept out of layout. */
      interact-element {
        display: contents;
      }

      .deck {
        position: relative;
        width: var(--card-w);
        height: var(--card-h);
        perspective: var(--depth);
        transform-style: preserve-3d;
      }

      .card {
        position: absolute;
        inset: 0;
        overflow: clip;
        backface-visibility: hidden; /* hides each card through its off-screen half-turn */
      }

      /* ---------- photo poster ---------- */

      .card--photo {
        background: #000 center / cover no-repeat;
        /* Where the deck rests before the scroll range begins. */
        transform: rotateX(0deg);
      }

      /* The wide card sees only ~60% of the frame's height, so it is pulled up
         to keep the runner's head and stride in shot. */
      @media (min-width: 768px) {
        .card--photo {
          background-position: center 8%;
        }
      }

      /* ---------- text poster: title + paragraph ---------- */

      .card--text {
        background: var(--paper);
        color: var(--ink);
        transform: rotateX(-180deg); /* turned away until the scroll brings it round */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: calc(var(--card-h) * 0.037) var(--pad) var(--pad);
      }

      .card--text h1 {
        margin: 0;
        font-size: var(--title);
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .card--text p {
        margin: 0;
        font-size: var(--body);
        font-weight: 500;
        line-height: 1.4;
        text-wrap: pretty;
      }

      /* Landscape card: title top-left, paragraph settling into the bottom
         right, so the copy keeps a readable measure instead of one long line. */
      @media (min-width: 768px) {
        .card--text {
          display: grid;
          grid-template-columns: 1fr 1.15fr;
          align-items: end;
          column-gap: calc(var(--card-h) * 0.07);
        }

        .card--text h1 {
          align-self: start;
          text-wrap: initial; /* let the column decide the break */
        }

        .card--text p {
          max-width: 36ch;
        }
      }

      /* Reduced motion: the scroll trigger is gated off in the config, so the
         deck is left as a single flat poster. The text card wins because it
         carries the information. */
      @media (prefers-reduced-motion: reduce) {
        /* The generated rule is `[data-interact-key=...] > :first-child` and is
           injected after this sheet, so the tag name is needed to outrank it and
           cancel the (paused, fill: both) animation that would otherwise pin the
           card edge-on. */
        interact-element[data-interact-key] > .card {
          animation: none;
          transform: none;
          backface-visibility: visible;
        }
        .card--photo {
          display: none;
        }
        .scene {
          height: 100svh;
        }
      }
    </style>

  <body>
    <section class="scene">
      <interact-element data-interact-key="stage">
        <div class="stage">
          <div class="deck">
            <interact-element data-interact-key="card-photo">
              <article
                class="card card--photo"
                role="img"
                aria-label="A runner at dusk, caught in motion blur"
              ></article>
            </interact-element>

            <interact-element data-interact-key="card-text">
              <article class="card card--text">
                <h1>Next Group Run</h1>
                <p>
                  Led by Jon Bell. Saturday 24, 07:30 &rarr; 09:00, from the north gate. Eight
                  kilometres at an easy talking pace, back before the city is properly awake.
                  Newcomers welcome, nobody gets left behind, coffee afterwards.
                </p>
              </article>
            </interact-element>
          </div>
        </div>
      </interact-element>
    </section>

    <script type="module">
      import { Interact, generate } from 'https://esm.sh/@wix/interact@2/web';

      const KEYS = ['card-photo', 'card-text'];

      /* One flip, scrubbed by scroll, on every screen size. The two posters are
       * the two sides of the same turn: the photo rotates 0deg -> 180deg while
       * the text rotates -180deg -> 0deg, so they cross edge-on at the halfway
       * point and `backface-visibility: hidden` keeps exactly one of them facing
       * the viewer. Both sides share one easing, so they stay exactly 180deg
       * apart and swap in the same frame. `fill: 'both'` holds the photo flat
       * before the range starts and the text flat after it ends.
       *
       * The scroll distance is the extra height of `.scene`: the stage sticks
       * for one screen while the scene scrolls past it, and the `contain` range
       * covers precisely that travel. */
      const scrubbing = (key, side) => ({
        key,
        rangeStart: { name: 'contain', offset: { value: 0, unit: 'percentage' } },
        rangeEnd: { name: 'contain', offset: { value: 100, unit: 'percentage' } },
        easing: 'quadIn', // eases in slowly, then runs away with the last quarter
        fill: 'both',
        keyframeEffect: {
          name: `scrub-${key}`,
          keyframes: [
            { offset: 0, transform: `rotateX(${side * -180}deg)` },
            { offset: 1, transform: `rotateX(${180 - side * 180}deg)` },
          ],
        },
      });

      const config = {
        conditions: {
          // With reduced motion the trigger never runs; the CSS block in the
          // stylesheet above flattens the deck into a single static poster.
          motion: { type: 'media', predicate: '(prefers-reduced-motion: no-preference)' },
        },
        interactions: [
          {
            key: 'stage',
            trigger: 'viewProgress',
            conditions: ['motion'],
            effects: KEYS.map(scrubbing),
          },
        ],
      };

      // No build step on this page, so the interaction CSS is generated here and
      // injected before create() runs. `true` = custom-element integration.
      const sheet = document.createElement('style');
      sheet.textContent = generate(config, true);
      document.head.append(sheet);

      Interact.create(config);
    </script>
  </body>
</html>
