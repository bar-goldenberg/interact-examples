<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Pixel Dissolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   PIXEL DISSOLVE — CONTACT
   Same page as the cascade flip: black, standing copy left, dark form card right.
   Different way in.

   The white curtain is a 28 × 16 grid of near-square tiles — 448 of them, each
   about 50px, small enough to read as pixels rather than panels. They switch off
   one by one — each holds at full opacity and then blinks out in 40ms, no shrink,
   no fade to sit and watch — and the page appears underneath as the coverage
   thins. It looks like an image resolving.

   The order is the whole trick. A sequence staggers its targets in DOM ORDER, not
   in layout order, so every tile is placed explicitly with `grid-area` and the
   markup is emitted in the order they should go. That order was generated as a
   diagonal sweep with heavy jitter — sorted by `x + 0.6y + noise` — so the
   dissolve travels from the top-left corner without any straight edge to it:
   individual pixels run ahead of the front and others lag behind it.

   Because the order is baked into the markup, no JavaScript computes anything at
   runtime and the stagger stays a plain 2.2ms per tile, linear.

   Two notes:
   - Each tile carries a 1px ring of its own white (`box-shadow`), because
     fractional cell sizes otherwise leave sub-pixel cracks that read as a faint
     grid over the whole curtain.
   - Content safety: the tiles are `opacity: 0` in CSS — invisible. The covered
     state is the animation's FIRST keyframe, held by `fill: 'backwards'` and
     painted by `generate()`. If the library fails to load, or the visitor prefers
     reduced motion, the curtain never exists and the page is simply there. It
     cannot get stuck covering the content.
   - No `will-change` on the tiles: at 448 elements it would ask the compositor
     for 448 layers up front. A plain transform on a small square is cheap enough.
   ============================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --black:#000000;
  --card:#1a1a1a;
  --field:#222222;
  --field-line:#2e2e2e;
  --white:#ffffff;
  --dim:#9a9a9a;
  --placeholder:#7c7c7c;
  --sheet:#ffffff;               /* was the brand blue — the curtain and the
                                    button are now plain white */
  --sheet-hi:#e6e6e6;
  --ease:cubic-bezier(.4,0,.2,1);
}

html{ overflow-x: clip; }
body{
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--black);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;              /* NOT hidden */
}

/* ── The two columns ── */
.main{
  position: relative;
  z-index: 1;
  max-width: 1380px;
  margin: 0 auto;
  padding: 5rem 2rem 7rem;
  display: grid;
  grid-template-columns: minmax(0, 0.86fr) minmax(0, 1fr);
  gap: 5.5rem;
  align-items: start;
}
.standfirst{
  font-size: 1.28rem;
  line-height: 1.52;
  letter-spacing: -0.008em;
  color: var(--white);
  max-width: 27ch;
}

/* ── The form card ── */
.card{
  background: var(--card);
  border-radius: 14px;
  padding: 2.4rem 2.3rem 2.6rem;
  container-type: inline-size;
}
.card h2{
  font-size: 1.42rem;
  font-weight: 500;
  letter-spacing: -0.012em;
  margin-bottom: .75rem;
}
.card .note{
  font-size: .92rem;
  color: var(--dim);
  margin-bottom: 1.9rem;
}

.field{ margin-bottom: 1.35rem; }
.field:last-of-type{ margin-bottom: 0; }
.field label{
  display: block;
  font-size: .95rem;
  margin-bottom: .62rem;
}
.control{
  width: 100%;
  height: 48px;
  font: inherit; font-size: .95rem;
  color: var(--white);
  background: var(--field);
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 0 1rem;
  transition: border-color .22s var(--ease), background-color .22s var(--ease);
}
.control::placeholder{ color: var(--placeholder); }
.control:hover{ border-color: var(--field-line); }
.control:focus{ outline: none; border-color: #5a7fa8; background: #262626; }
textarea.control{
  height: auto; min-height: 118px;
  padding: .85rem 1rem;
  line-height: 1.5;
  resize: vertical;
}

/* the phone row: country code, then the number */
.row-phone{
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: .75rem;
}
/* native selects, restyled — the chevron is drawn with gradients so it takes the
   field's colours rather than the OS palette */
select.control{
  appearance: none;
  padding-right: 2.4rem;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--dim) 50%),
    linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position:
    calc(100% - 20px) 21px,
    calc(100% - 14px) 21px;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  cursor: pointer;
}
select.control option{ background: var(--card); color: var(--white); }

.submit{
  margin-top: 1.9rem;
  font: inherit; font-size: .98rem; cursor: pointer;
  border: 0; border-radius: 6px;
  background: var(--sheet); color: #111;
  padding: .92rem 2.2rem;
}

/* ── The curtain: a 28 × 16 pixel grid ──
   `opacity: 0` on purpose: the covered state belongs to the animation, not to the
   stylesheet — see the note at the top of the file. */
.pixels{
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  grid-template-columns: repeat(28, 1fr);
  grid-template-rows: repeat(16, 1fr);
  pointer-events: none;          /* decorative, and never in the way */
}
.px{
  background: var(--sheet);
  /* No seams: fractional cell sizes leave sub-pixel cracks between tiles that read
     as a faint grid over the curtain. This ring paints 1px of the same white just
     outside each tile and closes them. */
  box-shadow: 0 0 0 1px var(--sheet);
  opacity: 0;                    /* the off state: a pixel is either on or gone */
  /* every tile carries its own grid-area inline, because the markup order is the
     animation order and no longer the layout order */
}

/* ── Responsive ── */
@media (max-width: 1080px){
  .main{
    grid-template-columns: minmax(0, 1fr);
    gap: 2.8rem;
    padding: 3rem 1.25rem 4rem;
  }
  .standfirst{ font-size: 1.12rem; max-width: 46ch; }
  .card{ padding: 1.7rem 1.4rem 2rem; }
}
@container (max-width: 420px){
  .row-phone{ grid-template-columns: 88px minmax(0, 1fr); }
}
</style>
</head>

<script type="module">
/* PIN THE VERSION. Unpinned, esm.sh resolves @wix/interact to 1.114.0, whose
   exports are only Interact / add / remove — no `generate`, and no /web subpath.
   The import would throw and nothing would run. 2.5.8 is the version the rules
   file documents, and it exports Interact / add / generate / remove.

   Vanilla integration: no <interact-element> wrappers, keys bound to the real
   layout elements with add(), and generate(config, false). */
import { Interact, add, generate } from 'https://esm.sh/@wix/interact@2.5.8';

const EASE = 'cubic-bezier(.4,0,.2,1)';

/* CRITICAL — one effectId per effect, and one keyframe name per effect, never
   shared. The runtime derives an interaction's internal id from
   `sourceKey::targetKey::effectId::interactionIndex`, so two effects pointing at
   the same registry entry collapse into one id: only the first survives, while
   generate() has already emitted the initial rules for both. Here there is a
   single effect and a single reference to it, played once per tile by the
   sequence below. */

const config = {
  conditions: {
    'full-motion': { type: 'media', predicate: '(prefers-reduced-motion: no-preference)' },
  },

  effects: {
    /* ── one pixel going out ──
       A switch, not a shrink. The tile holds at full opacity for three quarters of
       its 160ms and then drops in the last 40ms, which at this size reads as an
       instant blink off — no growing gap, no half-scaled square lingering in the
       middle of the grid.

       The plateau is built from repeated keyframes rather than a `steps()` easing
       on purpose: keyframes are spaced evenly and interpolated linearly, which is
       behaviour I can count on, whereas a step function is a string the library
       would have to pass through untouched. If it did not, the tiles would be the
       thing that breaks — and they are what covers the page. */
    'px-out': {
      duration: 160,
      easing: 'linear',
      fill: 'backwards',         /* holds the tile lit until its turn */
      triggerType: 'once',
      conditions: ['full-motion'],
      keyframeEffect: {
        name: 'px-out-kf',
        keyframes: [
          { opacity: 1 },
          { opacity: 1 },
          { opacity: 1 },
          { opacity: 0 },
        ],
      },
    },
  },

  interactions: [
    /* The dissolve. One sequence over all 448 tiles: `selector: '.px'` collects
       them and `offset` is the gap between consecutive ones in DOM order, which
       the markup has already shuffled into a jittered diagonal. 448 × 3.2ms is
       about 1.4s of spread, and each tile blinks off in 40ms of that. */
    {
      key: 'pixels',
      trigger: 'viewEnter',
      params: { threshold: 0 },
      sequences: [{
        delay: 0,
        offset: 3.2,
        offsetEasing: 'linear',
        effects: [{ effectId: 'px-out', selector: '.px' }],
      }],
    },

    /* The button warms up on interest — `interest` rather than `hover` so
       keyboard focus counts too. A StateEffect, not keyframes: a transform on a
       hover source would shift its own hit area and cause re-entry jitter. */
    {
      key: 'send',
      trigger: 'interest',
      effects: [{
        stateAction: 'toggle',
        transition: {
          duration: 220,
          easing: EASE,
          styleProperties: [{ name: 'background-color', value: '#e6e6e6' }],
        },
      }],
    },
  ],
};

/* Optional self-check: open the page with ?debug to print the validator report. */
if (new URLSearchParams(location.search).has('debug')) {
  import('https://esm.sh/@wix/interact-validate@0.1.2')
    .then(({ validateInteractConfig }) => {
      const result = validateInteractConfig(config);
      console.log('[pixel-dissolve] valid:', result.valid);
      for (const e of result.errors ?? []) {
        console.warn(`[${e.severity}] ${e.code}: ${e.message} (at ${(e.path ?? []).join('.')})`);
      }
    })
    .catch(err => console.warn('[pixel-dissolve] validator unavailable:', err));
}

try {
  /* useFirstChild = false for the vanilla integration */
  const style = document.createElement('style');
  style.textContent = generate(config, false);
  document.head.appendChild(style);

  Interact.create(config);

  add(document.querySelector('.pixels'), 'pixels');
  add(document.querySelector('.submit'), 'send');
} catch (err) {
  /* Nothing to un-hide: with no library there is no curtain, and the page is
     simply visible. */
  console.error('[pixel-dissolve] @wix/interact failed to initialise — no animation:', err);
}
</script>
