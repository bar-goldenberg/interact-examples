<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>contact — atoll (letter cascade)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   ATOLL — CONTACT, LETTER CASCADE
   The same page and the same restraint as the word-lift version, and the same
   idea underneath — one enormous word doing all the work, then the page quietly
   assembling behind it — but the word arrives a completely different way.

   1. CASCADE — the word is set letter by letter. Each letter starts below the
      baseline, hidden by a mask that clips exactly at the type's bottom edge, and
      rises into place. 820ms each on `expoOut`, 85ms apart, left to right, so
      five or six letters are in the air at any moment and the word writes itself.
   2. Then the page fades in, on the ramps measured off the original recording:
      the form first (1600ms, 600ms, cubicOut) and the copy last (1780ms, 700ms).

   The letters never move horizontally: each one is already at its final tracking
   before it appears, and the only thing that changes is its vertical position.
   So there is one animation per letter and one axis — no second nested span, no
   per-letter distances to express.

   Nothing is hidden in CSS. Every element's resting state IS its CSS state; the
   below-the-baseline and transparent states live in each animation's first
   keyframe and are held by `fill: 'backwards'`. So a failed import, or a visitor
   who prefers reduced motion, gets the finished page immediately.
   ============================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --bg:#ffffff;                  /* the video's grey was #ebedf0; now plain white */
  --ink:#08121c;
  --field-line:#c9cbd0;
  --muted:#5b626b;
}

html{ overflow-x: clip; }
body{
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow-x: clip;              /* NOT hidden */
  -webkit-font-smoothing: antialiased;
}

/* The headline sits hard against the left edge, and is now the first thing on the
   page, so it carries its own top breathing room. */
.headline{
  padding: 0 1.5rem;
  font-size: 15.4vw;             /* ≈260px at the recorded 1694px width */
  font-weight: 400;
  line-height: .78;
  letter-spacing: -0.035em;
  margin-top: 2.2rem;
}
/* The mask. `clip`, never `hidden`. The padding/negative-margin pair pushes the
   clip box a little below the baseline and then takes the space back out of the
   layout, so a letter translated down by 120% is fully out of sight without the
   headline occupying any extra height. */
.mask{
  display: block;
  overflow: clip;
  padding-bottom: .12em;
  margin-bottom: -.12em;
}
/* One span per letter, one axis, one animation. */
.ly{ display: inline-block; will-change: transform; }

/* ── Body: copy on the left, form on the right ── */
.body{
  display: grid;
  grid-template-columns: minmax(0, 26fr) minmax(0, 61fr);
  column-gap: 12.8%;
  padding: 3.4rem 16% 5rem 1.6rem;
}
.copy{
  font-size: 1.06rem;
  line-height: 1.38;
  letter-spacing: -0.004em;
  max-width: 22ch;
}

.form{ container-type: inline-size; }
.rows{
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 6%;
  row-gap: 1.55rem;
}
.field{ display: flex; flex-direction: column; min-width: 0; }
.field--wide{ grid-column: 1 / -1; }
.field label{
  font-size: .92rem;
  margin-bottom: .5rem;
}
.control{
  height: 40px;
  width: 100%;
  font: inherit; font-size: .95rem;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--field-line);
  border-radius: 2px;
  padding: 0 .75rem;
  transition: border-color .2s cubic-bezier(.4,0,.2,1);
}
.control:hover{ border-color: #a9adb5; }
.control:focus{ outline: none; border-color: var(--ink); }
textarea.control{
  height: 96px;
  padding: .6rem .75rem;
  line-height: 1.45;
  resize: vertical;
}

.submit{
  margin-top: 1.9rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 1.5rem;
  min-width: 216px; height: 54px;
  font: inherit; font-size: .72rem; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase;
  color: #fff; background: var(--ink);
  border: 0; border-radius: 2px;
  cursor: pointer;
}
.submit svg{ width: 15px; height: 15px; flex: none; }

/* ── Responsive ──
   The headline stays a share of the viewport, so it never needs a breakpoint of
   its own; only the two-column body needs breakpoints. */
@media (max-width: 1100px){
  .body{
    grid-template-columns: minmax(0, 1fr);
    row-gap: 2.4rem;
    padding: 2.6rem 1.6rem 4rem;
  }
  .copy{ max-width: 46ch; }
}
@media (max-width: 760px){
  .headline{ font-size: 21vw; }
  .body{ padding: 2rem 1.1rem 3rem; }
  .submit{ width: 100%; }
}
@container (max-width: 430px){
  .rows{ grid-template-columns: 1fr; }
}
</style>

<!-- Output of @wix/interact's generate(config, false), pasted verbatim.
     Re-run generate() if the config at the bottom of this file changes.
     It belongs in the <head>: these rules carry each effect's first
     keyframe, so the start state is painted with the page instead of being
     applied a module-load later, which is what the old runtime
     generate()-into-a-<style> could not do. -->
<style>
@keyframes form-in-kf {
0% {
opacity: 0;
}
100% {
opacity: 1;
}
}
@keyframes copy-in-kf {
0% {
opacity: 0;
}
100% {
opacity: 1;
}
}
@keyframes letter-rise-kf {
0% {
transform: translateY(120%);
}
100% {
transform: translateY(0%);
}
}
@media ((prefers-reduced-motion: no-preference)) {
[data-interact-key="page"] .form {
--animation-0-pkotusynyv: form-in-kf 600ms 1600ms cubic-bezier(0.215, 0.61, 0.355, 1) backwards 1 paused;
--animation-composition-0-pkotusynyv: replace;
--animation-timeline-0-pkotusynyv: auto;
--animation-range-0-pkotusynyv: normal;
}
}
@media ((prefers-reduced-motion: no-preference)) {
[data-interact-key="page"] .copy {
--animation-0-pknms2miz7: copy-in-kf 700ms 1780ms cubic-bezier(0.215, 0.61, 0.355, 1) backwards 1 paused;
--animation-composition-0-pknms2miz7: replace;
--animation-timeline-0-pknms2miz7: auto;
--animation-range-0-pknms2miz7: normal;
}
}
[data-interact-key="page"] .ly {
--animation-0-0-vyhs1e0zr9: letter-rise-kf 820ms calc((60 + (var(--motion-seq-0-0-index, 0) / var(--motion-seq-0-0-last, 1)) * 85 * var(--motion-seq-0-0-last, 1)) * 1ms) cubic-bezier(0.19, 1, 0.22, 1) backwards 1 paused;
--animation-composition-0-0-vyhs1e0zr9: replace;
--animation-timeline-0-0-vyhs1e0zr9: auto;
--animation-range-0-0-vyhs1e0zr9: normal;
}
[data-interact-key="page"] .ly {
--animation-0-vyhs1e0zr9: var(--animation-0-0-vyhs1e0zr9, none);
--animation-composition-0-vyhs1e0zr9: var(--animation-composition-0-0-vyhs1e0zr9, replace);
--animation-timeline-0-vyhs1e0zr9: var(--animation-timeline-0-0-vyhs1e0zr9, auto);
--animation-range-0-vyhs1e0zr9: var(--animation-range-0-0-vyhs1e0zr9, normal);
}
[data-interact-key="page"] .form {
animation: var(--animation-0-pkotusynyv, none);
animation-composition: var(--animation-composition-0-pkotusynyv, replace);
animation-timeline: var(--animation-timeline-0-pkotusynyv, auto);
animation-range: var(--animation-range-0-pkotusynyv, normal);
}
[data-interact-key="page"] .copy {
animation: var(--animation-0-pknms2miz7, none);
animation-composition: var(--animation-composition-0-pknms2miz7, replace);
animation-timeline: var(--animation-timeline-0-pknms2miz7, auto);
animation-range: var(--animation-range-0-pknms2miz7, normal);
}
[data-interact-key="page"] .ly {
animation: var(--animation-0-vyhs1e0zr9, none);
animation-composition: var(--animation-composition-0-vyhs1e0zr9, replace);
animation-timeline: var(--animation-timeline-0-vyhs1e0zr9, auto);
animation-range: var(--animation-range-0-vyhs1e0zr9, normal);
}
</style>
</head>
<body>

<div class="shell" data-interact-key="page">

  <h1 class="headline" aria-label="contact">
    <span class="mask" aria-hidden="true"><span class="ly">c</span><span class="ly">o</span><span class="ly">n</span><span class="ly">t</span><span class="ly">a</span><span class="ly">c</span><span class="ly">t</span></span>
  </h1>

  <!-- ── Copy + form ── -->
  <div class="body">

    <p class="copy">We&rsquo;re thrilled that you&rsquo;re here! Please tell us more about your project.</p>

    <section class="form">
      <form class="rows" novalidate>

        <div class="field">
          <label for="email">Email *</label>
          <input class="control" id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="firstname">First Name</label>
          <input class="control" id="firstname" name="firstname" type="text" autocomplete="given-name">
        </div>

        <div class="field">
          <label for="company">Company name</label>
          <input class="control" id="company" name="company" type="text" autocomplete="organization">
        </div>

        <div class="field field--wide">
          <label for="message">Message</label>
          <textarea class="control" id="message" name="message"></textarea>
        </div>

        <div class="field field--wide">
          <button class="submit" type="submit">
            Submit
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>

      </form>
    </section>

  </div>

</div>

<script type="module">
/* PIN THE VERSION. Unpinned, esm.sh resolves @wix/interact to 1.114.0, whose
   exports are only Interact / add / remove — no `generate`, and no /web subpath.
   The import would throw and nothing would run. 2.5.8 is the version the rules
   file documents, and it exports Interact / add / generate / remove.

   Vanilla integration: no <interact-element> wrappers, keys bound to the real
   layout elements with add(), and generate(config, false). */
import { Interact, add } from 'https://esm.sh/@wix/interact@2.5.8';

/* CRITICAL — one effectId per effect, and one keyframe name per effect, never
   shared. An interaction's internal id is derived from
   `sourceKey::targetKey::effectId::interactionIndex`. Every effect below runs off
   the same source ('page'), in the same interaction, and resolves to the same
   target root — so if any two of them referenced one registry entry they would
   collapse to a single id: only the first would survive, while generate() had
   already emitted the hidden first keyframe for both, and something would stay
   off-screen or transparent for good. Hence one entry per target, even where the
   timing is identical. */

const config = {
  conditions: {
    'full-motion': { type: 'media', predicate: '(prefers-reduced-motion: no-preference)' },
  },

  effects: {
    /* ── beat 1: each letter rises out of the mask ──
       120% down to nothing, `expoOut`, 820ms. The 85ms gap between letters lives
       on the sequence, not here. */
    'letter-rise': {
      duration: 820,
      easing: 'expoOut',
      fill: 'backwards',
      triggerType: 'once',
      conditions: ['full-motion'],
      keyframeEffect: {
        name: 'letter-rise-kf',
        keyframes: [
          { transform: 'translateY(120%)' },
          { transform: 'translateY(0%)'   },
        ],
      },
    },

    /* ── beat 4: the page arrives ──
       Two fades, measured separately because they are not in step: the form ramps
       first and fastest, the copy follows. Opacity only — nothing here moves. */
    'form-in': {
      duration: 600,
      delay: 1600,
      easing: 'cubicOut',
      fill: 'backwards',
      triggerType: 'once',
      conditions: ['full-motion'],
      keyframeEffect: {
        name: 'form-in-kf',
        keyframes: [{ opacity: 0 }, { opacity: 1 }],
      },
    },
    'copy-in': {
      duration: 700,
      delay: 1780,
      easing: 'cubicOut',
      fill: 'backwards',
      triggerType: 'once',
      conditions: ['full-motion'],
      keyframeEffect: {
        name: 'copy-in-kf',
        keyframes: [{ opacity: 0 }, { opacity: 1 }],
      },
    },
  },

  interactions: [
    /* One trigger for the whole intro. The source is the page shell, which is in
       view at load, so this fires immediately — the choreography lives entirely
       in the per-effect delays above. */
    {
      key: 'page',
      trigger: 'viewEnter',
      params: { threshold: 0 },
      /* One sequence over the seven letters. A sequence staggers its targets in
         DOM order, which here is simply left to right. */
      sequences: [
        {
          delay: 60,
          offset: 85,
          offsetEasing: 'linear',
          effects: [{ effectId: 'letter-rise', selector: '.ly' }],
        },
      ],
      effects: [
        { effectId: 'form-in', selector: '.form' },
        { effectId: 'copy-in', selector: '.copy' },
      ],
    },
  ],
};


try {
  /* The generated CSS is already in the <head>; this only wires the
     triggers and binds the keys. */
  Interact.create(config);

  add(document.querySelector('.shell'), 'page');
} catch (err) {
  /* Nothing to un-hide: without the library the page is simply already there. */
  console.error('[atoll-cascade] @wix/interact failed to initialise — no intro:', err);
}
</script>
</body>
</html>
