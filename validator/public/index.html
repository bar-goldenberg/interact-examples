<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interact Validator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Full-bleed viewport (behind the floating panels) -->
  <div id="viewport">
    <iframe id="preview" title="preview"></iframe>
    <pre id="code" hidden></pre>
    <div id="diff" hidden></div>
    <div id="placeholder"><div class="ic">◈</div><p>Select a file to preview</p></div>
  </div>

  <!-- Floating tab groups: mode (Preview/Code/Diff) + version (Current/Draft) -->
  <div id="topbar">
    <div id="modeTabs" class="glass seg">
      <button data-mode="preview" class="tab active">Preview</button>
      <button data-mode="code" class="tab">Code</button>
      <button data-mode="diff" class="tab">Diff</button>
    </div>
    <div id="verTabs" class="glass seg">
      <button data-ver="current" class="tab active">Current</button>
      <button data-ver="draft" class="tab">Draft</button>
    </div>
  </div>

  <!-- Left panel: files -->
  <aside id="listPane" class="glass">
    <div class="brand"><span class="logo"></span> Interact Validator</div>
    <div class="list-actions">
      <button id="scanBtn" class="btn btn-primary">Scan</button>
      <button id="selectAllBtn" class="btn">Select all</button>
    </div>
    <div id="summary"></div>
    <div class="list-head">
      <input id="filter" class="search" type="search" placeholder="Filter files…" autocomplete="off" />
    </div>
    <ul id="fileList"></ul>
  </aside>

  <!-- Right panel: fixes -->
  <aside id="fixPane" class="glass">
    <h2 class="panel-title">Fix options</h2>
    <form id="fixOptions"></form>
    <textarea id="customPrompt" placeholder="Custom instructions (optional)…"></textarea>
    <button id="fixBtn" class="btn btn-primary btn-block">Fix selected</button>
    <div id="fixProgress"></div>
    <div class="divider"></div>
    <div class="apply-actions">
      <button id="applyBtn" class="btn">Apply selected</button>
      <button id="discardBtn" class="btn">Discard selected</button>
    </div>
    <div id="applyStatus"></div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
