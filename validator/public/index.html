<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interact Validator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="brand"><span class="logo"></span> Interact Validator</div>
    <div class="toolbar">
      <div id="summary" class="stats"></div>
      <button id="selectAllBtn" class="btn">Select all</button>
      <button id="scanBtn" class="btn btn-primary">Scan</button>
    </div>
  </header>
  <main>
    <aside id="listPane">
      <div class="list-head">
        <input id="filter" class="search" type="search" placeholder="Filter files…" autocomplete="off" />
      </div>
      <ul id="fileList"></ul>
    </aside>

    <section id="detailPane">
      <div class="detail-head">
        <div class="segmented">
          <button data-tab="preview" class="tab active">Preview</button>
          <button data-tab="code" class="tab">Code</button>
          <button data-tab="diff" class="tab">Diff</button>
        </div>
      </div>
      <div class="viewport">
        <iframe id="preview" title="preview"></iframe>
        <pre id="code" hidden></pre>
        <div id="diff" hidden></div>
      </div>
    </section>

    <aside id="fixPane">
      <h2 class="panel-title">Fix options</h2>
      <form id="fixOptions"></form>
      <textarea id="customPrompt" placeholder="Custom instructions (optional)…"></textarea>
      <button id="fixBtn" class="btn btn-primary btn-block">Fix selected</button>
      <div id="fixStatus"></div>
      <div class="divider"></div>
      <div class="apply-actions">
        <button id="applyBtn" class="btn">Apply drafts</button>
        <button id="discardBtn" class="btn">Discard</button>
      </div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
